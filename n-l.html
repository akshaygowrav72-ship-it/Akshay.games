<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Nuke Impact Simulator</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body { 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            font-family: sans-serif; 
        }
        #sidebar { 
            width: 310px; 
            padding: 12px; 
            background: #111; 
            color: #eee; 
            box-sizing: border-box; 
            overflow: auto; 
        }
        #map { 
            flex: 1; 
        }
        label { 
            display: block; 
            margin-top: 8px; 
            font-size: 13px;
        }
        input[type=range], input[type=number], select { 
            width: 100%; 
            box-sizing: border-box;
            margin-top: 4px;
        }
        button {
            margin-top: 16px;
            width: 100%;
            padding: 8px;
            background: #cc0000;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #aa0000;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Nuke Impact Simulator</h2>
        <p style="font-size:11px;color:#ccc;">
            This educational model uses standard cube-root physical scaling models to estimate effects. Real-world damage depends heavily on altitude, weather, and building topography.
        </p>
        
        <label> 
            Yield (kT): <span id="yieldValue">100</span>
            <input id="yield" type="range" min="1" max="50000" value="100" step="1">
        </label>
        
        <label> 
            Burst type: 
            <select id="burstType">
                <option value="air">Airburst (Max Blast Radius)</option>
                <option value="ground">Groundburst (Produces Fallout)</option>
            </select>
        </label>
        
        <label> 
            Population density (people / km²)
            <input id="popDensity" type="number" value="5000" min="0" step="100">
        </label>
        
        <label> 
            Property value (USD / km²)
            <input id="valueDensity" type="number" value="500000000" min="0" step="1000000">
        </label>
        
        <label> 
            Total regional population cap
            <input id="maxPop" type="number" value="335000000" min="0">
        </label>
        
        <button id="launchBtn">Simulate Detonation</button>
        <div id="info" style="margin-top:16px; font-size:13px; line-height:1.4;"></div>
    </div>
    
    <div id="map"></div>

    <script src="https://unpkg.com"></script>
    <script>
        // Map configuration
        let map = L.map('map', { minZoom: 1, maxZoom: 18 }).setView([20, 0], 3);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let groundZero = null;
        let layers = [];

        // Interactive placement
        map.on('click', e => {
            if (groundZero) groundZero.remove();
            groundZero = L.marker(e.latlng).addTo(map);
        });

        const yieldInput = document.getElementById('yield');
        const yieldValue = document.getElementById('yieldValue');
        const burstType = document.getElementById('burstType');
        const info = document.getElementById('info');

        yieldInput.addEventListener('input', () => {
            yieldValue.textContent = Number(yieldInput.value).toLocaleString();
        });

        document.getElementById('launchBtn').onclick = () => {
            if (!groundZero) {
                alert('Click anywhere on the map to set ground zero.');
                return;
            }

            // 1. INPUT VALIDATION & SANITIZATION
            const W = Math.max(1, parseFloat(yieldInput.value) || 1);
            const type = burstType.value;
            const popDensity = Math.max(0, parseFloat(document.getElementById('popDensity').value) || 0);
            const valueDensity = Math.max(0, parseFloat(document.getElementById('valueDensity').value) || 0);
            const maxPop = Math.max(0, parseFloat(document.getElementById('maxPop').value) || 0);

            // Clear previous simulation assets
            layers.forEach(layer => map.removeLayer(layer));
            layers = [];

            // 2. ACCURATE SCALING PHYSICS (Cube-root equations base)
            // Groundburst modifier updates fireball and diminishes thermal/blast ranges due to ground interference
            const isGround = type === 'ground';
            const fireballRadius = 110 * Math.pow(W, 0.4) * (isGround ? 1.0 : 1.0); 
            const heavyBlastRadius = 820 * Math.pow(W, 0.3333) * (isGround ? 0.75 : 1.0); // 5-psi overpressure
            const lightBlastRadius = 2200 * Math.pow(W, 0.3333) * (isGround ? 0.75 : 1.0); // 1-psi overpressure

            const latlng = groundZero.getLatLng();

            // Helper to build circles with semantic labels
            function addCircle(radius, color, label) {
                const c = L.circle(latlng, { 
                    radius: radius, 
                    color: color, 
                    fillColor: color, 
                    fillOpacity: 0.2 
                });
                c.bindPopup(`<b>${label}</b><br>Radius: ${(radius / 1000).toFixed(2)} km`);
                c.addTo(map);
                layers.push(c);
            }

            // Add blast boundaries to map (drawn largest first for hover/z-index layering)
            let radiationRadius = 0;
            if (isGround) {
                radiationRadius = 3200 * Math.pow(W, 0.3333); // Early high-dose fallout boundary approximation
                addCircle(radiationRadius, '#66ccff', 'High Fallout Radiation Zone');
            }
            addCircle(lightBlastRadius, '#ffaa00', 'Light Blast Damage (1 psi)');
            addCircle(heavyBlastRadius, '#ff0000', 'Severe Blast Damage (5 psi)');
            addCircle(fireballRadius, '#ff6600', 'Fireball Thermal Radius');

            // 3. CORRECT RING AREA MATHEMATICS (Independent Concentric Math)
            function getCircleAreaKm2(r) {
                return Math.PI * Math.pow(r / 1000, 2);
            }

            const areaFireball = getCircleAreaKm2(fireballRadius);
            const areaHeavyTotal = getCircleAreaKm2(heavyBlastRadius);
            const areaLightTotal = getCircleAreaKm2(lightBlastRadius);

            // Compute exact mutually exclusive structural rings
            const ringFireball = areaFireball;
            const ringHeavy = Math.max(0, areaHeavyTotal - areaFireball);
            const ringLight = Math.max(0, areaLightTotal - areaHeavyTotal);

            // 4. DAMAGE COMPILATION
            const fatalFracFireball = 0.98;
            const fatalFracHeavy = 0.50;
            const fatalFracLight = 0.05;

            const deathsFireball = ringFireball * popDensity * fatalFracFireball;
            const deathsHeavy = ringHeavy * popDensity * fatalFracHeavy;
            const deathsLight = ringLight * popDensity * fatalFracLight;

            let totalDeaths = deathsFireball + deathsHeavy + deathsLight;
            if (totalDeaths > maxPop) totalDeaths = maxPop; // Apply cap safeguard

            // Economic property losses within the entire functional damage circle
            const totalDamagedArea = areaLightTotal;
            const propertyLoss = totalDamagedArea * valueDensity;

            // Update UI Sidebar
            info.innerHTML = `
                <div style="border-top: 1px solid #444; padding-top:10px;">
                    <b>Structural Metrics</b><br>
                    • Fireball: ${(fireballRadius / 1000).toFixed(2)} km<br>
                    • Heavy Blast (~5 psi): ${(heavyBlastRadius / 1000).toFixed(2)} km<br>
                    • Light Blast (~1 psi): ${(lightBlastRadius / 1000).toFixed(2)} km<br>
                    ${isGround ? `• Initial Fallout Radius: ${(radiationRadius / 1000).toFixed(2)} km<br>` : ''}
                    <br>
                    <b>Aggregated Impact Estimates</b><br>
                    • Total Estimated Casualties: ~<b>${Math.round(totalDeaths).toLocaleString()}</b> people<br>
                    • Total Destruction Area: <b>${totalDamagedArea.toFixed(1)}</b> km²<br>
                    • Estimated Infrastructure Loss: <b>$${Math.round(propertyLoss).toLocaleString()}</b>
                </div>`;
        };
    </script>
</body>
</html>
