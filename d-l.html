<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Worst Volume Control: The Game</title>
<style>
:root{--bg:#fff;--card:#fff;--field:#f3f1ea;--line:#c9c9c9;--txt:#111;--dim:#666;--acc:#9a6b00;--accfg:#fff;--good:#177a4c;--bad:#c9203f;color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1e2a;--field:#0d0f16;--line:#3a3f55;--txt:#f1f1f1;--dim:#9aa0b8;--acc:#ffd166;--accfg:#241c04;--good:#3ddc91;--bad:#ff5c7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1b1e2a;--field:#0d0f16;--line:#3a3f55;--txt:#f1f1f1;--dim:#9aa0b8;--acc:#ffd166;--accfg:#241c04;--good:#3ddc91;--bad:#ff5c7a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Georgia,"Times New Roman",serif;min-height:100vh;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
#wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:20px;letter-spacing:1px;margin:10px 2px 2px}h1 span{color:var(--acc)}
.sub{color:var(--dim);font-size:13px;margin:0 2px 12px}
#hud{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:80px}
.stat.grow{flex:1;min-width:220px}
.label{display:block;font-size:10px;letter-spacing:1.5px;color:var(--dim)}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
#volbar{position:relative;height:14px;background:var(--field);border:1px solid var(--line);border-radius:8px;margin:6px 0 4px;overflow:hidden}
#volfill{height:100%;width:0;background:var(--acc);transition:background .15s}
#volfill.ok{background:var(--good)}
#volmark{position:absolute;top:0;bottom:0;width:3px;background:var(--txt)}
#volnow{font-size:12px;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.cat{display:inline-block;font-size:10px;letter-spacing:1.5px;color:var(--acc);border:1px solid var(--acc);border-radius:6px;padding:2px 8px;margin-bottom:6px}
.cname{font-size:20px;font-weight:700}.cdesc{color:var(--dim);font-size:14px;line-height:1.45;margin-top:2px}
#mount{min-height:200px;margin-top:12px}
canvas{display:block;width:100%;max-width:640px;margin:0 auto;border-radius:10px;background:var(--field);touch-action:none}
.lockbar{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
button{font-family:inherit;color:var(--txt)}
.btn{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
#lock{flex:1;min-width:160px;font-size:17px;font-weight:700;letter-spacing:1px;padding:14px;background:var(--field);color:var(--dim);border:1px solid var(--line);border-radius:12px;cursor:not-allowed}
#lock.ready{background:var(--good);color:#fff;border-color:var(--good);cursor:pointer}
#toasts{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--card);color:var(--txt);border:1px solid var(--bad);padding:9px 16px;border-radius:10px;font-size:13px;max-width:80vw;text-align:center;animation:tout .4s ease 2.2s forwards}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100}
#ovbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 36px;max-width:520px;text-align:center;margin:14px}
#ovtitle{font-size:24px;font-weight:800;margin-bottom:10px}
#ovsub{color:var(--dim);font-size:14px;line-height:1.55;margin-bottom:20px;white-space:pre-line}
.bigbtn{background:var(--acc);color:var(--accfg);font-weight:800;font-size:16px;border:none;border-radius:12px;padding:13px 32px;cursor:pointer}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.mid{text-align:center;color:var(--dim);font-size:13px;margin-top:8px}
.field{width:min(360px,90%);font-size:22px;text-align:center;font-family:ui-monospace,Consolas,monospace;background:var(--field);color:var(--txt);caret-color:var(--txt);border:2px solid var(--line);border-radius:10px;padding:10px;outline:none}
.field:focus{border-color:var(--acc)}
.field.err{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pi{text-align:center;padding:16px}.pi b{font:26px ui-monospace,monospace;color:var(--acc);margin-right:6px}
.track{position:relative;height:50px;margin:46px auto;width:min(480px,92%);background:var(--field);border:2px solid var(--line);border-radius:25px;touch-action:none}
.track.tilt{transform:rotate(-9deg)}
.knob{position:absolute;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--acc);cursor:grab;touch-action:none}
#grid{height:280px;overflow-y:auto;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,30px);gap:3px}
#grid button{height:24px;font-size:10px;padding:0;background:var(--card);border:1px solid var(--line);border-radius:4px;cursor:pointer}
#grid button:hover{background:var(--acc);color:var(--accfg)}
.bits{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:18px 0}
.bit{text-align:center;font-size:12px;color:var(--dim)}
.bitbox{width:56px;height:56px;margin-top:4px;font-size:26px;font-weight:800;border-radius:12px;background:var(--field);border:2px solid var(--line);cursor:pointer}
.bitbox.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.dice{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:14px 0 6px}
.die{width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;background:#f4f6ff;color:#1a1d33;border:1px solid var(--line);border-radius:12px}
.dice label{display:block;text-align:center;margin-top:6px;font-size:12px;color:var(--dim);cursor:pointer}
</style>
</head>
<body>
<div id="toasts" aria-live="polite"></div>
<div id="wrap">
  <h1>WORST VOLUME CONTROL <span>THE GAME</span></h1>
  <p class="sub">Inspired by the r/ProgrammerHumor Worst Volume Control UI competition. Set the volume to the target. Good luck.</p>
  <div id="hud">
    <div class="stat"><span class="label">TARGET</span><span class="big" id="target">--%</span></div>
    <div class="stat grow"><span class="label">YOUR VOLUME <span id="tolnote"></span></span>
      <div id="volbar"><div id="volfill"></div><div id="volmark"></div></div><span id="volnow">0%</span></div>
    <div class="stat"><span class="label">TAMED</span><span class="big" id="done">0</span></div>
    <div class="stat"><span class="label">TIME</span><span class="big" id="time">0:00</span></div>
  </div>
  <div class="card">
    <span class="cat" id="ccat"></span>
    <div class="cname" id="cname"></div>
    <div class="cdesc" id="cdesc"></div>
    <div id="mount"></div>
    <div class="lockbar">
      <button id="lock" disabled>LOCK IT IN</button>
    </div>
  </div>
</div>
<div id="overlay"><div id="ovbox"><div id="ovtitle"></div><div id="ovsub"></div><button class="bigbtn" id="ovbtn">START</button></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const mk=(tag,cls,parent,text)=>{const d=document.createElement(tag);if(cls)d.className=cls;if(text!=null)d.textContent=text;if(parent)parent.appendChild(d);return d};
const listen=(el,ev,fn,o)=>{el.addEventListener(ev,fn,o);return()=>el.removeEventListener(ev,fn,o)};
const typing=()=>/^(INPUT|TEXTAREA)$/.test(document.activeElement&&document.activeElement.tagName);
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

const S={target:0,volume:0,tol:0,round:0,done:0,playing:false,t0:0,extraOK:true};
const E={target:$('#target'),fill:$('#volfill'),mark:$('#volmark'),now:$('#volnow'),done:$('#done'),time:$('#time'),tol:$('#tolnote'),
  mount:$('#mount'),lock:$('#lock'),cat:$('#ccat'),name:$('#cname'),desc:$('#cdesc'),
  ov:$('#overlay'),ovt:$('#ovtitle'),ovs:$('#ovsub'),ovb:$('#ovbtn')};
let cur=null,bag=[],audio=null;

function toast(m){const d=mk('div','toast',$('#toasts'),m);setTimeout(()=>d.remove(),2700)}
function setVolume(v){S.volume=clamp(v,0,100)}
const inRange=()=>S.playing&&S.extraOK&&Math.abs(Math.round(S.volume)-S.target)<=S.tol;
function beep(f){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();
  o.type='triangle';o.frequency.value=f;g.gain.value=.1;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.2)}catch(e){}}

const SNARK=['Settings saved. Somewhere, a UX designer is crying.','Incredible. You fought the interface and won.','The volume is set. Was it worth it?',
 'Certified. You may proceed to the next abomination.','Your perseverance has been noted and will be used against you.','Achievement unlocked: Temporarily Defeated Bad Design.'];

function overlay(title,sub,btn,fn){E.ovt.textContent=title;E.ovs.textContent=sub;E.ovb.textContent=btn;E.ovb.onclick=fn;E.ov.hidden=false;E.ov.style.display='flex';E.ovb.focus()}
function hideOverlay(){E.ov.style.display='none'}

function nextRound(){
  if(cur&&cur.cleanup)cur.cleanup();
  cur=null;E.mount.replaceChildren();
  if(!bag.length)bag=CH.slice().sort(()=>Math.random()-.5);
  const ch=bag.pop();
  S.round++;S.tol=ch.tol;S.extraOK=true;
  S.target=ch.target?ch.target():rand(5,95);
  setVolume(0);
  E.target.textContent=S.target+'%';
  E.tol.textContent=ch.tol?'(\u00b1'+ch.tol+')':'(exact)';
  E.cat.textContent=ch.cat+' \u2022 ROUND '+S.round;
  E.name.textContent=ch.name;E.desc.textContent=ch.desc;
  E.done.textContent=S.done;
  cur=ch.mount(E.mount,{set:setVolume,extra:ok=>{S.extraOK=ok},toast})||{};
}
function start(){hideOverlay();S.playing=true;S.t0=performance.now();S.done=0;S.round=0;nextRound()}
function complete(){
  S.done++;S.playing=false;beep(220+S.target*8);
  overlay('VOLUME SET: '+S.target+'%',pick(SNARK),'NEXT CONTROL',()=>{hideOverlay();S.playing=true;nextRound()});
}
E.lock.onclick=()=>{if(inRange())complete()};
overlay('WORST VOLUME CONTROL',CH_INTRO(),'START',start);
function CH_INTRO(){return 'A set of truly terrible volume controls.\nSet the volume. Lock it in. Survive.'}

let last=performance.now();
(function frame(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(S.playing){
    if(cur&&cur.tick)cur.tick(dt);
    const ok=inRange();E.lock.disabled=!ok;E.lock.classList.toggle('ready',ok);
    E.time.textContent=fmt(performance.now()-S.t0);
  }
  const shown=Math.round(S.volume);
  E.now.textContent=shown+'%';E.fill.style.width=S.volume+'%';
  E.mark.style.left='calc('+S.target+'% - 1px)';
  E.fill.classList.toggle('ok',inRange());
  requestAnimationFrame(frame);
})(last);

/* Shared helper: drag a knob along a track, returns 0..1 */
function dragKnob(track,knob,onMove,onEnd,angle=0){
  let held=false;
  const frac=e=>{const r=track.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    const dx=e.clientX-cx,dy=e.clientY-cy,u=dx*Math.cos(angle)+dy*Math.sin(angle);
    return clamp(u/(track.offsetWidth)+.5,0,1)};
  return[
    listen(knob,'pointerdown',e=>{e.preventDefault();held=true;knob.setPointerCapture(e.pointerId);onMove(frac(e))}),
    listen(knob,'pointermove',e=>{if(held)onMove(frac(e))}),
    listen(knob,'pointerup',()=>{held=false;onEnd&&onEnd()}),
    listen(knob,'pointercancel',()=>{held=false;onEnd&&onEnd()})];
}
const safeEval=s=>{let i=0;
  const f=()=>{if(s[i]==='-'){i++;return -f()}
    if(s[i]==='('){i++;const v=e();if(s[i++]!==')')throw 0;return v}
    const m=/^\d+(\.\d+)?/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return +m[0]};
  const t=()=>{let v=f();while(s[i]==='*'||s[i]==='/'){const o=s[i++],r=f();v=o==='*'?v*r:v/r}return v};
  const e=()=>{let v=t();while(s[i]==='+'||s[i]==='-'){const o=s[i++],r=t();v=o==='+'?v+r:v-r}return v};
  const v=e();if(i<s.length)throw 0;return v};

const CH=[
{cat:'PHYSICS',tol:1,name:'The Slanted Slider',desc:'A slider on a slope. Let go and gravity drags it back to 0%. Hold on tight.',
 mount(root,api){
  const tr=mk('div','track tilt',root),kn=mk('div','knob',tr);
  mk('div','mid',root,'Drag the knob. Physics handles the rest.');
  let x=0,v=0,held=false;
  const offs=dragKnob(tr,kn,f=>{held=true;x=f;v=0;api.set(f*100)},()=>{held=false},-9*Math.PI/180);
  return{tick(dt){if(!held){v+=.9*dt;v*=Math.pow(.55,dt);x=clamp(x-v*dt,0,1);if(x<=0)v=0;api.set(x*100)}
    kn.style.left=x*100+'%'},cleanup(){offs.forEach(f=>f())}};
 }},
{cat:'PHYSICS',tol:1,name:'The Bike Pump',desc:'Pump to build pressure. Stop and it deflates. Click the pump or press SPACE.',
 mount(root,api){
  const w=mk('div','mid',root);
  const bar=mk('div','track',w);bar.style.cssText+='height:26px;margin:20px auto';
  const fill=mk('div',null,bar);fill.style.cssText='height:100%;background:var(--good);border-radius:25px;width:0';
  const b=mk('button','btn',w,'PUMP (+0.8%)');
  const stroke=()=>api.set(S.volume+.8);
  const offs=[listen(b,'pointerdown',e=>{e.preventDefault();stroke()}),
    listen(window,'keydown',e=>{if(e.code==='Space'&&!e.repeat&&!typing()){e.preventDefault();stroke()}})];
  return{tick(dt){api.set(Math.max(0,S.volume-(1.1+S.volume*.02)*dt));fill.style.width=S.volume+'%'},cleanup(){offs.forEach(f=>f())}};
 }},
{cat:'DATA ENTRY',tol:0,name:'The Pi Requirement',desc:'Type the digits of Pi. Each correct digit is +1%. One typo resets everything.',
 target(){return rand(5,30)},
 mount(root,api){
  const PI='14159265358979323846264338327950288419716939937510582097494459230781640628620899862803482534211706798214808651328230664709384460955058223172535940812848111745028410270193852110555964462294895493038196';
  const w=mk('div','pi',root);mk('b',null,w,'3.');
  const inp=mk('input','field',w);inp.inputMode='numeric';inp.autocomplete='off';inp.spellcheck=false;inp.placeholder='type decimals\u2026';inp.setAttribute('aria-label','Digits of pi');
  mk('div','mid',w,'Correct digits = volume %.');
  const off=listen(inp,'input',()=>{
    const val=inp.value.replace(/\D/g,'');inp.value=val;
    if(PI.startsWith(val))api.set(val.length);
    else{api.set(0);inp.value='';inp.classList.remove('err');void inp.offsetWidth;inp.classList.add('err');api.toast('WRONG DIGIT. The audio is gone.')}});
  setTimeout(()=>inp.focus(),50);
  return{cleanup:off};
 }},
{cat:'DATA ENTRY',tol:0,name:'The Radio Button Grid',desc:'One thousand numbered buttons. Somewhere in here is your exact volume. No sort function.',
 mount(root,api){
  const g=mk('div',null,root);g.id='grid';
  const labels=Array.from({length:1000},()=>rand(0,100));
  for(let k=0;k<8;k++)labels[rand(0,999)]=S.target;
  labels.forEach(n=>{const b=mk('button',null,g,n);b.onclick=()=>api.set(n)});
  return{};
 }},
{cat:'DATA ENTRY',tol:0,name:'The Binary Selector',desc:'Seven bits: 64 32 16 8 4 2 1. Assemble the number yourself.',
 mount(root,api){
  const W=[64,32,16,8,4,2,1],bits=W.map(()=>false);
  const wrap=mk('div','bits',root),out=mk('div','mid',root);
  const render=()=>{
    wrap.replaceChildren();let total=0;
    W.forEach((w,i)=>{const c=mk('div','bit',wrap,w);const b=mk('button','bitbox'+(bits[i]?' on':''),c,bits[i]?'1':'0');
      if(bits[i])total+=w;b.onclick=()=>{bits[i]=!bits[i];render()}});
    out.textContent=bits.map(b=>+b).join('')+' = '+total+'%';api.set(total)};
  render();return{};
 }},
{cat:'DATA ENTRY',tol:0,name:'The Calculation Slider',desc:'Type an expression that equals the target exactly. Plain numbers are rejected.',
 target(){return rand(3,97)},
 mount(root,api){
  const w=mk('div','pi',root);
  const inp=mk('input','field',w);inp.placeholder='e.g. (7*8)+1';inp.autocomplete='off';inp.spellcheck=false;inp.setAttribute('aria-label','Expression');
  const res=mk('div','mid',w);
  const go=()=>{
    const s=inp.value.replace(/\s+/g,'');
    if(!s)return res.textContent='Type some math.';
    if(!/^[0-9+\-*/().]+$/.test(s))return res.textContent='Digits and + - * / ( ) only.';
    if(!/[+\-*/]/.test(s.replace(/^-/,'')))return res.textContent='That is just a number. Make it earn the volume.';
    try{const v=safeEval(s);
      if(!Number.isFinite(v))return res.textContent='Not a number. A cry for help.';
      if(!Number.isInteger(v))return res.textContent='Result '+v.toFixed(4)+' is not an integer.';
      api.set(v);res.textContent='Result: '+v+'%'}catch(e){res.textContent='Syntax error.'}};
  const b=mk('button','btn',mk('div','row',w),'EVALUATE');b.onclick=go;
  const off=listen(inp,'keydown',e=>{if(e.key==='Enter')go()});
  setTimeout(()=>inp.focus(),50);
  return{cleanup:off};
 }},
{cat:'SURVIVAL',tol:1,name:'Beat a Dead Horse',desc:'Click the button. Each click nudges the volume up. Stop and it plummets.',
 mount(root,api){
  const w=mk('div','mid',root);
  const b=mk('button','btn',w,'\u{1F40E} BEAT THE HORSE (+0.5%)');b.style.cssText+='font-size:20px;padding:22px 30px';
  const st=mk('div','mid',w);let clicks=[];
  const off=listen(b,'pointerdown',e=>{e.preventDefault();api.set(S.volume+.5);clicks.push(performance.now())});
  return{tick(dt){api.set(Math.max(0,S.volume-(1.6+S.volume*.03)*dt));
    const n=performance.now();clicks=clicks.filter(t=>n-t<1000);
    st.textContent='click rate: '+clicks.length+'/sec \u2022 '+(clicks.length>=5?'the horse appreciates you':clicks.length>=2?'faster, the volume is fleeing':'the horse is disappointed')},cleanup:off};
 }},
{cat:'SURVIVAL',tol:0,name:'The Car Window Crank',desc:'One full revolution = 1% volume. Grab the handle and wind.',
 target(){return rand(8,25)},
 mount(root,api){
  const cv=mk('canvas',null,root);cv.width=cv.height=320;cv.style.maxWidth='320px';
  const c=cv.getContext('2d'),C=160,R=90;
  let a=-Math.PI/2,la=null,rot=0;
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*320/r.width,y:(e.clientY-r.top)*320/r.height}};
  const offs=[
   listen(cv,'pointerdown',e=>{const p=pos(e);if(Math.hypot(p.x-C-Math.cos(a)*R,p.y-C-Math.sin(a)*R)<44){la=Math.atan2(p.y-C,p.x-C);cv.setPointerCapture(e.pointerId)}}),
   listen(cv,'pointermove',e=>{if(la===null)return;const p=pos(e),n=Math.atan2(p.y-C,p.x-C);let d=n-la;
     if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;rot+=d;a=n;la=n;api.set(Math.max(0,Math.floor(rot/(2*Math.PI))))}),
   listen(cv,'pointerup',()=>{la=null}),listen(cv,'pointercancel',()=>{la=null})];
  const col=n=>getComputedStyle(document.documentElement).getPropertyValue(n);
  return{tick(){c.clearRect(0,0,320,320);
    c.fillStyle=col('--card');c.beginPath();c.arc(C,C,40,0,7);c.fill();
    c.strokeStyle=col('--dim');c.lineWidth=10;c.lineCap='round';c.beginPath();c.moveTo(C,C);c.lineTo(C+Math.cos(a)*R,C+Math.sin(a)*R);c.stroke();
    c.fillStyle=col('--acc');c.beginPath();c.arc(C+Math.cos(a)*R,C+Math.sin(a)*R,17,0,7);c.fill();
    c.fillStyle=col('--txt');c.font='13px Georgia';c.textAlign='center';c.fillText(Math.max(0,Math.floor(rot/(2*Math.PI)))+' rev',C,C+4)},
   cleanup(){offs.forEach(f=>f())}};
 }},
{cat:'SURVIVAL',tol:0,name:'The Dice Hold',desc:'Roll five dice, hold the ones you want, re-roll the rest. Volume is the sum of held dice.',
 target(){return rand(5,30)},
 mount(root,api){
  const row=mk('div','dice',root),dice=[],holds=[];

  let an=null,data=null,stream=null,ac=null,space=false;
  const offs=[listen(window,'keydown',e=>{if(e.code==='Space'&&!typing()){e.preventDefault();space=true}}),listen(window,'keyup',e=>{if(e.code==='Space')space=false})];
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
   navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{if(!cur||!cur.__alive){s.getTracks().forEach(t=>t.stop());return}
    stream=s;ac=new(window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=512;ac.createMediaStreamSource(s).connect(an);
    data=new Uint8Array(an.frequencyBinCount);st.textContent='MIC LIVE \u2014 make noise.'}).catch(()=>{st.textContent='MIC DENIED \u2014 hold SPACE and scream at it.'});
  }else st.textContent='NO MIC \u2014 hold SPACE and scream at it.';
  const o={__alive:true,tick(dt){let loud=0;
   if(an){an.getByteTimeDomainData(data);let s=0;for(let i=0;i<data.length;i++){const v=(data[i]-128)/128;s+=v*v}loud=clamp(Math.sqrt(s/data.length)*900,0,100)}
   else loud=space?78+Math.sin(performance.now()/90)*8:0;
   if(loud>S.volume)api.set(loud);else api.set(Math.max(0,S.volume-(16+S.volume*.2)*dt));
   const lv=Math.round(S.volume);bars.forEach((b,i)=>{const lit=(i+1)/bars.length*100<=lv+3;b.style.background=lit?(i>bars.length*.8?'var(--bad)':'var(--good)'):'var(--line)';b.style.height=lit?(10+Math.random()*8)+'px':'8px'})},
   cleanup(){o.__alive=false;offs.forEach(f=>f());if(stream)stream.getTracks().forEach(t=>t.stop());if(ac)ac.close().catch(()=>{})}};
  return o;
 }},
{cat:'SURVIVAL',tol:1,name:'The Firewood Survivalist',desc:'The volume is a campfire that constantly dies toward silence. Keep adding wood or lose your audio to the night.',
 mount(root,api){const cv=mkcv(root,640,300),c=cv.getContext('2d'),k=K();
  const b=mk('button','btn',mk('div','row',root),'ADD WOOD');
  const off=listen(b,'pointerdown',e=>{e.preventDefault();api.set(S.volume+rand(3,6))});
  return{tick(dt){api.set(Math.max(0,S.volume-(.85+S.volume*.018)*dt));const v=S.volume,t=performance.now()/1000;
   c.clearRect(0,0,640,300);
   if(v>2){const g=c.createRadialGradient(320,250,10,320,250,190*(.4+v/100));g.addColorStop(0,'rgba(255,140,50,'+(.12+v/100*.25)+')');g.addColorStop(1,'rgba(255,140,50,0)');c.fillStyle=g;c.fillRect(0,0,640,300)}
   c.fillStyle=k.line;c.fillRect(0,258,640,42);c.strokeStyle='#8a6a4a';c.lineWidth=13;c.lineCap='round';
   [[300,262],[340,262],[320,268]].forEach(q=>{c.beginPath();c.moveTo(q[0]-22,q[1]);c.lineTo(q[0]+22,q[1]+6);c.stroke()});
   for(let i=0;i<7;i++){const fx=300+i*13,h=(10+v*1.35)*(.75+.35*Math.sin(t*11+i*2.1)),w=9+v*.06;
    c.fillStyle=i%3===1?'rgba(255,209,102,.9)':'rgba(255,110,60,.85)';c.beginPath();c.moveTo(fx-w,262);
    c.quadraticCurveTo(fx-w*.4,262-h*.6,fx+Math.sin(t*9+i)*4,262-h);c.quadraticCurveTo(fx+w*.5,262-h*.55,fx+w,262);c.fill()}
   c.textAlign='center';if(v<8)T(c,'the fire is dying. the volume is dying. everything is dying.',320,120,k.dim);c.textAlign='left';
   T(c,'fire temperature = volume: '+Math.round(v)+'%',20,26,k.txt)},cleanup:off};
 }},
{cat:'SURVIVAL',tol:0,name:'The Electrical Circuit',desc:'No circuit, no sound. Click a branch (or drag the amp terminal onto it) to connect it. Each branch adds its own percentage.',
 target(){const vals=[1,2,5,11,23,58];let t=0;do{t=0;for(const v of vals)if(Math.random()<.5)t+=v}while(!t);return t},
 mount(root,api){const NS='http://www.w3.org/2000/svg',svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 640 320');svg.style.cssText='display:block;width:100%;max-width:640px;margin:0 auto;touch-action:none';root.appendChild(svg);
  const sv=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const n in a)e.setAttribute(n,a[n]);(p||svg).appendChild(e);return e};
  const tx=(x,y,s,st,p)=>{const e=sv('text',{x,y,'text-anchor':'middle',style:st},p);e.textContent=s};
  const box='fill:var(--field);stroke:var(--line)',AX=118,AY=160,BX=240;
  const rows=[1,2,5,11,23,58].map((v,i)=>({v,y:44+i*45,on:false}));
  sv('rect',{x:26,y:120,width:64,height:80,rx:8,style:box});tx(58,165,'AMP','fill:var(--acc);font:13px Georgia');
  sv('rect',{x:546,y:120,width:64,height:80,rx:8,style:box});tx(578,165,'SPKR','fill:var(--acc);font:12px Georgia');
  const items=rows.map(r=>{const g=sv('g',{style:'cursor:pointer'});
   sv('line',{x1:BX,y1:r.y,x2:BX+120,y2:r.y,style:'stroke:var(--line);stroke-width:3;stroke-dasharray:7 5'},g);
   sv('rect',{x:BX+42,y:r.y-11,width:36,height:22,rx:5,style:box},g);tx(BX+60,r.y+5,r.v+'\u03a9','fill:var(--txt);font:12px Georgia',g);
   sv('circle',{cx:BX,cy:r.y,r:8,style:box+';stroke-width:2'},g);sv('rect',{x:BX-16,y:r.y-18,width:140,height:36,fill:'transparent'},g);
   const w=sv('path',{fill:'none',style:'stroke:var(--good);stroke-width:3;stroke-dasharray:10 6;opacity:0'});return{g,r,w}});
  const live=sv('line',{x1:AX,y1:AY,x2:AX,y2:AY,style:'stroke:var(--acc);stroke-width:3;opacity:0'});
  const term=sv('circle',{cx:AX,cy:AY,r:10,style:'fill:var(--acc);stroke:var(--txt);stroke-width:2;cursor:grab'});
  let drag=false;
  const redraw=()=>{let t=0;items.forEach(({r,w})=>{if(r.on){t+=r.v;w.setAttribute('d','M'+AX+','+AY+' L'+BX+','+r.y);w.style.opacity=1}else w.style.opacity=0});api.set(t)};
  const xy=e=>{const b=svg.getBoundingClientRect();return[(e.clientX-b.left)*640/b.width,(e.clientY-b.top)*320/b.height]};
  const offs=[
   listen(term,'pointerdown',e=>{e.preventDefault();drag=true;svg.setPointerCapture(e.pointerId);live.style.opacity=1}),
   listen(svg,'pointermove',e=>{if(!drag)return;const p=xy(e);live.setAttribute('x2',p[0]);live.setAttribute('y2',p[1])}),
   listen(svg,'pointerup',e=>{if(!drag)return;drag=false;live.style.opacity=0;live.setAttribute('x2',AX);live.setAttribute('y2',AY);
    const p=xy(e);items.forEach(({r})=>{if(Math.hypot(p[0]-BX,p[1]-r.y)<30)r.on=!r.on});redraw()}),
   ...items.map(({g,r})=>listen(g,'click',()=>{r.on=!r.on;redraw()}))];
  redraw();return{cleanup(){offs.forEach(f=>f())}};
 }}
];
const V=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const K=()=>({acc:V('--acc'),txt:V('--txt'),dim:V('--dim'),good:V('--good'),bad:V('--bad'),line:V('--line'),bg:V('--bg')});
const T=(c,s,x,y,col,f)=>{c.fillStyle=col;c.font=f||'13px Georgia';c.fillText(s,x,y)};
const mkcv=(root,w,h)=>{const c=mk('canvas',null,root);c.width=w;c.height=h;return c};
const P=(cv,e)=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
