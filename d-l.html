<style>
:root{--bg:#fff;--card:#fff;--field:#f3f1ea;--line:#c9c9c9;--txt:#111;--dim:#666;--acc:#9a6b00;--accfg:#fff;--good:#177a4c;--bad:#c9203f;color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1e2a;--field:#0d0f16;--line:#3a3f55;--txt:#f1f1f1;--dim:#9aa0b8;--acc:#ffd166;--accfg:#241c04;--good:#3ddc91;--bad:#ff5c7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1b1e2a;--field:#0d0f16;--line:#3a3f55;--txt:#f1f1f1;--dim:#9aa0b8;--acc:#ffd166;--accfg:#241c04;--good:#3ddc91;--bad:#ff5c7a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Georgia,"Times New Roman",serif;min-height:100vh;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
#wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:20px;letter-spacing:1px;margin:10px 2px 2px}h1 span{color:var(--acc)}
.sub{color:var(--dim);font-size:13px;margin:0 2px 12px}
#hud{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:80px}
.stat.grow{flex:1;min-width:220px}
.label{display:block;font-size:10px;letter-spacing:1.5px;color:var(--dim)}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
#lives{color:var(--bad)}
#volbar{position:relative;height:14px;background:var(--field);border:1px solid var(--line);border-radius:8px;margin:6px 0 4px;overflow:hidden}
#volfill{height:100%;width:0;background:var(--acc);transition:background .15s}
#volfill.ok{background:var(--good)}
#volmark{position:absolute;top:0;bottom:0;width:3px;background:var(--txt)}
#volnow{font-size:12px;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.cat{display:inline-block;font-size:10px;letter-spacing:1.5px;color:var(--acc);border:1px solid var(--acc);border-radius:6px;padding:2px 8px;margin-bottom:6px}
.cname{font-size:20px;font-weight:700}.cdesc{color:var(--dim);font-size:14px;line-height:1.45;margin-top:2px}
#mount{min-height:200px;margin-top:12px}
canvas{display:block;width:100%;max-width:640px;margin:0 auto;border-radius:10px;background:var(--field);touch-action:none}
.lockbar{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
button{font-family:inherit;color:var(--txt)}
.btn{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
#lock{flex:1;min-width:160px;font-size:17px;font-weight:700;letter-spacing:1px;padding:14px;background:var(--field);color:var(--dim);border:1px solid var(--line);border-radius:12px;cursor:not-allowed}
#lock.ready{background:var(--good);color:#fff;border-color:var(--good);cursor:pointer}
#toasts{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--card);color:var(--txt);border:1px solid var(--bad);padding:9px 16px;border-radius:10px;font-size:13px;max-width:80vw;text-align:center;animation:tout .4s ease 2.2s forwards}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100}
#ovbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 36px;max-width:520px;text-align:center;margin:14px}
#ovtitle{font-size:24px;font-weight:800;margin-bottom:10px}
#ovsub{color:var(--dim);font-size:14px;line-height:1.55;margin-bottom:20px;white-space:pre-line}
.bigbtn{background:var(--acc);color:var(--accfg);font-weight:800;font-size:16px;border:none;border-radius:12px;padding:13px 32px;cursor:pointer}
.bigbtn.alt{background:var(--field);color:var(--txt);border:1px solid var(--line)}
.bigbtn small{display:block;font-weight:400;font-size:11px;margin-top:3px;opacity:.85}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.mid{text-align:center;color:var(--dim);font-size:13px;margin-top:8px}
.field{width:min(360px,90%);font-size:22px;text-align:center;font-family:ui-monospace,Consolas,monospace;background:var(--field);color:var(--txt);caret-color:var(--txt);border:2px solid var(--line);border-radius:10px;padding:10px;outline:none}
.field:focus{border-color:var(--acc)}
.field.err{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pi{text-align:center;padding:16px}.pi b{font:26px ui-monospace,monospace;color:var(--acc);margin-right:6px}
.track{position:relative;height:50px;margin:46px auto;width:min(480px,92%);background:var(--field);border:2px solid var(--line);border-radius:25px;touch-action:none}
.track.tilt{transform:rotate(-9deg)}
.vtrack{position:relative;height:280px;width:54px;margin:16px auto;background:var(--field);border:2px solid var(--line);border-radius:27px;touch-action:none}
.knob{position:absolute;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--acc);cursor:grab;touch-action:none}
#grid{height:280px;overflow-y:auto;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,30px);gap:3px}
#grid button{height:24px;font-size:10px;padding:0;background:var(--card);border:1px solid var(--line);border-radius:4px;cursor:pointer}
#grid button:hover{background:var(--acc);color:var(--accfg)}
.bits{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:18px 0}
.bit{text-align:center;font-size:12px;color:var(--dim)}
.bitbox{width:56px;height:56px;margin-top:4px;font-size:26px;font-weight:800;border-radius:12px;background:var(--field);border:2px solid var(--line);cursor:pointer}
.bitbox.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.dice{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:14px 0 6px}
.die{width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;background:#f4f6ff;color:#1a1d33;border:1px solid var(--line);border-radius:12px}
.dice label{display:block;text-align:center;margin-top:6px;font-size:12px;color:var(--dim);cursor:pointer}
.radios{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px}
.radios label{font-size:11px;display:flex;gap:3px;align-items:center;cursor:pointer}
</style>

<body>
<div id="toasts" aria-live="polite"></div>
<div id="wrap">
  <h1>WORST VOLUME <span>CONTROLS</span></h1>
  <p class="sub">Inspired by the r/ProgrammerHumor Worst Volume Control UI competition. Set the volume to the target. Good luck. You will need it.</p>
  <div id="hud">
    <div class="stat"><span class="label">TARGET</span><span class="big" id="target">--%</span></div>
    <div class="stat grow"><span class="label">YOUR VOLUME <span id="tolnote"></span></span>
      <div id="volbar"><div id="volfill"></div><div id="volmark"></div></div><span id="volnow">0%</span></div>
    <div class="stat"><span class="label">TAMED</span><span class="big" id="done">0</span></div>
    <div class="stat"><span class="label">LIVES</span><span class="big" id="lives">&#9829;&#9829;&#9829;</span></div>
    <div class="stat"><span class="label">ROUND LEFT</span><span class="big" id="rt">0</span></div>
    <div class="stat"><span class="label">TIME</span><span class="big" id="time">0:00</span></div>
  </div>
  <div class="card">
    <span class="cat" id="ccat"></span>
    <div class="cname" id="cname"></div>
    <div class="cdesc" id="cdesc"></div>
    <div id="mount"></div>
    <div class="lockbar">
      <button id="lock" disabled>LOCK IT IN (ENTER)</button>
    </div>
  </div>
</div>
<div id="overlay"><div id="ovbox"><div id="ovtitle"></div><div id="ovsub"></div><div class="row" id="ovbtns" style="margin-top:0"></div></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const mk=(tag,cls,parent,text)=>{const d=document.createElement(tag);if(cls)d.className=cls;if(text!=null)d.textContent=text;if(parent)parent.appendChild(d);return d};
const listen=(el,ev,fn,o)=>{el.addEventListener(ev,fn,o);return()=>el.removeEventListener(ev,fn,o)};
const typing=()=>/^(INPUT|TEXTAREA)$/.test(document.activeElement&&document.activeElement.tagName);
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

const S={idx:0,failed:[],skipped:[],diff:'medium',target:0,volume:0,tol:0,round:0,done:0,lives:3,rt:0,playing:false,t0:0,extraOK:true};
const E={target:$('#target'),fill:$('#volfill'),mark:$('#volmark'),now:$('#volnow'),done:$('#done'),time:$('#time'),tol:$('#tolnote'),
  lives:$('#lives'),rt:$('#rt'),
  mount:$('#mount'),lock:$('#lock'),cat:$('#ccat'),name:$('#cname'),desc:$('#cdesc'),
  ov:$('#overlay'),ovt:$('#ovtitle'),ovs:$('#ovsub'),ovbs:$('#ovbtns')};
let cur=null,curCh=null,audio=null,LEVELS=[];

/* FIXED LEVEL ORDER (never shuffled, never changes): level 1 is the easiest, level 31 is the hardest.
   Look-alike controls (the two pumps, the two pi levels, the two radio levels, the two launchers) are kept far apart. */
const ORDER=[
 /* 1-8: warm-up */
 'The Advanced Radio Buttons','The Binary Selector','The Dice Hold','The Electrical Circuit','The Bike Pump','The Tilted Device','The Pi Requirement','The Radio Button Grid',
 /* 9-16: getting annoying */
 'Beat a Dead Horse','The Car Window Crank','The Firewood Survivalist','The Solar Eclipse','The Slanted Slider','The Slingshot','The Hand Gesture','The Curling Slider',
 /* 17-24: properly nasty */
 'The Voice / Screaming Sensor','The Pendulum / Metronome','The Shaking Bar','The Catapult','The Polka Dot Text Matcher','The Gravity Well','The Real Bicycle Pump','The Calculation Slider',
 /* 25-31: final gauntlet */
 'The Pi Decimal Finder','The Runaway Slider','The Seesaw / Balance','The Slime Eater','The Pong Volume','The Snake Game','The Global Map Coordinates'];
const played=new Set();   /* safety net: a level that has been shown can never be loaded again in the same run */
function buildLevels(){LEVELS=ORDER.map(n=>CH.find(c=>c.name===n)).filter(Boolean);CH.forEach(c=>{if(!LEVELS.includes(c))LEVELS.push(c)})}

/* Difficulty settings. EASY and MEDIUM play identically (same physics, same exact-number rule);
   the only difference is that Easy has no timer and no hearts. HARD adds a tighter clock, 3 hearts and meaner physics. */
const DIFFS={
 easy:{name:'EASY',timed:false,lives:Infinity,hd0:1,hdStep:.03,hdMax:.6,scale:.6,pong:190,rt0:0,rtStep:0,rtMin:0},
 medium:{name:'MEDIUM',timed:true,lives:5,hd0:1,hdStep:.03,hdMax:.6,scale:.6,pong:190,rt0:100,rtStep:2,rtMin:45},
 hard:{name:'HARD',timed:true,lives:3,hd0:1.2,hdStep:.1,hdMax:1.6,scale:1,pong:215,rt0:80,rtStep:2.5,rtMin:30}};
let DIFF=DIFFS.medium;
/* Decay and drift strength, and a general 0..n difficulty scale, both grow with the level number. */
const HD=()=>DIFF.hd0+Math.min(DIFF.hdMax,S.idx*DIFF.hdStep);
const SC=()=>S.idx*DIFF.scale;

function toast(m){const d=mk('div','toast',$('#toasts'),m);setTimeout(()=>d.remove(),2700)}
function setVolume(v){S.volume=clamp(v,0,100)}
const inRange=()=>S.playing&&S.extraOK&&Math.abs(Math.round(S.volume)-S.target)<=S.tol;
function beep(f){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();
  o.type='triangle';o.frequency.value=f;g.gain.value=.1;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.2)}catch(e){}}

const SNARK=['Settings saved. Somewhere, a UX designer is crying.','Incredible. You fought the interface and won.','The volume is set. Was it worth it?',
 'Certified. You may proceed to the next abomination.','Your perseverance has been noted and will be used against you.','Achievement unlocked: Temporarily Defeated Bad Design.'];

function overlay(title,sub,btns){
  E.ovt.textContent=title;E.ovs.textContent=sub;E.ovbs.replaceChildren();
  btns.forEach((b,i)=>{const el=mk('button','bigbtn'+(b.alt?' alt':''),E.ovbs);el.textContent=b.t;if(b.s)mk('small',null,el,b.s);el.onclick=b.fn;if(i===0)setTimeout(()=>el.focus(),0)});
  E.ov.hidden=false;E.ov.style.display='flex'}
function hideOverlay(){E.ov.style.display='none'}
const hearts=()=>DIFF.lives===Infinity?'\u221e':S.lives>0?'\u2665'.repeat(S.lives):'\u2014';

function showTitle(){
  S.playing=false;
  overlay('WORST VOLUME CONTROLS','A set of truly terrible volume controls.\nSet the volume to the EXACT number. Lock it in.\n'+ORDER.length+' controls, in a fixed order, easiest to hardest.\nEach one appears once. Choose your pain.',
   [{t:'EASY',s:'same levels, no timer, no hearts',fn:()=>start('easy')},{t:'MEDIUM',s:'same levels, 5 hearts + timer',fn:()=>start('medium')},{t:'HARD',s:'3 hearts, tight timer, meaner levels',fn:()=>start('hard')}]);
}
function start(key){
  DIFF=DIFFS[key];S.diff=key;hideOverlay();buildLevels();
  S.playing=true;S.t0=performance.now();S.done=0;S.idx=0;S.round=0;S.lives=DIFF.lives;S.failed=[];S.skipped=[];played.clear();
  loadLevel();
}
function loadLevel(){
  if(cur&&cur.cleanup)cur.cleanup();
  cur=null;E.mount.replaceChildren();
  while(S.idx<LEVELS.length&&played.has(LEVELS[S.idx].name))S.idx++;
  if(S.idx>=LEVELS.length){ending();return}
  const ch=LEVELS[S.idx];curCh=ch;played.add(ch.name);
  S.round=S.idx+1;
  S.tol=0;   /* every level, on every difficulty, needs the exact number */
  S.extraOK=true;
  S.rt=DIFF.timed?Math.max(DIFF.rtMin,DIFF.rt0-S.idx*DIFF.rtStep)+(ch.bonus||0):0;
  S.target=ch.target?ch.target():rand(5,95);
  setVolume(0);
  E.target.textContent=S.target+'%';
  E.tol.textContent=S.tol?'(\u00b1'+S.tol+')':'(exact)';
  E.cat.textContent=ch.cat+' \u2022 LEVEL '+(S.idx+1)+' OF '+LEVELS.length+' \u2022 '+DIFF.name;
  E.name.textContent=ch.name;E.desc.textContent=ch.desc;
  E.done.textContent=S.done;E.lives.textContent=hearts();
  cur=ch.mount(E.mount,{set:setVolume,extra:ok=>{S.extraOK=ok},toast,skip:()=>{if(S.playing){S.skipped.push(ch.name);advance()}}})||{};
}
function advance(){S.idx++;loadLevel()}
function complete(){
  S.done++;S.playing=false;beep(220+S.target*8);E.done.textContent=S.done;
  if(S.idx>=LEVELS.length-1){S.idx++;loadLevel();return}
  overlay('VOLUME SET: '+S.target+'%',pick(SNARK)+'\n\nUp next: '+LEVELS[S.idx+1].name,[{t:'NEXT CONTROL',fn:()=>{hideOverlay();S.playing=true;advance()}}]);
}
/* Out of time: lose a heart and the control is gone for good. You move on to the next one. */
function fail(){
  S.lives--;E.lives.textContent=hearts();beep(110);
  S.failed.push(curCh.name);
  if(S.lives<=0){S.playing=false;gameOver();return}
  toast('Out of time. You lost a heart and that control is gone for good.');
  advance();
}
function gameOver(){
  overlay('GAME OVER','You reached control '+(S.idx+1)+' of '+LEVELS.length+' ('+curCh.name+') on '+DIFF.name+'.\nControls tamed: '+S.done+'   Time: '+fmt(performance.now()-S.t0)+'\nThe volume stays at 0%. As it should.',
   [{t:'TRY AGAIN',fn:()=>start(S.diff)},{t:'CHANGE DIFFICULTY',alt:true,fn:showTitle}]);
}
function ending(){
  S.playing=false;beep(660);
  const key=S.diff,total=LEVELS.length,lost=S.failed.length,time=fmt(performance.now()-S.t0),flawless=lost===0;
  const ENDS={
   easy:{t:'ENDING: THE CASUAL LISTENER',s:'No clock. No hearts. No pressure.\nYou took your time, and the interfaces eventually gave in.\nA designer somewhere feels a little less guilty.\n\n(The other difficulties will not be this kind.)'},
   medium:flawless?{t:'ENDING: THE PERSISTENT',s:'Five hearts, and you never spent a single one.\nThe controls tried everything. You were simply more patient.\nThe volume knob salutes you.'}
     :{t:'ENDING: SCARRED BUT SOUND',s:'You limped across the finish line with '+S.lives+' heart'+(S.lives===1?'':'s')+' left.\n'+lost+' control'+(lost===1?'':'s')+' got away from you, but the volume is set.\nIt counts. Mostly.'},
   hard:flawless?{t:'TRUE ENDING: THE VOLUME WHISPERER',s:'Three hearts. Zero lost. Thirty-one controls, bent to your will.\nThe sliders go still. The pump exhales. The map folds itself away.\nA small dialog appears: "Settings saved."\nIt has never said that before.'}
     :{t:'ENDING: BARELY AUDIBLE',s:'You survived Hard with '+S.lives+' heart'+(S.lives===1?'':'s')+' left.\nThe volume is set, and so are your nerves, apparently.\nFlawless, however, remains out of reach.'}};
  const e=ENDS[key];
  const rank=flawless?(key==='hard'?'S+':'S'):lost<=2?'A':lost<=5?'B':'C';
  let st='Difficulty: '+DIFF.name+'\nControls tamed: '+S.done+' / '+total+'\nHearts left: '+(DIFF.lives===Infinity?'\u221e':S.lives)+'\nTime: '+time+'\nRank: '+rank;
  if(S.skipped.length)st+='\nSkipped (no mic): '+S.skipped.length;
  if(lost)st+='\nControls that beat you: '+S.failed.slice(0,4).join(', ')+(lost>4?' and '+(lost-4)+' more':'');
  const pages=[
   {t:'THE LAST CONTROL FALLS',s:'The final island is found.\nThe interface has nothing left to throw at you.\nFor a moment, the whole machine just hums.'},
   {t:'PRESS PLAY',s:'You lean back and press play.\nThe volume sits exactly where you left it: '+S.target+'%.\nYou have honestly forgotten what you wanted to listen to.'},
   e,
   {t:'FINAL REPORT',s:st},
   {t:'THANKS FOR PLAYING',s:'WORST VOLUME CONTROLS\nInspired by the r/ProgrammerHumor Worst Volume Control UI competition.\n\nNo sliders were harmed. Several were humiliated.\n\n'+(key==='hard'?'You have beaten the hardest setting. Go outside.':'Think that was rough? Try '+(key==='easy'?'Medium or Hard':'Hard')+'.'),
    btns:[{t:'PLAY AGAIN',fn:()=>start(S.diff)},{t:'CHANGE DIFFICULTY',alt:true,fn:showTitle}]}];
  const show=i=>{const pg=pages[i];overlay(pg.t,pg.s,pg.btns||[{t:'NEXT',fn:()=>show(i+1)}])};
  show(0);
}
E.lock.onclick=()=>{if(inRange())complete()};
window.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.repeat&&!typing()&&inRange()){e.preventDefault();complete()}});
showTitle();

let last=performance.now();
(function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(S.playing){
    try{if(cur&&cur.tick)cur.tick(dt)}catch(err){console.error(err)}
    if(DIFF.timed){S.rt-=dt;if(S.rt<=0){S.rt=0;fail()}}
    const ok=inRange();E.lock.disabled=!ok;E.lock.classList.toggle('ready',ok);
    E.time.textContent=fmt(performance.now()-S.t0);
    E.rt.textContent=DIFF.timed?Math.ceil(S.rt):'\u221e';E.rt.style.color=DIFF.timed&&S.rt<10?'var(--bad)':'';
  }
  const shown=Math.round(S.volume);
  E.now.textContent=shown+'%';E.fill.style.width=S.volume+'%';
  E.mark.style.left='calc('+S.target+'% - 1px)';
  E.fill.classList.toggle('ok',inRange());
})(last);

/* Shared helper: drag a knob along a track, returns 0..1 */
function dragKnob(track,knob,onMove,onEnd,angle=0){
  let held=false;
  const frac=e=>{const r=track.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    const dx=e.clientX-cx,dy=e.clientY-cy,u=dx*Math.cos(angle)+dy*Math.sin(angle);
    return clamp(u/(track.offsetWidth)+.5,0,1)};
  return[
    listen(knob,'pointerdown',e=>{e.preventDefault();held=true;knob.setPointerCapture(e.pointerId);onMove(frac(e))}),
    listen(knob,'pointermove',e=>{if(held)onMove(frac(e))}),
    listen(knob,'pointerup',()=>{held=false;onEnd&&onEnd()}),
    listen(knob,'pointercancel',()=>{held=false;onEnd&&onEnd()})];
}
const safeEval=s=>{let i=0;
  const f=()=>{if(s[i]==='-'){i++;return -f()}
    if(s[i]==='('){i++;const v=e();if(s[i++]!==')')throw 0;return v}

   listen(window,'keyup',e=>{const m=MAP[e.key.toLowerCase()];if(m)keys[m]=false}),
   listen(cv,'pointerdown',e=>{ptr=P(cv,e);cv.setPointerCapture(e.pointerId)}),
   listen(cv,'pointermove',e=>{if(ptr)ptr=P(cv,e)}),
   listen(cv,'pointerup',()=>{ptr=null}),listen(cv,'pointercancel',()=>{ptr=null})];
  return{tick(dt){t+=dt;st+=dt;
   let dx=(keys.r?1:0)-(keys.l?1:0),dy=(keys.d?1:0)-(keys.u?1:0);
   if(!dx&&!dy&&ptr){const ex=ptr.x-pl.x,ey=ptr.y-pl.y,d=Math.hypot(ex,ey);if(d>8){dx=ex/d;dy=ey/d}}
   const m=Math.hypot(dx,dy)||1,spd=dx||dy?200:0;pl.x=clamp(pl.x+dx/m*spd*dt,16,W-16);pl.y=clamp(pl.y+dy/m*spd*dt,16,H-16);
   for(let i=dots.length-1;i>=0;i--){const q=dots[i],ex=q.x-pl.x,ey=q.y-pl.y,d=Math.hypot(ex,ey)||1;
    if(d<110){q.vx+=ex/d*260*dt;q.vy+=ey/d*260*dt}
    const sp=Math.hypot(q.vx,q.vy);if(sp>110){q.vx*=110/sp;q.vy*=110/sp}
    q.x+=q.vx*dt;q.y+=q.vy*dt;
    if(q.x<8||q.x>W-8){q.vx*=-1;q.x=clamp(q.x,8,W-8)}if(q.y<8||q.y>H-8){q.vy*=-1;q.y=clamp(q.y,8,H-8)}
    if(d<24){dots.splice(i,1);dots.push(sd());api.set(S.volume+1)}}
   if(st>2&&spk.length<Math.min(8,3+Math.floor(SC()/2))){st=0;const a=Math.random()*6.28;spk.push({x:W/2+Math.cos(a)*300,y:H/2+Math.sin(a)*190,vx:-Math.cos(a)*70+rand(-30,30),vy:-Math.sin(a)*70+rand(-30,30)})}
   for(let i=spk.length-1;i>=0;i--){const q=spk[i];q.x+=q.vx*dt;q.y+=q.vy*dt;
    if(q.x<10||q.x>W-10){q.vx*=-1;q.x=clamp(q.x,10,W-10)}if(q.y<10||q.y>H-10){q.vy*=-1;q.y=clamp(q.y,10,H-10)}
    if(Math.hypot(q.x-pl.x,q.y-pl.y)<24){spk.splice(i,1);api.set(S.volume-4);api.toast('Spiked. Volume -4%.')}}
   c.clearRect(0,0,W,H);
   c.fillStyle=k.txt;dots.forEach(q=>{c.beginPath();c.arc(q.x,q.y,6,0,7);c.fill()});
   c.fillStyle=k.bad;spk.forEach(q=>{c.beginPath();for(let j=0;j<8;j++){const r=j%2?6:13,a=j*Math.PI/4+t*2;c.lineTo(q.x+Math.cos(a)*r,q.y+Math.sin(a)*r)}c.closePath();c.fill()});
   const wob=Math.sin(t*8)*1.6;c.fillStyle=k.good;c.beginPath();c.ellipse(pl.x,pl.y,17+wob,15-wob,0,0,7);c.fill();
   c.fillStyle='#fff';c.beginPath();c.arc(pl.x-5,pl.y-3,3.5,0,7);c.arc(pl.x+5,pl.y-3,3.5,0,7);c.fill();
   c.fillStyle='#111';c.beginPath();c.arc(pl.x-5,pl.y-3,1.5,0,7);c.arc(pl.x+5,pl.y-3,1.5,0,7);c.fill();
   T(c,'volume: '+Math.round(S.volume)+'%',8,16,k.dim,'12px Georgia')},
   cleanup(){offs.forEach(f=>f())}};
 }},
{cat:'PHYSICS',tol:2,name:'The Hand Gesture',desc:'Two hand emojis. The farther apart they are, the louder it is. Tired arms drift together when you let go. (Mouse: you only have one hand. Good luck.)',
 mount(root,api){const cv=mkcv(root,640,300),c=cv.getContext('2d'),k=K();
  const hs=[{x:160,y:150,id:-1},{x:480,y:150,id:-1}],MINX=40,MAXX=600;
  const offs=[
   listen(cv,'pointerdown',e=>{const p=P(cv,e);let bi=-1,bd=60;hs.forEach((h,i)=>{if(h.id!==-1)return;const d=Math.hypot(p.x-h.x,p.y-h.y);if(d<bd){bd=d;bi=i}});
    if(bi>=0){hs[bi].id=e.pointerId;cv.setPointerCapture(e.pointerId)}}),
   listen(cv,'pointermove',e=>{const h=hs.find(q=>q.id===e.pointerId);if(h){const p=P(cv,e);h.x=clamp(p.x,MINX,MAXX);h.y=clamp(p.y,40,260)}}),
   listen(cv,'pointerup',e=>{hs.forEach(h=>{if(h.id===e.pointerId)h.id=-1})}),listen(cv,'pointercancel',e=>{hs.forEach(h=>{if(h.id===e.pointerId)h.id=-1})})];
  return{tick(dt){
   const dr=22*HD()*dt;
   const a=hs[0],b=hs[1];
   if(a.id===-1&&b.id===-1){const m=(a.x+b.x)/2;a.x+=clamp(m-a.x,-dr,dr);b.x+=clamp(m-b.x,-dr,dr)}
   else if(a.id===-1)a.x+=clamp(b.x-a.x,-dr,dr);
   else if(b.id===-1)b.x+=clamp(a.x-b.x,-dr,dr);
   api.set(Math.abs(a.x-b.x)/(MAXX-MINX)*100);
   c.clearRect(0,0,640,300);
   c.strokeStyle=k.line;c.lineWidth=3;c.setLineDash([6,6]);c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();c.setLineDash([]);
   c.textAlign='center';c.font='64px serif';c.fillStyle=k.txt;
   c.fillText('\u{1F590}\uFE0F',a.x,a.y+22);c.fillText('\u{1F590}\uFE0F',b.x,b.y+22);
   c.textAlign='left';T(c,'spread wide = loud. arms get tired.',14,22,k.dim)},
   cleanup(){offs.forEach(f=>f())}};
 }},
{cat:'MINI-GAME',tol:2,name:'The Global Map Coordinates',desc:'Your volume is the longitude of your pin (far west = 0%, far east = 100%). The map has no labels at all. Find the named island, tap to drop a pin, then press ENTER to lock. Drag to pan, scroll or pinch to zoom.',
 target(){mapIsland=nextIsland();return clamp(Math.round((mapIsland[1]+180)/3.6),1,99)},
 mount(root,api){
  const wrap=mk('div',null,root);wrap.style.cssText='position:relative;max-width:720px;margin:0 auto';
  const box=mk('div',null,wrap);box.style.cssText='height:380px;border-radius:12px;overflow:hidden;background:#a8d3f5;position:relative;z-index:0';
  const pill=mk('div',null,wrap,'Find: '+mapIsland[0]);
  pill.style.cssText='position:absolute;top:10px;left:10px;z-index:1000;background:var(--card);color:var(--txt);padding:7px 14px;border-radius:17px;font:600 14px -apple-system,"SF Pro Text",system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.3);pointer-events:none';
  const out=mk('div','mid',root,'tap the map to drop a pin');
  if(typeof L==='undefined'){
   out.textContent='Map library failed to load. Skipping this control.';api.toast('Map library unavailable. Skipping.');
   const o={__alive:true,cleanup(){o.__alive=false}};setTimeout(()=>{if(o.__alive)api.skip()},1200);return o}
  const de=document.documentElement,dark=de.dataset.theme==='dark'||(de.dataset.theme!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches);
  const map=L.map(box,{minZoom:2,maxZoom:9,worldCopyJump:false,maxBounds:[[-85,-180],[85,180]],maxBoundsViscosity:1,zoomSnap:.5}).setView([20,10],2);
  const tiles=MAPTILER_KEY
   ?L.tileLayer('https://api.maptiler.com/maps/'+(dark?'backdrop-dark':'backdrop')+'/{z}/{x}/{y}.png?key='+MAPTILER_KEY,{tileSize:512,zoomOffset:-1,noWrap:true,maxZoom:9,
      attribution:'&copy; <a href="https://www.maptiler.com/copyright/">MapTiler</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'})
   :L.tileLayer('https://{s}.basemaps.cartocdn.com/'+(dark?'dark_nolabels':'voyager_nolabels')+'/{z}/{x}/{y}{r}.png',{subdomains:'abcd',noWrap:true,maxZoom:9,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'});
  tiles.addTo(map);
  /* Continent names (never islands) so you can orient yourself */
  const lc=dark?'#9aa3b2':'#6e6e73';
  [['NORTH AMERICA',-100,46],['SOUTH AMERICA',-60,-14],['EUROPE',15,52],['ASIA',92,50],['AFRICA',20,4],['AUSTRALIA',134,-25],['ANTARCTICA',0,-78]].forEach(q=>
   L.marker([q[2],q[1]],{interactive:false,keyboard:false,icon:L.divIcon({className:'',iconSize:[0,0],
    html:'<span style="position:absolute;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none;font:600 11px -apple-system,system-ui,sans-serif;letter-spacing:2px;color:'+lc+';text-shadow:0 0 3px '+(dark?'#000':'#fff')+'">'+q[0]+'</span>'})}).addTo(map));
  /* If the tile server is blocked or offline, draw the built-in coastlines so the map is never blank */
  let tileOK=false,fellBack=false;
  tiles.on('tileload',()=>{tileOK=true});
  const fallback=()=>{if(fellBack||tileOK)return;fellBack=true;
   box.style.background=dark?'#1d2f45':'#a8d3f5';
   LAND.forEach(poly=>L.polygon(poly.map(q=>[q[1],q[0]]),{color:dark?'#4a4d54':'#d6d0c2',weight:1,fillColor:dark?'#34363b':'#f2efe8',fillOpacity:1,interactive:false}).addTo(map))};
  setTimeout(fallback,3500);
  tiles.on('tileerror',()=>{if(!tileOK)setTimeout(fallback,800)});
  const icon=L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,26],
   html:'<div style="width:22px;height:22px;margin:2px;background:#ff3b30;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.45)"></div>'});
  let pin=null,line=null;
  map.on('click',e=>{
   const lng=clamp(e.latlng.lng,-180,180),vol=clamp((lng+180)/3.6,0,100);
   if(pin)map.removeLayer(pin);if(line)map.removeLayer(line);
   pin=L.marker([e.latlng.lat,lng],{icon,interactive:false}).addTo(map);
   line=L.polyline([[-85,lng],[85,lng]],{color:'#0a84ff',weight:2,opacity:.55,interactive:false}).addTo(map);
   api.set(vol);out.textContent='pin longitude '+lng.toFixed(1)+'\u00b0 \u2192 volume '+vol.toFixed(1)+'%'});
  setTimeout(()=>{try{map.invalidateSize()}catch(e){}},60);
  return{cleanup(){try{map.remove()}catch(e){}}};
 }}
];
const V=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const K=()=>({acc:V('--acc'),txt:V('--txt'),dim:V('--dim'),good:V('--good'),bad:V('--bad'),line:V('--line'),bg:V('--bg')});
const T=(c,s,x,y,col,f)=>{c.fillStyle=col;c.font=f||'13px Georgia';c.fillText(s,x,y)};
const mkcv=(root,w,h)=>{const c=mk('canvas',null,root);c.width=w;c.height=h;return c};
const P=(cv,e)=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
</script>
</body>
