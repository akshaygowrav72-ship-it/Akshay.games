<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stocks + Powerball (SVG Graphs)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui, Arial, sans-serif;
  background: #0f1220;
  color: white;
  text-align: center;
}

header {
  padding: 25px;
  background: #161a30;
}

#money {
  font-size: 26px;
  color: #00ff99;
  font-weight: bold;
}

#event {
  min-height: 22px;
  margin-top: 8px;
}

.container {
  max-width: 1400px;
  margin: 20px auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 18px;
  padding: 0 15px;
}

.stock {
  background: #1b1f3b;
  border-radius: 14px;
  padding: 15px;
}

svg {
  width: 100%;
  height: 140px;
  background: #0b0e24;
  border-radius: 8px;
  margin: 10px 0;
  display: block;
}

/* small arrow styles inside the svg container (keeps things aligned) */
.trend-label {
  display: inline-block;
  margin-left: 8px;
  font-weight: 600;
  vertical-align: middle;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
}

button {
  padding: 8px 14px;
  font-size: 15px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}

.buy { background: #00c853; }
.sell { background: #ff5252; }
button:disabled { opacity: 0.4; }

#nextDay, #powerball {
  margin: 15px;
  padding: 14px 28px;
  font-size: 18px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

#nextDay { background: #ffd600; }
#powerball { background: #ff1744; color: white; }

#stock-graph {
  width: 80%;
  height: 400px;
  background: #1b1f3b;
  border-radius: 14px;
  padding: 15px;
  margin: 20px auto;
}
</style>
</head>

<body>

<header>
  <h1>Stock Market + Powerball</h1>
  <div id="money">$10,000</div>
  <div id="day">Day 1</div>
  <div id="event"></div>
</header>

<button id="powerball">🎰 Buy Powerball Ticket ($2)</button>

<div class="container" id="market"></div>

<canvas id="stock-graph"></canvas>

<button id="nextDay">Next Day</button>

<script>
const INITIAL_BALANCE = 10000;
const POWERBALL_COST = 2;
const POWERBALL_JACKPOT = 50_000_000;
const STOCK_PRICE_CHANGE = 0.15;

let balance = INITIAL_BALANCE;
let day = 1;

const stockNames = [
  "TechCorp","Space Ventures","Green Energy","AI Systems","Crypto Fund",
  "Mega Retail","PharmaPlus","Auto Motors","CloudNet","CyberSec",
  "FinTech Co","Game Studio","Streaming Inc","Aerospace","Robotics",
  "Semiconductors","Quantum Labs","Biotech","Defense Systems","Social Media",
  "Search Engine","EV Batteries","Smart Homes","Oil & Gas","Metaverse"
];

const stocks = stockNames.map(name => {
  const start = Math.floor(Math.random() * 300) + 50;
  return { name, price: start, owned: 0, history: [start] };
});

const market = document.getElementById("market");
const moneyDisplay = document.getElementById("money");
const dayDisplay = document.getElementById("day");
const eventDisplay = document.getElementById("event");

const ctx = document.getElementById('stock-graph').getContext('2d');
let chart;

function formatMoney(n) {
  return "$" + n.toLocaleString();
}

/*
  buildSVG(history, width, height, idSuffix)
  - draws the normal polyline history
  - adds a slanted background gradient and diagonal line that indicates whether the stock is moving up or down
  - colors the polyline green for up, red for down, neutral grey if unchanged
*/
function buildSVG(history, width, height, idSuffix) {
  const max = Math.max(...history);
  const min = Math.min(...history);
  const adjustedMax = (max === min) ? max + 1 : max;
  const adjustedMin = (max === min) ? min - 1 : min;

  const points = history.map((p, i) => {
    const x = (i / (history.length - 1 || 1)) * width;
    const y = height - ((p - adjustedMin) / (adjustedMax - adjustedMin)) * height;
    return `${x},${y}`;
  }).join(" ");

  // determine trend using last vs previous value (if available)
  let trend = 0; // 1 = up, -1 = down, 0 = flat/insufficient data
  if (history.length >= 2) {
    const last = history[history.length - 1];
    const prev = history[history.length - 2];
    if (last > prev) trend = 1;
    else if (last < prev) trend = -1;
  }

  // unique ids so multiple SVGs don't clash
  const gradId = `grad-${idSuffix}`;
  const maskId = `mask-${idSuffix}`;
  const polyColor = trend === 1 ? "#00ff99" : trend === -1 ? "#ff6b6b" : "#9aa3b2";
  const diagColor = trend === 1 ? "#00ff99" : trend === -1 ? "#ff5252" : "#888d99";
  const arrow = trend === 1
    ? `<polyline points="${width - 18},22 ${width - 6},32 ${width - 20},42" fill="none" stroke="${diagColor}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`
    : trend === -1
      ? `<polyline points="${width - 18},118 ${width - 6},108 ${width - 20},98" fill="none" stroke="${diagColor}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`
      : '';

  return `
    <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="${gradId}" x1="0" y1="0" x2="1" y2="1">
          ${trend === 1 ? `
            <stop offset="0%" stop-color="#002b12" stop-opacity="0.5" />
            <stop offset="100%" stop-color="#00ff99" stop-opacity="0.06" />
          ` : trend === -1 ? `
            <stop offset="0%" stop-color="#2b0000" stop-opacity="0.5" />
            <stop offset="100%" stop-color="#ff5252" stop-opacity="0.06" />
          ` : `
            <stop offset="0%" stop-color="#0b1018" stop-opacity="0.5" />
            <stop offset="100%" stop-color="#9aa3b2" stop-opacity="0.04" />
          `}
        </linearGradient>

        <!-- a subtle mask to allow the angled fill to not overlap the outer rounded corners if needed -->
        <mask id="${maskId}">
          <rect x="0" y="0" width="${width}" height="${height}" fill="white" rx="6" ry="6"/>
        </mask>
      </defs>

      <!-- angled background fill (slanted) -->
      <rect x="0" y="0" width="${width}" height="${height}" fill="url(#${gradId})" mask="url(#${maskId})" />

      <!-- diagonal indicator line -->
      ${trend === 1
        ? `<line x1="0" y1="${height}" x2="${width}" y2="0" stroke="${diagColor}" stroke-width="2" stroke-opacity="0.25"/>`
        : trend === -1
          ? `<line x1="0" y1="0" x2="${width}" y2="${height}" stroke="${diagColor}" stroke-width="2" stroke-opacity="0.25"/>`
          : `<line x1="0" y1="${height/2}" x2="${width}" y2="${height/2}" stroke="${diagColor}" stroke-width="1" stroke-opacity="0.15"/>`
      }

      <!-- the price polyline -->
      <polyline
        points="${points}"
        fill="none"
        stroke="${polyColor}"
        stroke-width="3"
        stroke-linejoin="round"
        stroke-linecap="round"
      />

      <!-- arrow to make trend explicit -->
      ${arrow}
    </svg>
  `;
}

function render() {
  market.innerHTML = "";
  moneyDisplay.textContent = formatMoney(balance);
  dayDisplay.textContent = "Day " + day;

  stocks.forEach((stock, index) => {
    const div = document.createElement("div");
    div.className = "stock";

    // build a small trend label (up/down/flat) for accessibility/readability
    const last = stock.history[stock.history.length - 1];
    const prev = stock.history[stock.history.length - 2] ?? last;
    let trendLabel = "Flat";
    if (last > prev) trendLabel = "Up";
    else if (last < prev) trendLabel = "Down";

    div.innerHTML = `
      <h3>${stock.name} <span class="trend-label">(${trendLabel})</span></h3>
      <div>Price: ${formatMoney(stock.price)}</div>
      <div>Owned: ${stock.owned}</div>
      ${buildSVG(stock.history, 300, 140, index)}
      <div class="controls">
        <button class="sell" ${stock.owned === 0 ? "disabled" : ""}>Sell</button>
        <button class="buy" ${balance < stock.price ? "disabled" : ""}>Buy</button>
      </div>
    `;

    div.querySelector(".buy").onclick = () => buyStock(index);
    div.querySelector(".sell").onclick = () => sellStock(index);

    market.appendChild(div);
  });

  renderStockGraph();
}

function buyStock(index) {
  if (balance < stocks[index].price) return;
  balance -= stocks[index].price;
  stocks[index].owned++;
  render();
}

function sellStock(index) {
  if (stocks[index].owned === 0) return;
  balance += stocks[index].price;
  stocks[index].owned--;
  render();
}

function nextDay() {
  day++;
  eventDisplay.textContent = "";

  stocks.forEach(s => {
    const change = Math.random() * (2 * STOCK_PRICE_CHANGE) - STOCK_PRICE_CHANGE;
    s.price = Math.max(5, Math.round(s.price * (1 + change)));
    s.history.push(s.price);
    if (s.history.length > 30) s.history.shift();
  });

  render();
}

function renderStockGraph() {
  if (chart) chart.destroy();

  const datasets = stocks.map((stock, index) => ({
    label: stock.name,
    data: stock.history,
    borderColor: `hsl(${index * 15}, 100%, 50%)`,
    backgroundColor: `hsl(${index * 15}, 100%, 50%)`,
    tension: 0.1
  }));

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: Array(stocks[0].history.length).fill('').map((_, i) => `Day ${i + 1}`),
      datasets
    },
    options: {
      scales: {
        y: {
          beginAtZero: false
        }
      }
    }
  });
}

document.getElementById("nextDay").onclick = nextDay;

document.getElementById("powerball").onclick = () => {
  if (balance < POWERBALL_COST) return;
  balance -= POWERBALL_COST;

  const roll = Math.random();
  if (roll < 0.000001) {
    balance += POWERBALL_JACKPOT;
    eventDisplay.textContent = `🎉 POWERBALL JACKPOT! +${formatMoney(POWERBALL_JACKPOT)}`;
  } else if (roll < 0.0005) {
    balance += 100_000;
    eventDisplay.textContent = "💰 Powerball win! +$100,000";
  } else if (roll < 0.02) {
    balance += 50;
    eventDisplay.textContent = "🙂 Small win! +$50";
  } else {
    eventDisplay.textContent = "❌ No win.";
  }

  render();
};

render();
</script>

</body>
</html>
