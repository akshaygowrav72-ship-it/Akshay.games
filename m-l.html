<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Million Clicks – Mega Shop</title>
<style>
  body {
    font-family: system-ui, Arial, sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
    padding: 30px;
  }

  h1 {
    font-size: 3rem;
  }

  #counter {
    font-size: 2.5rem;
    margin: 20px 0;
  }

  button {
    font-size: 1.1rem;
    padding: 10px 18px;
    cursor: pointer;
    margin: 6px;
  }

  .shop {
    margin-top: 40px;
    border-top: 2px solid #333;
    padding-top: 20px;
  }

  .item {
    border-bottom: 1px solid #333;
    padding: 10px 0;
  }

  .win {
    color: #55ff88;
    font-size: 2rem;
    margin-top: 20px;
  }
</style>
</head>
<body>

<h1>🖱️ Million Clicks</h1>
<div id="counter">0 / 1,000,000</div>

<button onclick="manualClick()">CLICK</button>

<div class="shop">
  <h2>🛒 Item Shop</h2>
  <div id="shopItems"></div>
</div>

<div id="win"></div>

<script>
let clicks = 0;
const goal = 1_000_000;

let clicksPerClick = 1;
let clicksPerSecond = 0;

// 20 ITEMS
const shop = [
  // CPC UPGRADES (10)
  { name: "Stronger Finger", cpc: 1, cost: 50 },
  { name: "Gaming Mouse", cpc: 2, cost: 200 },
  { name: "Energy Drink", cpc: 5, cost: 800 },
  { name: "Mechanical Keyboard", cpc: 10, cost: 3_000 },
  { name: "Double Jointed Thumb", cpc: 25, cost: 10_000 },
  { name: "Titanium Finger", cpc: 50, cost: 40_000 },
  { name: "Hydraulic Arm", cpc: 100, cost: 150_000 },
  { name: "Robot Assistant", cpc: 250, cost: 500_000 },
  { name: "Quantum Finger", cpc: 500, cost: 1_500_000 },
  { name: "Godlike Clicking Power", cpc: 1_000, cost: 5_000_000 },

  // CPS UPGRADES (10)
  { name: "Lazy Auto Clicker", cps: 1, cost: 100 },
  { name: "Phone Tapping App", cps: 3, cost: 500 },
  { name: "Macro Script", cps: 10, cost: 2_000 },
  { name: "Click Farm", cps: 25, cost: 8_000 },
  { name: "Server Rack", cps: 75, cost: 30_000 },
  { name: "Bot Army", cps: 200, cost: 120_000 },
  { name: "AI Clicker", cps: 500, cost: 400_000 },
  { name: "Quantum Computer", cps: 1_000, cost: 1_200_000 },
  { name: "Alien Technology", cps: 2_500, cost: 4_000_000 },
  { name: "Reality Itself Clicking", cps: 10_000, cost: 15_000_000 }
];

function updateDisplay() {
  document.getElementById("counter").textContent =
    `${Math.floor(clicks).toLocaleString()} / 1,000,000`;

  if (clicks >= goal) {
    document.getElementById("win").innerHTML =
      "🏆 YOU CLICKED ONE MILLION TIMES!";
  }
}

function manualClick() {
  clicks += clicksPerClick;
  updateDisplay();
}

function buyItem(index) {
  const item = shop[index];
  if (clicks >= item.cost) {
    clicks -= item.cost;
    item.cost = Math.floor(item.cost * 1.8);

    if (item.cpc) clicksPerClick += item.cpc;
    if (item.cps) clicksPerSecond += item.cps;

    renderShop();
    updateDisplay();
  }
}

function renderShop() {
  const shopDiv = document.getElementById("shopItems");
  shopDiv.innerHTML = "";

  shop.forEach((item, i) => {
    const bonus = item.cpc
      ? `+${item.cpc} clicks per click`
      : `+${item.cps} clicks per second`;

    shopDiv.innerHTML += `
      <div class="item">
        <b>${item.name}</b><br>
        ${bonus}<br>
        Cost: ${item.cost.toLocaleString()}<br>
        <button onclick="buyItem(${i})">Buy</button>
      </div>
    `;
  });
}

// Auto-click loop
setInterval(() => {
  clicks += clicksPerSecond;
  updateDisplay();
}, 1000);

renderShop();
</script>

</body>
</html>
