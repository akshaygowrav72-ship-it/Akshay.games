<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Coin Cabinet</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0e3a34;--bg2:#0a2c27;--pan:#134a42;--brass:#f0b429;--cream:#fbf3dc;--mut:#9fc5bb;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{letter-spacing:.02em;margin:0;background:var(--bg);color:var(--cream);font:400 17px/1.35 Impact,"Haettenschweiler","Arial Narrow Bold",sans-serif;min-height:100vh}
.app{max-width:1060px;margin:0 auto;padding:16px;display:grid;grid-template-columns:340px 1fr;gap:16px}
@media(max-width:820px){.app{grid-template-columns:1fr}}
.left{background:var(--bg2);border-radius:22px;padding:22px;text-align:center;align-self:start;position:relative}
h1{font:400 22px Impact,sans-serif;margin:0 0 14px;color:var(--brass)}
.coins{font:400 48px Impact,sans-serif;line-height:1}
.sub{color:var(--mut);margin:6px 0 14px}
#coin{width:200px;height:264px;border:0;background:none;cursor:pointer;padding:0;transition:transform .08s;-webkit-tap-highlight-color:transparent;position:relative}
#coin:active{transform:scale(.93) rotate(-4deg)}#coin:focus-visible,button:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
#coin img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;border-radius:24px;filter:drop-shadow(0 8px 0 #0006)}
.stats{display:flex;justify-content:space-around;margin-top:14px}.stats b{display:block;font-size:20px;color:var(--brass)}.stats span{color:var(--mut);font-size:13px}
.fl{position:fixed;pointer-events:none;font:700 22px Impact;color:var(--brass);text-shadow:0 2px 0 #000a;animation:up .8s ease-out forwards;z-index:5}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.right{background:var(--pan);border-radius:22px;padding:14px;min-height:540px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:0;border-radius:12px;background:var(--bg2);color:var(--mut);font:600 16px Impact;cursor:pointer}
.tabs button.on{background:var(--brass);color:#2a1d00}
.pn{display:none}.pn.on{display:block}
.it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border:0;border-radius:14px;background:var(--bg2);color:var(--cream);font:inherit;cursor:pointer}
.it:disabled{opacity:.45;cursor:not-allowed}.it:not(:disabled):hover{background:#0d3a33}
.it .t{flex:1}.it .t b{display:block;font-size:17px}.it .t small{color:var(--mut)}
.it .cost{font-weight:700;color:var(--brass);white-space:nowrap}.it .n{color:var(--mut);font-size:13px}
.it svg.ic{width:54px;height:54px;flex:none;background:#0000002e;border-radius:12px;padding:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-bottom:18px}
.cell{background:var(--bg2);border-radius:12px;padding:6px;text-align:center;border-bottom:4px solid var(--rc,#555)}
.cell svg{width:100%;aspect-ratio:1}.cell.lock svg{filter:brightness(0) opacity(.35)}
.cell small{display:block;font-size:12px;color:var(--mut);min-height:16px}.cell b{font-size:13px;display:block}
.ph{display:flex;justify-content:space-between;margin:4px 2px 8px;font-weight:700}.ph span{color:var(--mut);font-weight:500}
.r0{--rc:#b8c0cc}.r1{--rc:#5fd38d}.r2{--rc:#4aa8ff}.r3{--rc:#b86bff}.r4{--rc:#ffb830}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#ov.on{display:flex}
.card{background:var(--cream);color:#1b1f1c;border-radius:24px;padding:20px;width:290px;text-align:center;border:6px solid var(--rc);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.card.r4{box-shadow:0 0 0 4px #ffb83055,0 0 60px 10px #ffb830aa}
@keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}}
.card svg{width:190px;height:190px}.card h2{margin:4px 0 0;font:400 26px Impact}.card .rl{font-weight:700;color:#1b1f1c;margin:4px 0 12px}
.rl i{font-style:normal;background:var(--rc);padding:2px 12px;border-radius:99px}
.nw{position:absolute;margin-left:-250px;margin-top:-6px;transform:rotate(-12deg);background:#e5322d;color:#fff;padding:2px 12px;border-radius:8px;font-weight:700}
.btns{display:flex;gap:8px;justify-content:center}
.btns button{padding:10px 16px;border:0;border-radius:12px;font:700 15px Impact;cursor:pointer;background:var(--brass);color:#2a1d00}
.btns button.g{background:#d8d0b4}.btns button:disabled{opacity:.4}
.rs{background:none;border:0;color:var(--mut);margin-top:16px;cursor:pointer;font:inherit;text-decoration:underline}
.pv{background:var(--bg);color:var(--cream);border-radius:24px;padding:18px;width:min(560px,100%);max-height:92vh;overflow:auto;animation:pop .3s}.pv h2{margin:0 0 4px;font:400 28px Impact;color:var(--brass)}.pv .grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));margin:12px 0}.pv .cell b{color:var(--cream)}.pv .pc{color:var(--brass);font-size:15px}.pv .btns{margin-top:6px}.pv .btns button{font-size:17px}
#lg{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}#lg.off{display:none}#lg form{background:var(--bg2);padding:28px;border-radius:24px;text-align:center;width:min(380px,100%)}#lg input{width:100%;padding:12px 14px;border-radius:12px;border:3px solid var(--brass);background:var(--bg);color:var(--cream);font:400 20px Impact;margin:14px 0;text-align:center}#lg button{width:100%;padding:12px;border:0;border-radius:12px;background:var(--brass);color:#2a1d00;font:400 20px Impact;cursor:pointer}
.me{color:var(--mut);margin-bottom:8px}.me button{background:none;border:0;color:var(--brass);cursor:pointer;font:inherit;text-decoration:underline}#sv{font-size:13px;color:var(--mut);height:16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

const RN=["Common","Uncommon","Rare","Epic","Legendary"],RW=[55,25,12,6,2],RB=[.2,1,4,15,60];
const UPS=[{id:"f",n:"Sharper Finger",d:"+1 coin per click",c:15,k:1},{id:"h",n:"Strong Grip",d:"+5 coins per click",c:200,k:5},{id:"g",n:"Gold Gauntlet",d:"+40 coins per click",c:3000,k:40},{id:"a",n:"Auto Clicker",d:"+1 coin per second",c:50,s:1},{id:"m",n:"Coin Mill",d:"+8 coins per second",c:700,s:8},{id:"n",n:"Mint",d:"+60 coins per second",c:7000,s:60},{id:"v",n:"Vault Press",d:"+400 coins per second",c:60000,s:400}];
const $=s=>document.querySelector(s);
const fmt=n=>{n=Math.floor(n);if(n<1e3)return""+n;const u=["K","M","B","T"];let i=-1;while(n>=1e3&&i<3){n/=1e3;i++}return(n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[i]};
let S={coins:0,up:{},own:{}},U=null;
const key=u=>"coincab3:"+u.toLowerCase();
function save(){if(!U)return;try{localStorage.setItem(key(U),JSON.stringify(S));localStorage.setItem("coincab3:last",U);$("#sv").textContent="Autosaved";}catch(e){$("#sv").textContent="Could not save"}}
function login(u){U=u;S={coins:0,up:{},own:{}};try{const j=localStorage.getItem(key(u));if(j)S=Object.assign(S,JSON.parse(j))}catch(e){}$("#nm").textContent=u;$("#lg").classList.add("off");save();ref();cl()}
const cost=u=>Math.ceil(u.c*Math.pow(1.15,S.up[u.id]||0));
const clickV=()=>1+UPS.reduce((a,u)=>a+(u.k||0)*(S.up[u.id]||0),0);
const bonus=()=>{let b=0;PACKS.forEach(p=>p.items.forEach((it,i)=>{b+=(S.own[p.id+i]||0)*RB[it[1]]}));return b};
const cps=()=>UPS.reduce((a,u)=>a+(u.s||0)*(S.up[u.id]||0),0)+bonus();
const found=()=>PACKS.reduce((a,p)=>a+p.items.filter((_,i)=>S.own[p.id+i]).length,0);
const total=PACKS.reduce((a,p)=>a+p.items.length,0);
$("#up").innerHTML=UPS.map(u=>`<button class="it" data-u="${u.id}"><div class="t"><b>${u.n}</b><small>${u.d}</small></div><div style="text-align:right"><div class="cost"></div><div class="n"></div></div></button>`).join("");
$("#pk").innerHTML=PACKS.slice().sort((a,b)=>a.cost-b.cost).map(p=>`<button class="it" data-p="${p.id}">${p.items[p.ic][2].replace("<svg",'<svg class="ic"')}<div class="t"><b>${p.name}</b><small></small></div><div class="cost">${fmt(p.cost)}</div></button>`).join("");
function cl(){$("#cl").innerHTML=PACKS.map(p=>`<div class="ph">${p.name}<span>${p.items.filter((_,i)=>S.own[p.id+i]).length} / ${p.items.length}</span></div><div class="grid">${p.items.map((it,i)=>{const n=S.own[p.id+i]||0;return`<div class="cell r${it[1]}${n?"":" lock"}">${it[2]}<b>${n?it[0]:"???"}</b><small>${n?RN[it[1]]+" x"+n:""}</small></div>`}).join("")}</div>`).join("")}
function ref(){
$("#co").textContent=fmt(S.coins);$("#cps").textContent=cps()<100?cps().toFixed(1):fmt(cps());$("#cv").textContent=fmt(clickV());$("#cb").textContent="+"+(bonus()<100?bonus().toFixed(1):fmt(bonus()));$("#fd").textContent=found()+"/"+total;
document.querySelectorAll("[data-u]").forEach(b=>{const u=UPS.find(x=>x.id==b.dataset.u),c=cost(u);b.querySelector(".cost").textContent=fmt(c);b.querySelector(".n").textContent="Owned: "+(S.up[u.id]||0);b.disabled=S.coins<c});
document.querySelectorAll("[data-p]").forEach(b=>{if(!b.classList.contains("it"))return;const p=PACKS.find(x=>x.id==b.dataset.p);b.disabled=S.coins<p.cost;b.querySelector("small").textContent=p.items.filter((_,i)=>S.own[p.id+i]).length+" of "+p.items.length+" found"})}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button,.pn").forEach(x=>x.classList.remove("on"));b.classList.add("on");$("#"+b.dataset.p).classList.add("on");if(b.dataset.p=="cl")cl()});
$("#coin").addEventListener("click",e=>{const v=clickV();S.coins+=v;const f=document.createElement("span");f.className="fl";f.textContent="+"+fmt(v);const r=e.clientX||innerWidth/2,t=e.clientY||innerHeight/2;f.style.left=r-14+(Math.random()*30-15)+"px";f.style.top=t-30+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),800);ref()});
$("#up").onclick=e=>{const b=e.target.closest("[data-u]");if(!b)return;const u=UPS.find(x=>x.id==b.dataset.u),c=cost(u);if(S.coins<c)return;S.coins-=c;S.up[u.id]=(S.up[u.id]||0)+1;ref();save()};
const pct=(p,it)=>{const rs=[...new Set(p.items.map(i=>i[1]))],tw=rs.reduce((a,r)=>a+RW[r],0);return RW[it[1]]/tw*100/p.items.filter(i=>i[1]==it[1]).length};
function preview(p){$("#rv").innerHTML=`<div class="pv"><h2>${p.name}</h2><div>Each pack gives one creature. Duplicates add to your coins per second.</div><div class="grid">${p.items.map((it,i)=>{const n=S.own[p.id+i]||0;return`<div class="cell r${it[1]}">${it[2]}<b>${it[0]}</b><small>${RN[it[1]]}</small><small class="pc">${pct(p,it).toFixed(1)}%</small></div>`}).join("")}</div><div class="btns"><button id="by" ${S.coins<p.cost?"disabled":""}>Buy for ${fmt(p.cost)}</button><button class="g" id="cx">Close</button></div></div>`;$("#ov").classList.add("on");$("#by").onclick=()=>open(p);$("#cx").onclick=()=>{$("#ov").classList.remove("on")}}
function open(p){if(S.coins<p.cost)return;S.coins-=p.cost;const rs=[...new Set(p.items.map(i=>i[1]))],tw=rs.reduce((a,r)=>a+RW[r],0);let x=Math.random()*tw,r=rs[0];for(const q of rs){if(x<RW[q]){r=q;break}x-=RW[q]}
const ids=p.items.map((_,i)=>i).filter(i=>p.items[i][1]==r),i=ids[Math.floor(Math.random()*ids.length)],it=p.items[i],k=p.id+i,nw=!S.own[k];S.own[k]=(S.own[k]||0)+1;ref();save();
$("#rv").innerHTML=`<div class="card r${r}">${nw?'<div class="nw">New!</div>':""}${it[2]}<h2>${it[0]}</h2><div class="rl r${r}"><i>${RN[r]}</i></div><div class="btns"><button id="ag">Back to pack</button><button class="g" id="cx">Close</button></div></div>`;
$("#ag").onclick=()=>preview(p);$("#cx").onclick=()=>{$("#ov").classList.remove("on");cl()}}
$("#pk").onclick=e=>{const b=e.target.closest("button[data-p]");if(b)preview(PACKS.find(x=>x.id==b.dataset.p))};
$("#rs").onclick=()=>{if(confirm("Erase all progress?")){S={coins:0,up:{},own:{}};save();ref();cl()}};
setInterval(()=>{if(U){S.coins+=cps()/10;ref()}},100);
setInterval(save,2000);
addEventListener("pagehide",save);document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});
$("#lf").onsubmit=e=>{e.preventDefault();const u=$("#un").value.trim();if(u)login(u)};
$("#sw").onclick=()=>{save();U=null;$("#lg").classList.remove("off");$("#un").focus()};
try{$("#un").value=localStorage.getItem("coincab3:last")||""}catch(e){}
</script></body></html>
