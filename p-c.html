<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Coin Cabinet</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0e3a34;--bg2:#0a2c27;--pan:#134a42;--brass:#f0b429;--cream:#fbf3dc;--mut:#9fc5bb;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{letter-spacing:.02em;margin:0;background:var(--bg);color:var(--cream);font:400 17px/1.35 Impact,"Haettenschweiler","Arial Narrow Bold",sans-serif;min-height:100vh}
.app{max-width:1060px;margin:0 auto;padding:16px;display:grid;grid-template-columns:340px 1fr;gap:16px}
@media(max-width:820px){.app{grid-template-columns:1fr}}
.left{background:var(--bg2);border-radius:22px;padding:22px;text-align:center;align-self:start;position:relative}
h1{font:400 22px Impact,sans-serif;margin:0 0 14px;color:var(--brass)}
.coins{font:400 48px Impact,sans-serif;line-height:1}
.sub{color:var(--mut);margin:6px 0 14px}
#coin{width:200px;height:264px;border:0;background:none;cursor:pointer;padding:0;transition:transform .08s;-webkit-tap-highlight-color:transparent;position:relative}
#coin:active{transform:scale(.93) rotate(-4deg)}#coin:focus-visible,button:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
#coin svg{width:100%;height:100%;filter:drop-shadow(0 8px 0 #0006)}
.stats{display:flex;justify-content:space-around;margin-top:14px}.stats b{display:block;font-size:20px;color:var(--brass)}.stats span{color:var(--mut);font-size:13px}
.fl{position:fixed;pointer-events:none;font:700 22px Impact;color:var(--brass);text-shadow:0 2px 0 #000a;animation:up .8s ease-out forwards;z-index:5}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.right{background:var(--pan);border-radius:22px;padding:14px;min-height:540px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:0;border-radius:12px;background:var(--bg2);color:var(--mut);font:600 16px Impact;cursor:pointer}
.tabs button.on{background:var(--brass);color:#2a1d00}
.pn{display:none}.pn.on{display:block}
.it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border:0;border-radius:14px;background:var(--bg2);color:var(--cream);font:inherit;cursor:pointer}
.it:disabled{opacity:.45;cursor:not-allowed}.it:not(:disabled):hover{background:#0d3a33}
.it .t{flex:1}.it .t b{display:block;font-size:17px}.it .t small{color:var(--mut)}
.it .cost{font-weight:700;color:var(--brass);white-space:nowrap}.it .n{color:var(--mut);font-size:13px}
.it .ic{width:54px;height:54px;flex:none;background:#0000002e;border-radius:12px;padding:3px;object-fit:contain}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-bottom:18px}
.cell{background:var(--bg2);border-radius:12px;padding:6px;text-align:center;border-bottom:4px solid var(--rc,#555)}
.cell svg,.cell img{width:100%;aspect-ratio:1;object-fit:contain;display:block;border-radius:8px}.cell.lock svg,.cell.lock img{filter:brightness(0) opacity(.35)}
.cell small{display:block;font-size:12px;color:var(--mut);min-height:16px}.cell b{font-size:13px;display:block}
.ph{display:flex;justify-content:space-between;margin:4px 2px 8px;font-weight:700}.ph span{color:var(--mut);font-weight:500}
.r0{--rc:#b8c0cc}.r1{--rc:#5fd38d}.r2{--rc:#4aa8ff}.r3{--rc:#b86bff}.r4{--rc:#ffb830}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#ov.on{display:flex}
.card{position:relative;background:var(--cream);color:#1b1f1c;border-radius:24px;padding:20px;width:290px;text-align:center;border:6px solid var(--rc);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.card.r4{box-shadow:0 0 0 4px #ffb83055,0 0 60px 10px #ffb830aa}
@keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}}
.card svg,.card img{width:190px;height:190px;object-fit:contain;border-radius:12px}.card h2{margin:4px 0 0;font:400 26px Impact}.card .rl{font-weight:700;color:#1b1f1c;margin:4px 0 12px}
.rl i{font-style:normal;background:var(--rc);padding:2px 12px;border-radius:99px}
.nw{position:absolute;top:-18px;left:-18px;transform:rotate(-12deg);background:#e5322d;color:#fff;padding:2px 12px;border-radius:8px;font-weight:700}
.btns{display:flex;gap:8px;justify-content:center}
.btns button{padding:10px 16px;border:0;border-radius:12px;font:700 15px Impact;cursor:pointer;background:var(--brass);color:#2a1d00}
.btns button.g{background:#d8d0b4}.btns button:disabled{opacity:.4;cursor:not-allowed}
.rs{background:none;border:0;color:var(--mut);margin-top:16px;cursor:pointer;font:inherit;text-decoration:underline}
.pv{background:var(--bg);color:var(--cream);border-radius:24px;padding:18px;width:min(560px,100%);max-height:92vh;overflow:auto;animation:pop .3s}.pv h2{margin:0 0 4px;font:400 28px Impact;color:var(--brass)}
#lg{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}#lg.off{display:none}#lg form{background:var(--bg2);padding:28px;border-radius:20px;min-width:min(320px,100%);box-shadow:0 24px 54px #0007}#lg input{width:100%;padding:12px 14px;border-radius:12px;border:0;background:#0d473f;color:var(--cream);font:inherit;margin:12px 0 8px}#lg h1{margin-bottom:10px}.me{color:var(--mut);margin-bottom:8px}.me button{background:none;border:0;color:var(--brass);cursor:pointer;font:inherit;text-decoration:underline}#sv{font-size:13px;color:var(--mut);height:16px}
.r5{--rc:#ff5ad9}
@keyframes chroma{0%,100%{border-color:#ff4d4d}17%{border-color:#ffb830}33%{border-color:#5fd38d}50%{border-color:#4aa8ff}67%{border-color:#b86bff}83%{border-color:#ff5ad9}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.cell.r5{animation:chroma 3s linear infinite}
.card.r5{animation:pop .45s cubic-bezier(.2,1.4,.4,1),chroma 3s linear infinite;box-shadow:0 0 0 4px #ff5ad955,0 0 60px 10px #4aa8ffaa}
.rl.r5 i{background:linear-gradient(90deg,#ff4d4d,#ffb830,#5fd38d,#4aa8ff,#b86bff);color:#fff}
.cell.r5 svg,.cell.r5 img,.card.r5 svg,.card.r5 img{animation:hue 4s linear infinite}
.cell.lock svg,.cell.lock img{animation:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<section class="left"><h1>Coin Cabinet</h1><div class="me">Playing as <b id="nm"></b> <button id="sw">Switch</button></div>

<div class="stats"><div><b id="cv">1</b><span>per click</span></div><div><b id="cb">0</b><span>creature bonus</span></div><div><b id="fd">0</b><span>found</span></div></div>
<div id="sv"></div><button class="rs" id="rs">Reset progress</button></section>
<section class="right"><div class="tabs"><button data-p="up" class="on">Upgrades</button><button data-p="pk">Packs</button><button data-p="cl">Collection</button></div>
<div class="pn on" id="up"></div><div class="pn" id="pk"></div><div class="pn" id="cl"></div></section></div>

    for(let x=0;x<16;x++){
      const d=(x-7.5)**2+(y-8.5)**2,tx=x>>1,ty=y>>1;
      s+=d>42?".":((tx+ty)%2?"w":cs[(tx*2+ty)%5]);
    }
    r.push(s);
  }
  return spark(ov(r,pts("g",[[7,0],[8,0],[7,1],[8,1]])));
})()};

const RN=["Common","Uncommon","Rare","Epic","Legendary","Chroma"],RW=[55,25,12,6,2,1],RB=[.2,1,4,15,60,200];

const $=s=>document.querySelector(s);
const fmt=n=>{n=Math.floor(n);if(n<1e3)return""+n;const u=["K","M","B","T"];let i=-1;while(n>=1e3&&i<3){n/=1e3;i++}return(n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[i]};
let S={coins:0,up:{},own:{}},U=null;

function save(){if(!U)return;try{localStorage.setItem(key(U),JSON.stringify(S));localStorage.setItem("coincab3:last",U);$("#sv").textContent="Autosaved";}catch(e){$("#sv").textContent="Could not save";}}
function login(u){U=u;S={coins:0,up:{},own:{}};try{const j=localStorage.getItem(key(u));if(j)S=Object.assign(S,JSON.parse(j))}catch(e){}S.up=S.up||{};S.own=S.own||{};$("#nm").textContent=u;$("#lg").classList.add("off");save();ref();cl();}
const cost=u=>Math.ceil(u.c*Math.pow(1.15,S.up[u.id]||0));

const found=()=>PACKS.reduce((a,p)=>a+p.items.filter((_,i)=>S.own[p.id+i]).length,0);

function cl(){$("#cl").innerHTML=PACKS.map(p=>`<div class="ph">${p.name}<span>${p.items.filter((_,i)=>S.own[p.id+i]).length} / ${p.items.length}</span></div><div class="grid">${p.items.map((it,i)=>{const k=p.id+i;const owned=S.own[k]||0;const rarity=RN[it[1]];return `<div class="cell r${it[1]} ${owned?'':'lock'}">${it[2].replace(/^<(svg|img)/,'<$1 class="art"')}<small>${owned?rarity:"Locked"}</small><b>${it[0]}</b></div>`;}).join("")}</div>`).join("")}
function ref(){
$("#co").textContent=fmt(S.coins);$("#cps").textContent=cps()<100?cps().toFixed(1):fmt(cps());$("#cv").textContent=fmt(clickV());$("#cb").textContent="+"+(bonus()<100?bonus().toFixed(1):fmt(bonus()));$("#fd").textContent=fmt(found());
document.querySelectorAll("[data-u]").forEach(b=>{const u=UPS.find(x=>x.id==b.dataset.u),c=cost(u);b.querySelector(".cost").textContent=fmt(c);b.querySelector(".n").textContent="Owned: "+(S.up[u.id]||0);b.disabled=S.coins<c;});

}

function preview(p){$("#ov").classList.add("on");$("#rv").innerHTML=`<div class="pv"><h2>${p.name}</h2><div>Each pack gives one creature. Duplicates add to your coins per second.</div><div class="grid">${p.items.map((it,i)=>`<div class="cell r${it[1]}">${it[2]}<small>${RN[it[1]]}</small><b>${it[0]}</b></div>`).join("")}</div><div class="btns" style="margin-top:12px"><button id="ob" data-p="${p.id}">Open pack (${fmt(p.cost)})</button><button id="cx" class="g">Close</button></div></div>`;$("#ob").disabled=S.coins<p.cost;$("#ob").onclick=()=>openPack(p);$("#cx").onclick=closeOv};
function openPack(p){if(S.coins<p.cost)return;S.coins-=p.cost;const rs=[...new Set(p.items.map(i=>i[1]))],tw=rs.reduce((a,r)=>a+RW[r],0);let x=Math.random()*tw,r=rs[rs.length-1];for(const q of rs){if(x<RW[q]){r=q;break;}x-=RW[q];}const ids=p.items.map((_,i)=>i).filter(i=>p.items[i][1]==r),i=ids[Math.floor(Math.random()*ids.length)],it=p.items[i],k=p.id+i,nw=!S.own[k];S.own[k]=(S.own[k]||0)+1;ref();save();$("#ov").classList.add("on");$("#rv").innerHTML=`<div class="card r${r}">${nw?'<div class="nw">New!</div>':""}${it[2]}<h2>${it[0]}</h2><div class="rl r${r}"><i>${RN[r]}</i></div><div class="btns"><button id="ag">Back to pack</button><button id="cx" class="g">Close</button></div></div>`;$("#ag").onclick=()=>preview(p);$("#cx").onclick=closeOv};
