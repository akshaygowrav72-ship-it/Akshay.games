<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PIXEL ROW ARCADE</title>
<style>
  :root{
    --void: #05050a;
    --marquee-pink: #ff3d81;
    --marquee-cyan: #35e3ff;
    --marquee-yellow: #ffd23f;
    --coin: #ffcf3f;
    --cab-body: #2b2b3d;
    --cab-body-dark: #1a1a26;
    --cab-trim: #45455e;
    --screen-off: #0a0e12;
    --text: #eef0ff;
  }

  * { box-sizing: border-box; }

  html, body{
    margin:0; padding:0; min-height:100%;
    background:
      radial-gradient(ellipse 900px 500px at 50% 0%, #1a1230 0%, var(--void) 55%),
      var(--void);
    color: var(--text);
    font-family: 'Courier New', monospace;
    overflow-x:hidden;
  }

  body::before{
    content:'';
    position:fixed; inset:0;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
    z-index: 500;
  }
  body::after{
    content:'';
    position:fixed; inset:0;
    box-shadow: inset 0 0 220px 60px rgba(0,0,0,0.85);
    pointer-events:none;
    z-index: 501;
  }

  #floor{
    min-height:100vh;
    padding: 48px 24px 90px;
    display:flex; flex-direction:column; align-items:center;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 42px 42px;
  }

  header{ text-align:center; margin-bottom: 46px; }

  #marquee{
    display:inline-block;
    padding: 16px 40px;
    border: 4px solid var(--cab-trim);
    border-radius: 10px;
    background: linear-gradient(180deg, #17172a, #0d0d18);
    box-shadow:
      0 0 0 3px #000,
      0 0 24px rgba(255,61,129,0.35),
      inset 0 0 24px rgba(53,227,255,0.08);
    position:relative;
  }
  #marquee::before, #marquee::after{
    content:'';
    position:absolute; top:8px; bottom:8px; width:6px;
    background: repeating-linear-gradient(to bottom, var(--coin) 0 6px, transparent 6px 12px);
    opacity:0.6;
  }
  #marquee::before{ left:10px; }
  #marquee::after{ right:10px; }

  h1{
    margin:0;
    font-family: 'Courier New', monospace;
    font-weight: 900;
    font-size: clamp(20px, 4vw, 34px);
    letter-spacing: 6px;
    line-height:1.6;
    background: linear-gradient(90deg, var(--marquee-pink), var(--marquee-yellow), var(--marquee-cyan));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(255,61,129,0.25);
    animation: hue-drift 8s linear infinite;
  }
  @keyframes hue-drift{
    0%,100%{ filter: hue-rotate(0deg); }
    50%{ filter: hue-rotate(20deg); }
  }

  #tagline{
    margin-top: 10px;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--marquee-cyan);
    opacity: 0.85;
  }

  #insertCoin{
    margin-top: 18px;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--coin);
    animation: blink 1.4s steps(1) infinite;
  }
  @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }

  #grid{
    display:grid;
    grid-template-columns: repeat(3, minmax(180px, 220px));
    gap: 34px 30px;
    max-width: 900px;
  }

  .cabinet{
    appearance:none; border:none; cursor:pointer;
    background: transparent;
    padding:0;
    display:flex; flex-direction:column; align-items:center;
    font-family:'Courier New', monospace;
    color: var(--text);
    transition: transform 0.12s ease;
  }
  .cabinet:hover{ transform: translateY(-4px); }
  .cabinet:active{ transform: translateY(1px) scale(0.98); }
  .cabinet:focus-visible .cab-shell{
    outline: 3px solid var(--marquee-cyan);
    outline-offset: 3px;
  }

  .cab-shell{
    width: 170px;
    border-radius: 6px;
    background: var(--cab-body);
    box-shadow:
      0 0 0 3px #000,
      0 10px 0 0 var(--cab-body-dark),
      0 16px 20px rgba(0,0,0,0.6);
    position:relative;
    padding: 10px 10px 14px;
    border-top: 4px solid var(--cab-trim);
  }

  .cab-marquee{
    height: 22px;
    border-radius: 3px;
    display:flex; align-items:center; justify-content:center;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 1px;
    font-family:'Courier New',monospace;
    color:#0a0a12;
    margin-bottom: 8px;
    box-shadow: 0 0 10px currentColor;
    overflow:hidden;
    white-space:nowrap;
    text-overflow: ellipsis;
    padding: 0 4px;
  }

  .cab-screen{
    height: 78px;
    border-radius: 3px;
    background: var(--screen-off);
    border: 3px solid #000;
    box-shadow: inset 0 0 14px rgba(0,0,0,0.9);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .cab-screen::after{
    content:'';
    position:absolute; inset:0;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.05) 0 1px, transparent 1px 3px);
  }
  .cab-screen svg{ width: 60%; height: 60%; position:relative; z-index:1; }

  .cab-controls{
    display:flex; align-items:center; justify-content:space-between;
    margin-top: 10px; padding: 0 4px;
  }
  .cab-joystick{
    width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff5c6c, #8c1c28);
    box-shadow: 0 0 0 3px var(--cab-body-dark), 0 3px 0 rgba(0,0,0,0.5);
  }
  .cab-buttons{ display:flex; gap:6px; }
  .cab-buttons span{
    width: 10px; height: 10px; border-radius: 50%;
    display:block;
    box-shadow: 0 2px 0 rgba(0,0,0,0.5);
  }

  .cab-label{
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: 1px;
    text-align:center;
    color: var(--text);
    opacity: 0.9;
  }
  .cab-label b{
    display:block;
    font-family:'Courier New',monospace;
    font-weight:900;
    font-size: 11px;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }

  .cab-base{
    width: 190px;
    height: 12px;
    margin-top: -2px;
    background: linear-gradient(180deg, #17171f, #0a0a10);
    border-radius: 0 0 4px 4px;
    box-shadow: 0 0 0 3px #000;
  }

  footer{
    margin-top: 60px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #6a6a86;
    text-align:center;
  }

  #player{
    position: fixed; inset: 0;
    background: #000;
    display:none;
    flex-direction: column;
    z-index: 1000;
  }
  #player.show{ display:flex; }
  #playerBar{
    display:flex; align-items:center; gap:14px;
    padding: 10px 16px;
    background: linear-gradient(180deg, #16162a, #0c0c18);
    border-bottom: 3px solid var(--cab-trim);
    font-family:'Courier New',monospace;
    font-weight:900;
    font-size: 12px;
    letter-spacing:1px;
    flex-shrink:0;
  }
  #backBtn{
    appearance:none; border:2px solid var(--marquee-cyan); background:transparent;
    color: var(--marquee-cyan); font-family:inherit; font-size: 11px; font-weight:900;
    padding: 8px 14px; border-radius:4px; cursor:pointer; letter-spacing:1px;
    box-shadow: 0 0 10px rgba(53,227,255,0.25);
  }
  #backBtn:hover{ background: rgba(53,227,255,0.12); }
  #playerTitle{ color: var(--coin); }
  #playerFrame{
    flex:1;
    border:none;
    width:100%;
    background:#000;
  }
</style>
</head>
<body>

<div id="floor">
  <header>
    <div id="marquee">
      <h1>PIXEL ROW<br/>ARCADE</h1>
    </div>
    <div id="tagline">NINE CABINETS &middot; ONE TOKEN &middot; ZERO QUARTERS</div>
    <div id="insertCoin">&#9650; SELECT A CABINET TO PLAY &#9650;</div>
  </header>

  <div id="grid"></div>

  <footer>WASD / ARROWS TO MOVE &middot; EACH CABINET RUNS ITS OWN RULES &middot; HAVE FUN</footer>
</div>

<div id="player">
  <div id="playerBar">
    <button id="backBtn">&#8592; BACK TO ARCADE</button>
    <span id="playerTitle">LOADING...</span>
  </div>
  <iframe id="playerFrame" title="game frame"></iframe>
</div>

<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <title>Snake</title> <style>   :root {     --bg: #0f172a;     --board: #1e293b;     --grid: #24324a;     --snake: #4ade80;     --snake-head: #22c55e;     --food: #f87171;     --text: #e2e8f0;     --accent: #38bdf8;   }   * { box-sizing: border-box; }   body {     margin: 0;     min-height: 100vh;     display: flex;     flex-direction: column;     align-items: center;     justify-content: center;     background: var(--bg);     font-family: 'Segoe UI', Arial, sans-serif;     color: var(--text);     gap: 12px;     padding: 20px;   }   h1 {     margin: 0;     letter-spacing: 2px;     font-size: 28px;     color: var(--accent);   }   #hud {     display: flex;     gap: 24px;     font-size: 16px;   }   #hud span { color: var(--accent); font-weight: bold; }   canvas {     background: var(--board);     border: 3px solid var(--accent);     border-radius: 8px;     image-rendering: pixelated;   }   #overlay {     position: fixed;     inset: 0;     background: rgba(15, 23, 42, 0.85);     display: none;     align-items: center;     justify-content: center;     flex-direction: column;     gap: 14px;     text-align: center;   }   #overlay.show { display: flex; }   #overlay h2 { font-size: 32px; margin: 0; color: var(--food); }   button {     background: var(--accent);     border: none;     padding: 10px 22px;     font-size: 16px;     border-radius: 6px;     cursor: pointer;     font-weight: bold;     color: #0f172a;   }   button:hover { opacity: 0.85; }   #hint {     font-size: 13px;     color: #94a3b8;   }   .mobile-controls {     display: grid;     grid-template-columns: repeat(3, 56px);     grid-template-rows: repeat(2, 56px);     gap: 6px;     margin-top: 4px;   }   .mobile-controls button {     width: 56px;     height: 56px;     font-size: 20px;     padding: 0;   }   #up { grid-column: 2; grid-row: 1; }   #left { grid-column: 1; grid-row: 2; }   #down { grid-column: 2; grid-row: 2; }   #right { grid-column: 3; grid-row: 2; } </style> </head> <body>  <h1>SNAKE</h1> <div id="hud">   <div>Score: <span id="score">0</span></div>   <div>Best: <span id="best">0</span></div> </div> <canvas id="game" width="400" height="400"></canvas> <div id="hint">Use arrow keys / WASD to move &middot; Space to pause</div>  <div class="mobile-controls">   <button id="up">&uarr;</button>   <button id="left">&larr;</button>   <button id="down">&darr;</button>   <button id="right">&rarr;</button> </div>  <div id="overlay">   <h2 id="overlayTitle">Game Over</h2>   <div id="overlayScore"></div>   <button id="restartBtn">Play Again</button> </div>  <script> const canvas = document.getElementById('game'); const ctx = canvas.getContext('2d'); const scoreEl = document.getElementById('score'); const bestEl = document.getElementById('best'); const overlay = document.getElementById('overlay'); const overlayTitle = document.getElementById('overlayTitle'); const overlayScore = document.getElementById('overlayScore'); const restartBtn = document.getElementById('restartBtn');  const GRID = 20; const CELLS = canvas.width / GRID; let snake, dir, nextDir, food, score, best, gameOver, paused, speedMs, lastTime, acc;  best = 0;  function resetGame() {   snake = [     { x: 8, y: 10 },     { x: 7, y: 10 },     { x: 6, y: 10 }   ];   dir = { x: 1, y: 0 };   nextDir = { x: 1, y: 0 };   score = 0;   gameOver = false;   paused = false;   speedMs = 110;   acc = 0;   lastTime = null;   placeFood();   scoreEl.textContent = score;   overlay.classList.remove('show');   requestAnimationFrame(loop); }  function placeFood() {   let valid = false;   while (!valid) {     food = {       x: Math.floor(Math.random() * CELLS),       y: Math.floor(Math.random() * CELLS)     };     valid = !snake.some(s => s.x === food.x && s.y === food.y);   } }  function setDirection(x, y) {   /* prevent reversing directly into itself */   if (dir.x === -x && dir.y === -y) return;   nextDir = { x, y }; }  document.addEventListener('keydown', (e) => {   if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();   switch (e.key) {     case 'ArrowUp': case 'w': case 'W': setDirection(0, -1); break;     case 'ArrowDown': case 's': case 'S': setDirection(0, 1); break;     case 'ArrowLeft': case 'a': case 'A': setDirection(-1, 0); break;     case 'ArrowRight': case 'd': case 'D': setDirection(1, 0); break;     case ' ':       if (!gameOver) paused = !paused;       break;   } });  document.getElementById('up').addEventListener('click', () => setDirection(0, -1)); document.getElementById('down').addEventListener('click', () => setDirection(0, 1)); document.getElementById('left').addEventListener('click', () => setDirection(-1, 0)); document.getElementById('right').addEventListener('click', () => setDirection(1, 0));  restartBtn.addEventListener('click', resetGame);  function update() {   dir = nextDir;   const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };    /* wall collision */   if (head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS) {     return endGame();   }   /* self collision */   if (snake.some(s => s.x === head.x && s.y === head.y)) {     return endGame();   }    snake.unshift(head);    if (head.x === food.x && head.y === food.y) {     score += 10;     scoreEl.textContent = score;     if (speedMs > 55) speedMs -= 2;     placeFood();   } else {     snake.pop();   } }  function endGame() {   gameOver = true;   if (score > best) {     best = score;     bestEl.textContent = best;   }   overlayTitle.textContent = 'Game Over';   overlayScore.textContent = `Score: ${score}  •  Best: ${best}`;   overlay.classList.add('show'); }  function draw() {   ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--board');   ctx.fillRect(0, 0, canvas.width, canvas.height);    /* grid */   ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid');   ctx.lineWidth = 1;   for (let i = 0; i <= CELLS; i++) {     ctx.beginPath();     ctx.moveTo(i * GRID, 0);     ctx.lineTo(i * GRID, canvas.height);     ctx.stroke();     ctx.beginPath();     ctx.moveTo(0, i * GRID);     ctx.lineTo(canvas.width, i * GRID);     ctx.stroke();   }    /* food */   ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--food');   roundRect(food.x * GRID + 2, food.y * GRID + 2, GRID - 4, GRID - 4, 5);    /* snake */   snake.forEach((seg, i) => {     ctx.fillStyle = i === 0       ? getComputedStyle(document.documentElement).getPropertyValue('--snake-head')       : getComputedStyle(document.documentElement).getPropertyValue('--snake');     roundRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2, 4);   });    if (paused && !gameOver) {     ctx.fillStyle = 'rgba(15,23,42,0.6)';     ctx.fillRect(0, 0, canvas.width, canvas.height);     ctx.fillStyle = '#e2e8f0';     ctx.font = 'bold 28px sans-serif';     ctx.textAlign = 'center';     ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);   } }  function roundRect(x, y, w, h, r) {   ctx.beginPath();   ctx.moveTo(x + r, y);   ctx.arcTo(x + w, y, x + w, y + h, r);   ctx.arcTo(x + w, y + h, x, y + h, r);   ctx.arcTo(x, y + h, x, y, r);   ctx.arcTo(x, y, x + w, y, r);   ctx.closePath();   ctx.fill(); }  function loop(timestamp) {   if (gameOver) return;   if (lastTime === null) lastTime = timestamp;   const delta = timestamp - lastTime;   lastTime = timestamp;    if (!paused) {     acc += delta;     if (acc >= speedMs) {       acc = 0;       update();     }   }   draw();   if (!gameOver) requestAnimationFrame(loop); }  resetGame(); <<CLOSE_SCRIPT_TAG>>> </body> </html>

<script type="text/plain" id="src-snake">
<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <title>Snake</title> <style>   :root {     --bg: #0f172a;     --board: #1e293b;     --grid: #24324a;     --snake: #4ade80;     --snake-head: #22c55e;     --food: #f87171;     --text: #e2e8f0;     --accent: #38bdf8;   }   * { box-sizing: border-box; }   body {     margin: 0;     min-height: 100vh;     display: flex;     flex-direction: column;     align-items: center;     justify-content: center;     background: var(--bg);     font-family: 'Segoe UI', Arial, sans-serif;     color: var(--text);     gap: 12px;     padding: 20px;   }   h1 {     margin: 0;     letter-spacing: 2px;     font-size: 28px;     color: var(--accent);   }   #hud {     display: flex;     gap: 24px;     font-size: 16px;   }   #hud span { color: var(--accent); font-weight: bold; }   canvas {     background: var(--board);     border: 3px solid var(--accent);     border-radius: 8px;     image-rendering: pixelated;   }   #overlay {     position: fixed;     inset: 0;     background: rgba(15, 23, 42, 0.85);     display: none;     align-items: center;     justify-content: center;     flex-direction: column;     gap: 14px;     text-align: center;   }   #overlay.show { display: flex; }   #overlay h2 { font-size: 32px; margin: 0; color: var(--food); }   button {     background: var(--accent);     border: none;     padding: 10px 22px;     font-size: 16px;     border-radius: 6px;     cursor: pointer;     font-weight: bold;     color: #0f172a;   }   button:hover { opacity: 0.85; }   #hint {     font-size: 13px;     color: #94a3b8;   }   .mobile-controls {     display: grid;     grid-template-columns: repeat(3, 56px);     grid-template-rows: repeat(2, 56px);     gap: 6px;     margin-top: 4px;   }   .mobile-controls button {     width: 56px;     height: 56px;     font-size: 20px;     padding: 0;   }   #up { grid-column: 2; grid-row: 1; }   #left { grid-column: 1; grid-row: 2; }   #down { grid-column: 2; grid-row: 2; }   #right { grid-column: 3; grid-row: 2; } </style> </head> <body>  <h1>SNAKE</h1> <div id="hud">   <div>Score: <span id="score">0</span></div>   <div>Best: <span id="best">0</span></div> </div> <canvas id="game" width="400" height="400"></canvas> <div id="hint">Use arrow keys / WASD to move &middot; Space to pause</div>  <div class="mobile-controls">   <button id="up">&uarr;</button>   <button id="left">&larr;</button>   <button id="down">&darr;</button>   <button id="right">&rarr;</button> </div>  <div id="overlay">   <h2 id="overlayTitle">Game Over</h2>   <div id="overlayScore"></div>   <button id="restartBtn">Play Again</button> </div>  <script> const canvas = document.getElementById('game'); const ctx = canvas.getContext('2d'); const scoreEl = document.getElementById('score'); const bestEl = document.getElementById('best'); const overlay = document.getElementById('overlay'); const overlayTitle = document.getElementById('overlayTitle'); const overlayScore = document.getElementById('overlayScore'); const restartBtn = document.getElementById('restartBtn');  const GRID = 20; const CELLS = canvas.width / GRID; let snake, dir, nextDir, food, score, best, gameOver, paused, speedMs, lastTime, acc;  best = 0;  function resetGame() {   snake = [     { x: 8, y: 10 },     { x: 7, y: 10 },     { x: 6, y: 10 }   ];   dir = { x: 1, y: 0 };   nextDir = { x: 1, y: 0 };   score = 0;   gameOver = false;   paused = false;   speedMs = 110;   acc = 0;   lastTime = null;   placeFood();   scoreEl.textContent = score;   overlay.classList.remove('show');   requestAnimationFrame(loop); }  function placeFood() {   let valid = false;   while (!valid) {     food = {       x: Math.floor(Math.random() * CELLS),       y: Math.floor(Math.random() * CELLS)     };     valid = !snake.some(s => s.x === food.x && s.y === food.y);   } }  function setDirection(x, y) {   /* prevent reversing directly into itself */   if (dir.x === -x && dir.y === -y) return;   nextDir = { x, y }; }  document.addEventListener('keydown', (e) => {   if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();   switch (e.key) {     case 'ArrowUp': case 'w': case 'W': setDirection(0, -1); break;     case 'ArrowDown': case 's': case 'S': setDirection(0, 1); break;     case 'ArrowLeft': case 'a': case 'A': setDirection(-1, 0); break;     case 'ArrowRight': case 'd': case 'D': setDirection(1, 0); break;     case ' ':       if (!gameOver) paused = !paused;       break;   } });  document.getElementById('up').addEventListener('click', () => setDirection(0, -1)); document.getElementById('down').addEventListener('click', () => setDirection(0, 1)); document.getElementById('left').addEventListener('click', () => setDirection(-1, 0)); document.getElementById('right').addEventListener('click', () => setDirection(1, 0));  restartBtn.addEventListener('click', resetGame);  function update() {   dir = nextDir;   const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };    /* wall collision */   if (head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS) {     return endGame();   }   /* self collision */   if (snake.some(s => s.x === head.x && s.y === head.y)) {     return endGame();   }    snake.unshift(head);    if (head.x === food.x && head.y === food.y) {     score += 10;     scoreEl.textContent = score;     if (speedMs > 55) speedMs -= 2;     placeFood();   } else {     snake.pop();   } }  function endGame() {   gameOver = true;   if (score > best) {     best = score;     bestEl.textContent = best;   }   overlayTitle.textContent = 'Game Over';   overlayScore.textContent = `Score: ${score}  •  Best: ${best}`;   overlay.classList.add('show'); }  function draw() {   ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--board');   ctx.fillRect(0, 0, canvas.width, canvas.height);    /* grid */   ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid');   ctx.lineWidth = 1;   for (let i = 0; i <= CELLS; i++) {     ctx.beginPath();     ctx.moveTo(i * GRID, 0);     ctx.lineTo(i * GRID, canvas.height);     ctx.stroke();     ctx.beginPath();     ctx.moveTo(0, i * GRID);     ctx.lineTo(canvas.width, i * GRID);     ctx.stroke();   }    /* food */   ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--food');   roundRect(food.x * GRID + 2, food.y * GRID + 2, GRID - 4, GRID - 4, 5);    /* snake */   snake.forEach((seg, i) => {     ctx.fillStyle = i === 0       ? getComputedStyle(document.documentElement).getPropertyValue('--snake-head')       : getComputedStyle(document.documentElement).getPropertyValue('--snake');     roundRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2, 4);   });    if (paused && !gameOver) {     ctx.fillStyle = 'rgba(15,23,42,0.6)';     ctx.fillRect(0, 0, canvas.width, canvas.height);     ctx.fillStyle = '#e2e8f0';     ctx.font = 'bold 28px sans-serif';     ctx.textAlign = 'center';     ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);   } }  function roundRect(x, y, w, h, r) {   ctx.beginPath();   ctx.moveTo(x + r, y);   ctx.arcTo(x + w, y, x + w, y + h, r);   ctx.arcTo(x + w, y + h, x, y + h, r);   ctx.arcTo(x, y + h, x, y, r);   ctx.arcTo(x, y, x + w, y, r);   ctx.closePath();   ctx.fill(); }  function loop(timestamp) {   if (gameOver) return;   if (lastTime === null) lastTime = timestamp;   const delta = timestamp - lastTime;   lastTime = timestamp;    if (!paused) {     acc += delta;     if (acc >= speedMs) {       acc = 0;       update();     }   }   draw();   if (!gameOver) requestAnimationFrame(loop); }  resetGame(); <<CLOSE_SCRIPT_TAG>>> </body> </html>

</script>

<!DOCTYPE html>

<body>
<div id="wrap">
  <h1>Knockout Arena</h1>
  <div id="hud">
    <div class="hud-panel left">
      <div class="name">Player 1</div>
      <div class="statrow">
        <div class="dmg" id="dmg1">0%</div>
        <div class="weapon" id="wpn1">PISTOL</div>
      </div>
      <div class="buffs" id="buffs1"></div>
      <div class="stocks" id="stocks1"></div>
    </div>
    <div class="hud-panel right">
      <div class="name">Player 2</div>
      <div class="statrow">
        <div class="dmg" id="dmg2">0%</div>
        <div class="weapon" id="wpn2">PISTOL</div>
      </div>
      <div class="buffs" id="buffs2"></div>
      <div class="stocks" id="stocks2"></div>
    </div>
  </div>

  <div id="arena-frame">
    <canvas id="game" width="900" height="500"></canvas>
    <div id="overlay">
      <h2 id="overlayText">Ready?</h2>
      <button id="overlayBtn">Start Match</button>
    </div>
  </div>

  <div id="controls">
    <div class="col"><b class="p1key">PLAYER 1</b><br>A / D move &nbsp; W jump &nbsp; <b class="p1key">E</b> shoot</div>
    <div class="col"><b class="p2key">PLAYER 2</b><br>&#8592; / &#8594; move &nbsp; &#8593; jump &nbsp; <b class="p2key">SPACE</b> shoot</div>
  </div>
  <div id="pickupHint">Two hearts each (grab an EXTRA LIFE crate for more). Damage % raises how far you fly when hit — get launched off the arena and you lose a heart. Grab crates for SHOTGUN, MACHINE GUN, ROCKET, LASER &amp; GRENADE, plus SPEED (2x pace, 45s), SHRINK (you go tiny &amp; untouchable for 45s, but can still shoot) and CLONE (a shooting ally NPC).</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---- Physics ----
const GRAVITY = 0.65;
const FRICTION = 0.87;
const MOVE_ACCEL = 1.6;
const MAX_SPEED = 10;
const JUMP_VEL = -14.5;
const PROJECTILE_SPEED = 13;
const STOCKS_START = 2; // exactly two hearts to start - you must be knocked off the arena to lose one

// Timed-effect durations (seconds -> frames @60fps)
const SPEED_DURATION = 45 * 60;
const SHRINK_DURATION = 45 * 60;
const CLONE_DURATION = 30 * 60;
const SHRINK_SCALE = 0.55;

// Platforms
const platforms = [
  { x: 150, y: 420, w: 600, h: 24 },
  { x: 60,  y: 300, w: 160, h: 18 },
  { x: 680, y: 300, w: 160, h: 18 },
  { x: 370, y: 190, w: 160, h: 18 },
];

// ---- Knockback curve ----
// Same solved quadratic as the original build: at 500% damage a full-power
// hit sends a target exactly half the arena width; at 850% it's a full
// arena-width launch. Individual weapons then scale that base power up or
// down via their own "kb" multiplier so each gun actually feels different.
const FRICTION_DECAY_TOTAL = 1 / (1 - FRICTION);
const HALF_MAP_DISTANCE = W / 2;
const FULL_MAP_DISTANCE = W;
const KB_BASE = 10;
const KB_F1 = 500, KB_F2 = 850;
const KB_P1 = HALF_MAP_DISTANCE / FRICTION_DECAY_TOTAL;
const KB_P2 = FULL_MAP_DISTANCE / FRICTION_DECAY_TOTAL;
const _y1 = KB_P1 - KB_BASE, _y2 = KB_P2 - KB_BASE;
const _det = KB_F1 * KB_F2 * (KB_F1 - KB_F2);
const KB_A = (_y1 * KB_F2 - _y2 * KB_F1) / _det;
const KB_B = (KB_F1 * KB_F1 * _y2 - KB_F2 * KB_F2 * _y1) / _det;
function knockbackPower(fragility){
  return KB_BASE + KB_A * fragility * fragility + KB_B * fragility;
}
const INSTA_KO_FRAGILITY = 850; // a hit landed at/above this % is a guaranteed KO

// ---- Weapons ----
// damage = % added to the target's fragility per hit (fuels the knockback curve above)
// kb     = multiplier on the knockback curve's power for THIS weapon specifically
const WEAPONS = {
  pistol:     { label:'PISTOL',      cooldown:40, damage:16, kb:1.0  },
  shotgun:    { label:'SHOTGUN',     cooldown:55, ammoAmount:6,  damage:9,  kb:0.6  }, // weak per pellet, brutal up close if several connect
  machinegun: { label:'MACHINE GUN', cooldown:8,  ammoAmount:30, damage:6,  kb:0.35 }, // chip damage, barely nudges - built for a rapid juggle
  rocket:     { label:'ROCKET',      cooldown:70, ammoAmount:3,  damage:26, kb:1.9, splash:75 }, // heavy hit + big blast radius
  laser:      { label:'LASER',       cooldown:90, ammoAmount:2,  damage:30, kb:0.3, pierce:true }, // huge damage, pierces both players, low knockback
  grenade:    { label:'GRENADE',     cooldown:80, ammoAmount:4,  damage:24, kb:1.7, splash:85 }, // bounces, arms, then a strong area launch
};
const WEAPON_KEYS = ['shotgun','machinegun','rocket','laser','grenade'];

// Non-weapon special pickups
const SPECIALS = {
  speed:     { label:'SPEED x2' },
  shrink:    { label:'SHRINK & DODGE' },
  clone:     { label:'CLONE ALLY' },
  extralife: { label:'EXTRA LIFE' },
};
const SPECIAL_KEYS = ['speed','shrink','clone','extralife'];
const PICKUP_KEYS = WEAPON_KEYS.concat(SPECIAL_KEYS);
const PICKUP_ICON = {
  shotgun:'SG', machinegun:'MG', rocket:'R', laser:'L', grenade:'GR',
  speed:'x2', shrink:'SHR', clone:'CLN', extralife:'+1'
};

function makePlayer(x, y, color, facing, keys){
  return {
    x, y, w: 34, h: 46,
    baseW: 34, baseH: 46,
    vx: 0, vy: 0,
    facing,
    color,
    fragility: 0,
    lastHitBy: null,
    stocks: STOCKS_START,
    onGround: false,
    shootCooldown: 0,
    weapon: 'pistol',
    ammo: Infinity,
    keys,
    alive: true,
    respawnTimer: 0,
    hitFlash: 0,
    spawnX: x, spawnY: y,
    speedTimer: 0,
    shrinkTimer: 0
  };
}

const player1 = makePlayer(220, 350, getComputedStyle(document.documentElement).getPropertyValue('--p1-color').trim(), 1,
  { left:'a', right:'d', up:'w', shoot:'e' });
const player2 = makePlayer(650, 350, getComputedStyle(document.documentElement).getPropertyValue('--p2-color').trim(), -1,
  { left:'ArrowLeft', right:'ArrowRight', up:'ArrowUp', shoot:' ' });

let projectiles = [];
let particles = [];
let powerups = [];
let clones = []; // NPC allies spawned by the CLONE pickup
let powerupTimer = randRange(600, 900);
let keysDown = {};
let running = false;
let gameOver = false;
let screenShake = 0;

function randRange(a,b){ return a + Math.random()*(b-a); }

function setShrink(p, on){
  // Resize the hitbox/sprite while keeping the player's feet planted in place.
  const bottom = p.y + p.h;
  const centerX = p.x + p.w/2;
  const scale = on ? SHRINK_SCALE : 1;
  p.w = p.baseW * scale;
  p.h = p.baseH * scale;
  p.x = centerX - p.w/2;
  p.y = bottom - p.h;
}

// ---- Input handling ----
window.addEventListener('keydown', (e) => {
  if(e.key === ' ') e.preventDefault();
  keysDown[e.key] = true;
  keysDown[e.key.toLowerCase()] = true;
  if(!running && !gameOver){
    startMatch();
  }
});
window.addEventListener('keyup', (e) => {
  keysDown[e.key] = false;
  keysDown[e.key.toLowerCase()] = false;
});
window.addEventListener('blur', () => {
  keysDown = {};
});

const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');
const overlayBtn = document.getElementById('overlayBtn');
overlayBtn.addEventListener('click', () => {
  if(gameOver){ resetGame(); }
  startMatch();
});

function startMatch(){
  overlay.classList.remove('show');
  running = true;
}

function resetGame(){
  Object.assign(player1, makePlayer(220, 350, player1.color, 1, player1.keys));
  Object.assign(player2, makePlayer(650, 350, player2.color, -1, player2.keys));
  projectiles = [];
  particles = [];
  powerups = [];
  clones = [];
  powerupTimer = randRange(600, 900);
  gameOver = false;
}

function isPressed(player, action){
  return !!keysDown[player.keys[action]];
}

function updatePlayer(p, other, dt){
  if(!p.alive){
    p.respawnTimer -= dt;
    if(p.respawnTimer <= 0 && p.stocks > 0){
      p.alive = true;
      p.x = p.spawnX; p.y = p.spawnY;
      p.vx = 0; p.vy = 0;
      p.fragility = 0;
      p.lastHitBy = null;
    }
    return;
  }

  // Timed effects
  if(p.speedTimer > 0){
    p.speedTimer -= dt;
    if(p.speedTimer <= 0) p.speedTimer = 0;
  }
  if(p.shrinkTimer > 0){
    p.shrinkTimer -= dt;
    if(p.shrinkTimer <= 0){
      p.shrinkTimer = 0;
      setShrink(p, false);
    }
  }
  const speedMult = p.speedTimer > 0 ? 2 : 1;
  const moveAccel = MOVE_ACCEL * speedMult;
  const maxSpeed = MAX_SPEED * speedMult;

  // Horizontal movement
  if(isPressed(p, 'left')){ p.vx -= moveAccel * dt; p.facing = -1; }
  if(isPressed(p, 'right')){ p.vx += moveAccel * dt; p.facing = 1; }
  p.vx *= Math.pow(FRICTION, dt);
  p.vx = Math.max(-maxSpeed, Math.min(maxSpeed, p.vx));

  // Jump
  if(isPressed(p, 'up') && p.onGround){
    p.vy = JUMP_VEL;
    p.onGround = false;
  }

  // Gravity
  p.vy += GRAVITY * dt;
  p.vy = Math.min(p.vy, 22);

  const prevBottom = p.y + p.h;
  p.x += p.vx * dt;
  p.y += p.vy * dt;

  // Platform collision
  p.onGround = false;
  for(const plat of platforms){
    const withinX = p.x + p.w > plat.x && p.x < plat.x + plat.w;
    const currBottom = p.y + p.h;
    if(withinX && p.vy >= 0 && prevBottom <= plat.y + 2 && currBottom >= plat.y){
      p.y = plat.y - p.h;
      p.vy = 0;
      p.onGround = true;
    }
  }

  // Shooting
  if(p.shootCooldown > 0) p.shootCooldown -= dt;
  if(isPressed(p, 'shoot') && p.shootCooldown <= 0){
    const usedWeapon = p.weapon;
    fireWeapon(p);
    p.shootCooldown = WEAPONS[usedWeapon].cooldown;
  }

  if(p.hitFlash > 0) p.hitFlash -= dt;

  // Blast zones - this is the ONLY way to lose a heart: getting knocked
  // (or walking/jumping) out of the arena bounds.
  if(p.x < -80 || p.x > W + 80 || p.y > H + 100 || p.y < -150){
    knockOut(p, p.lastHitBy);
  }
}

function knockOut(p, killer){
  if(!p.alive) return;
  p.alive = false;
  p.stocks--;
  p.respawnTimer = 60;
  if(killer){
    // small comeback mechanic: landing the KO trims some of your own damage
    killer.fragility = Math.max(0, killer.fragility * 0.5);
  }
  if(p.stocks <= 0){
    endGame(p);
  }
}

function applyHit(target, shooter, damage, kbMult){
  target.fragility = Math.min(999, target.fragility + damage);
  target.lastHitBy = shooter;
  target.hitFlash = 18;

  const power = knockbackPower(target.fragility) * kbMult;
  target.vx += shooter.facing * power;
  target.vy -= power * 0.16; // a bit of lift so knockback arcs instead of sliding flat
  screenShake = Math.min(30, 6 + power * 0.6);

  if(target.fragility >= INSTA_KO_FRAGILITY){
    knockOut(target, shooter);
  }
}

function endGame(loser){
  gameOver = true;
  running = false;
  const winner = loser === player1 ? player2 : player1;
  const winnerName = winner === player1 ? 'Player 1' : 'Player 2';
  overlayText.textContent = winnerName + ' Wins!';
  overlayBtn.textContent = 'Play Again';
  overlay.classList.add('show');
}

function rectsOverlap(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ---- Weapon firing ----
function spawnProjectile(p, opts){
  projectiles.push(Object.assign({
    x: p.x + (p.facing === 1 ? p.w : -8),
    y: p.y + p.h/2 - 3,
    vx: 0, vy: 0,
    owner: p,
    color: p.color,
    w: 10, h: 6,
    gravity: false,
    bounce: 0,
    life: 600,
    pierce: false,
    splash: 0,
    damage: 16,
    kb: 1,
    hitPlayers: new Set()
  }, opts));
}

function fireWeapon(p){
  const f = p.facing;
  const w = WEAPONS[p.weapon];
  switch(p.weapon){
    case 'pistol':
      spawnProjectile(p, { vx: PROJECTILE_SPEED*f, vy:0, w:10, h:6, damage:w.damage, kb:w.kb });
      break;
    case 'machinegun':
      spawnProjectile(p, { vx: PROJECTILE_SPEED*1.3*f, vy:(Math.random()-0.5)*2, w:8, h:4, damage:w.damage, kb:w.kb });
      break;
    case 'shotgun':
      for(let i=0;i<6;i++){
        spawnProjectile(p, { vx: PROJECTILE_SPEED*0.9*f, vy:(Math.random()-0.5)*6, w:8, h:4, life:120, damage:w.damage, kb:w.kb });
      }
      break;
    case 'rocket':
      spawnProjectile(p, { vx: PROJECTILE_SPEED*0.55*f, vy:0, w:18, h:9, splash:w.splash, damage:w.damage, kb:w.kb });
      break;
    case 'laser':
      spawnProjectile(p, { vx: PROJECTILE_SPEED*3*f, vy:0, w:28, h:4, pierce:true, life:40, damage:w.damage, kb:w.kb });
      break;
    case 'grenade':
      spawnProjectile(p, { vx: PROJECTILE_SPEED*0.45*f, vy:-6, gravity:true, bounce:2, fuse:70, w:12, h:12, splash:w.splash, damage:w.damage, kb:w.kb });
      break;
  }
  if(p.ammo !== Infinity){
    p.ammo--;
    if(p.ammo <= 0){
      p.weapon = 'pistol';
      p.ammo = Infinity;
    }
  }
}

function explode(pr){
  const cx = pr.x + pr.w/2, cy = pr.y + pr.h/2;
  const targets = [player1, player2].filter(pl => pl.alive && pl !== pr.owner && !(pl.shrinkTimer > 0 && pr.owner.shrinkTimer <= 0));
  for(const t of targets){
    const tx = t.x + t.w/2, ty = t.y + t.h/2;
    const dist = Math.hypot(tx-cx, ty-cy);
    if(dist <= pr.splash){
      const falloff = 1 - (dist / pr.splash) * 0.4; // slightly weaker at the edge of the blast
      applyHit(t, pr.owner, pr.damage * falloff, pr.kb * falloff);
    }
  }
  spawnExplosionParticles(cx, cy);
  screenShake = Math.min(30, screenShake + 16);
}

function updateProjectiles(dt){
  for(let i = projectiles.length - 1; i >= 0; i--){
    const pr = projectiles[i];
    if(pr.gravity){ pr.vy += GRAVITY * dt * 0.6; }
    const prevBottom = pr.y + pr.h;
    pr.x += pr.vx * dt;
    pr.y += pr.vy * dt;

    let removed = false;

    // Rockets/grenades interact with platforms; bullets pass through.
    if(pr.splash){
      for(const plat of platforms){
        const withinX = pr.x + pr.w > plat.x && pr.x < plat.x + plat.w;
        const currBottom = pr.y + pr.h;
        if(withinX && pr.vy >= 0 && prevBottom <= plat.y + 2 && currBottom >= plat.y){
          if(pr.bounce && pr.bounce > 0){
            pr.y = plat.y - pr.h;
            pr.vy = -pr.vy * 0.55;
            pr.bounce--;
          } else {
            explode(pr);
            projectiles.splice(i,1);
            removed = true;
          }
          break;
        }
      }
    }
    if(removed) continue;

    if(pr.fuse !== undefined){
      pr.fuse -= dt;
      if(pr.fuse <= 0){
        explode(pr);
        projectiles.splice(i,1);
        continue;
      }
    }

    const targets = [player1, player2].filter(pl => pl !== pr.owner && pl.alive && !(pl.shrinkTimer > 0 && pr.owner.shrinkTimer <= 0));
    let consumed = false;
    for(const t of targets){
      if(pr.pierce && pr.hitPlayers.has(t)) continue;
      if(rectsOverlap(pr, t)){
        if(pr.splash){
          explode(pr);
          consumed = true;
        } else {
          applyHit(t, pr.owner, pr.damage, pr.kb);
          if(pr.pierce){ pr.hitPlayers.add(t); }
          else { consumed = true; }
        }
        if(!pr.pierce) break;
      }
    }
    if(consumed){
      projectiles.splice(i,1);
      continue;
    }

    pr.life -= dt;
    if(pr.life <= 0 || pr.x < -40 || pr.x > W+40 || pr.y < -40 || pr.y > H+40){
      projectiles.splice(i,1);
    }
  }
}

// ---- Powerups ----
function spawnPowerup(){
  const plat = platforms[Math.floor(Math.random()*platforms.length)];
  const type = PICKUP_KEYS[Math.floor(Math.random()*PICKUP_KEYS.length)];
  powerups.push({
    x: plat.x + Math.random()*(plat.w-24),
    y: plat.y - 30,
    w: 24, h: 24,
    type,
    bob: Math.random()*10
  });
}

function applySpecialPickup(p, other, type){
  switch(type){
    case 'speed':
      p.speedTimer = SPEED_DURATION;
      break;
    case 'shrink':
      // Shrinks YOU for 45 seconds - while tiny you can't be shot, but you can still shoot back.
      p.shrinkTimer = SHRINK_DURATION;
      setShrink(p, true);
      break;
    case 'clone':
      spawnClone(p, other);
      break;
    case 'extralife':
      p.stocks++;
      break;
  }
}

function spawnClone(owner, target){
  clones.push({
    owner, target,
    x: owner.x + (owner.facing === 1 ? -60 : 60),
    y: owner.y,
    w: 26, h: 36,
    color: owner.color,
    facing: owner.facing,
    timer: CLONE_DURATION,
    shootCooldown: 30
  });
}

function updatePowerups(dt){
  powerupTimer -= dt;
  if(powerupTimer <= 0 && powerups.length < 2){
    spawnPowerup();
    powerupTimer = randRange(600, 900);
  }
  for(let i = powerups.length - 1; i >= 0; i--){
    const pu = powerups[i];
    pu.bob += dt * 0.05;
    for(const p of [player1, player2]){
      if(p.alive && rectsOverlap(p, pu)){
        const other = p === player1 ? player2 : player1;
        if(WEAPONS[pu.type]){
          p.weapon = pu.type;
          p.ammo = WEAPONS[pu.type].ammoAmount;
        } else {
          applySpecialPickup(p, other, pu.type);
        }
        powerups.splice(i,1);
        break;
      }
    }
  }
}

// ---- Clones (NPC allies that auto-fire at the opponent) ----
function updateClones(dt){
  for(let i = clones.length - 1; i >= 0; i--){
    const c = clones[i];
    c.timer -= dt;
    if(c.timer <= 0 || !c.owner || c.owner.stocks <= 0){
      clones.splice(i,1);
      continue;
    }
    // hover near its owner
    const desiredX = c.owner.x + (c.owner.facing === 1 ? -60 : 60);
    c.x += (desiredX - c.x) * 0.05 * dt;
    c.y += (c.owner.y - c.y) * 0.08 * dt;

    if(c.target && c.target.alive){
      c.facing = (c.target.x + c.target.w/2 < c.x + c.w/2) ? -1 : 1;
      c.shootCooldown -= dt;
      if(c.shootCooldown <= 0){
        spawnProjectile({ x:c.x, y:c.y, w:c.w, h:c.h, facing:c.facing, color:c.color },
          { vx: PROJECTILE_SPEED*c.facing, vy:0, w:10, h:6, damage:10, kb:0.7, owner:c.owner });
        c.shootCooldown = 45;
      }
    }
  }
}

function drawClones(){
  for(const c of clones){
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.translate(c.x + c.w/2, c.y + c.h/2);
    ctx.shadowColor = c.color;
    ctx.shadowBlur = 10;
    ctx.strokeStyle = c.color;
    ctx.lineWidth = 2;
    ctx.setLineDash([4,3]);
    ctx.strokeRect(-c.w/2, -c.h/2, c.w, c.h);
    ctx.fillStyle = c.color;
    ctx.globalAlpha = 0.25;
    ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
    ctx.restore();
  }
}

// ---- Particles (explosion bits) ----
function spawnExplosionParticles(x,y){
  for(let i=0;i<16;i++){
    particles.push({
      x, y,
      vx:(Math.random()-0.5)*10,
      vy:(Math.random()-0.5)*10,
      life: 30 + Math.random()*10,
      color: Math.random() > 0.5 ? '#ffb84d' : '#ff6b3d'
    });
  }
}
function updateParticles(dt){
  for(let i = particles.length - 1; i >= 0; i--){
    const pt = particles[i];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt;
    if(pt.life <= 0) particles.splice(i,1);
  }
}
function drawParticles(){
  for(const pt of particles){
    ctx.globalAlpha = Math.max(0, pt.life/40);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x-2, pt.y-2, 4, 4);
  }
  ctx.globalAlpha = 1;
}

// ---- Rendering ----
function drawBackground(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.strokeStyle = 'rgba(62,230,212,0.04)';
  ctx.lineWidth = 1;
  for(let x = 0; x < W; x += 40){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  for(let y = 0; y < H; y += 40){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  ctx.restore();
}

function drawPlatforms(){
  for(const plat of platforms){
    ctx.fillStyle = '#2a3550';
    ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
    ctx.fillStyle = '#4a5a80';
    ctx.fillRect(plat.x, plat.y, plat.w, 4);
  }
}

function drawPlayer(p){
  if(!p.alive) return;
  ctx.save();
  ctx.translate(p.x + p.w/2, p.y + p.h/2);

  ctx.shadowColor = p.color;
  ctx.shadowBlur = p.hitFlash > 0 ? 25 : 12;

  ctx.fillStyle = p.hitFlash > 0 ? '#ffffff' : p.color;
  ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);

  ctx.shadowBlur = 0;
  ctx.fillStyle = '#0a0e14';
  const fx = p.facing === 1 ? p.w/2 - p.w*0.3 : -p.w/2;
  ctx.fillRect(fx, -p.h/2 + p.h*0.17, p.w*0.3, p.h*0.17);

  ctx.restore();

  // weapon badge above head when carrying a pickup
  if(p.weapon !== 'pistol'){
    ctx.save();
    ctx.fillStyle = '#ffd76b';
    ctx.font = 'bold 11px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(WEAPONS[p.weapon].label[0], p.x + p.w/2, p.y - 16);
    ctx.restore();
  }

  // speed / shrink status rings
  if(p.speedTimer > 0 || p.shrinkTimer > 0){
    ctx.save();
    ctx.strokeStyle = p.speedTimer > 0 ? '#7ee6ff' : '#c17bff';
    ctx.lineWidth = 2;
    ctx.setLineDash([5,4]);
    ctx.beginPath();
    ctx.arc(p.x + p.w/2, p.y + p.h/2, Math.max(p.w,p.h)*0.75, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  // fragility danger ring - the higher it climbs, the closer to a KO
  if(p.fragility > 100){
    ctx.save();
    const t = Math.min(1, (p.fragility - 100) / (INSTA_KO_FRAGILITY - 100));
    ctx.strokeStyle = `rgba(255,${Math.round(184 - 130*t)},77,${0.5 + 0.4*t})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x + p.w/2, p.y + p.h/2, p.w, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawProjectiles(){
  for(const pr of projectiles){
    ctx.save();
    ctx.shadowColor = pr.color;
    ctx.shadowBlur = pr.splash ? 16 : 10;
    ctx.fillStyle = pr.color;
    ctx.fillRect(pr.x, pr.y, pr.w, pr.h);
    ctx.restore();
  }
}

function drawPowerups(){
  for(const pu of powerups){
    const bobY = Math.sin(pu.bob) * 4;
    ctx.save();
    ctx.translate(pu.x + pu.w/2, pu.y + pu.h/2 + bobY);
    ctx.shadowColor = '#ffd76b';
    ctx.shadowBlur = 14;
    ctx.fillStyle = 'rgba(20,26,40,0.9)';
    ctx.fillRect(-pu.w/2, -pu.h/2, pu.w, pu.h);
    ctx.strokeStyle = '#ffd76b';
    ctx.lineWidth = 2;
    ctx.strokeRect(-pu.w/2, -pu.h/2, pu.w, pu.h);
    ctx.fillStyle = '#ffd76b';
    ctx.font = 'bold 10px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(PICKUP_ICON[pu.type], 0, 1);
    ctx.restore();
  }
}

function weaponLabel(p){
  if(p.weapon === 'pistol') return 'PISTOL';
  return WEAPONS[p.weapon].label + ' \u00D7' + p.ammo;
}

function buffLabel(p){
  const parts = [];
  if(p.speedTimer > 0) parts.push('SPEED ' + Math.ceil(p.speedTimer/60) + 's');
  if(p.shrinkTimer > 0) parts.push('TINY \u00B7 SAFE ' + Math.ceil(p.shrinkTimer/60) + 's');
  return parts.join(' \u00B7 ');
}

function updateHUD(){
  document.getElementById('dmg1').textContent = Math.floor(player1.fragility) + '%';
  document.getElementById('dmg2').textContent = Math.floor(player2.fragility) + '%';
  document.getElementById('dmg1').style.color = player1.fragility > 100 ? 'var(--warn)' : 'var(--p1-color)';
  document.getElementById('dmg2').style.color = player2.fragility > 100 ? 'var(--warn)' : 'var(--p2-color)';
  document.getElementById('wpn1').textContent = weaponLabel(player1);
  document.getElementById('wpn2').textContent = weaponLabel(player2);
  document.getElementById('buffs1').textContent = buffLabel(player1);
  document.getElementById('buffs2').textContent = buffLabel(player2);

  const heartSVG = '<svg class="heart" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 21s-7.5-4.6-10-9.2C0.3 8.6 1.8 5 5.4 5c2 0 3.4 1 4.6 2.6C11.2 6 12.6 5 14.6 5 18.2 5 19.7 8.6 22 11.8 19.5 16.4 12 21 12 21z"/></svg>';
  document.getElementById('stocks1').innerHTML = heartSVG.repeat(player1.stocks);
  document.getElementById('stocks2').innerHTML = heartSVG.repeat(player2.stocks);
}

let lastTime = null;

function loop(timestamp){
  if(lastTime === null) lastTime = timestamp;
  let dt = (timestamp - lastTime) / (1000 / 60);
  lastTime = timestamp;
  dt = Math.max(0, Math.min(dt, 2.5));

  if(running){
    updatePlayer(player1, player2, dt);
    updatePlayer(player2, player1, dt);
    updateProjectiles(dt);
    updatePowerups(dt);
    updateClones(dt);
    updateParticles(dt);
  }

  ctx.save();
  if(screenShake > 0.3){
    const dx = (Math.random()-0.5) * screenShake;
    const dy = (Math.random()-0.5) * screenShake;
    ctx.translate(dx, dy);
    screenShake *= Math.pow(0.85, dt);
  } else {
    screenShake = 0;
  }

  drawBackground();
  drawPlatforms();
  drawPowerups();
  drawProjectiles();
  drawParticles();
  drawClones();
  drawPlayer(player1);
  drawPlayer(player2);
  ctx.restore();
  updateHUD();

  requestAnimationFrame(loop);
}

overlayText.textContent = 'Knockout Arena';
overlayBtn.textContent = 'Start Match';
overlay.classList.add('show');
requestAnimationFrame(loop);

    text-transform:uppercase;
  }
  #table{
    position:relative;
    width:760px; min-height:460px;

      radial-gradient(ellipse at 50% 15%, var(--felt-edge) 0%, var(--felt) 65%);
    border:10px solid #3a2417;
    border-radius:200px / 60px;
    box-shadow: 0 0 0 2px #1a0f08, 0 20px 60px rgba(0,0,0,0.6), inset 0 0 80px rgba(0,0,0,0.35);
    display:flex; flex-direction:column; justify-content:space-between;
    padding:26px 30px 34px;
  }
  .zone{ display:flex; flex-direction:column; align-items:center; gap:8px; min-height:130px; justify-content:center; }
  .zone-label{
    font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--gold);
    opacity:0.85; display:flex; gap:10px; align-items:center;
  }
  .hand-total{
    font-size:13px; font-weight:800; color:#fff; background:rgba(0,0,0,0.35);
    padding:2px 10px; border-radius:10px; letter-spacing:1px;
  }
  .cards{ display:flex; min-height:96px; align-items:center; }
  .card{
    width:64px; height:92px; margin-left:-24px;
    background:#fff; border-radius:8px;

<script>
// ---- Unicode playing card glyphs ----
// Suit bases: Spades 0x1F0A0, Hearts 0x1F0B0, Diamonds 0x1F0C0, Clubs 0x1F0D0
// Rank positions within suit: A=1, 2-10=2-10, J=11, (12 = Knight, skipped), Q=13, K=14
const SUITS = [
  { name:'spades',   base:0x1F0A0, color:'black', symbol:'\u2660' },
  { name:'hearts',   base:0x1F0B0, color:'red',   symbol:'\u2665' },
  { name:'diamonds', base:0x1F0C0, color:'red',   symbol:'\u2666' },
  { name:'clubs',    base:0x1F0D0, color:'black', symbol:'\u2663' },
];
const RANKS = [
  { label:'A', pos:1,  value:11 },
  { label:'2', pos:2,  value:2 },
  { label:'3', pos:3,  value:3 },
  { label:'4', pos:4,  value:4 },
  { label:'5', pos:5,  value:5 },
  { label:'6', pos:6,  value:6 },
  { label:'7', pos:7,  value:7 },
  { label:'8', pos:8,  value:8 },
  { label:'9', pos:9,  value:9 },
  { label:'10',pos:10, value:10 },
  { label:'J', pos:11, value:10 },
  { label:'Q', pos:13, value:10 },
  { label:'K', pos:14, value:10 },
];
const BACK_CHAR = String.fromCodePoint(0x1F0A0);

function cardChar(suit, rank){
  return String.fromCodePoint(suit.base + rank.pos);
}

function buildDeck(){
  const deck = [];
  for(const suit of SUITS){
    for(const rank of RANKS){
      deck.push({ suit, rank, char: cardChar(suit, rank) });
    }
  }
  return deck;
}
function shuffle(deck){
  for(let i=deck.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]] = [deck[j],deck[i]];
  }
  return deck;
}

let shoe = shuffle(buildDeck());
function drawCard(){
  if(shoe.length < 8){ shoe = shuffle(buildDeck()); }
  return shoe.pop();
}

// ---- Game state ----
let bankroll = 1000;
let bet = 0;
let playerHand = [];
let dealerHand = [];
let state = 'betting'; // betting -> playing -> dealer -> result
let doubled = false;

const bankrollEl = document.getElementById('bankroll');
const currentBetEl = document.getElementById('currentBet');
const betDisplayEl = document.getElementById('betDisplay');
const dealerCardsEl = document.getElementById('dealerCards');
const playerCardsEl = document.getElementById('playerCards');
const dealerTotalEl = document.getElementById('dealerTotal');
const playerTotalEl = document.getElementById('playerTotal');
const centerMsg = document.getElementById('center-msg');

const dealBtn = document.getElementById('dealBtn');
const clearBetBtn = document.getElementById('clearBetBtn');
const hitBtn = document.getElementById('hitBtn');
const standBtn = document.getElementById('standBtn');
const doubleBtn = document.getElementById('doubleBtn');
const nextHandBtn = document.getElementById('nextHandBtn');
const betButtonsRow = document.getElementById('betButtons');
const chipRow = document.getElementById('chipRow');
const playButtons = document.getElementById('playButtons');
const nextButtons = document.getElementById('nextButtons');

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    if(state !== 'betting') return;
    const v = Number(chip.dataset.v);
    if(bet + v > bankroll) return;
    bet += v;
    updateBetUI();
  });
});
clearBetBtn.addEventListener('click', () => {
  if(state !== 'betting') return;
  bet = 0;
  updateBetUI();
});
dealBtn.addEventListener('click', dealHand);
hitBtn.addEventListener('click', playerHit);
standBtn.addEventListener('click', playerStand);
doubleBtn.addEventListener('click', playerDouble);
nextHandBtn.addEventListener('click', startNewRound);

function updateBetUI(){
  currentBetEl.textContent = bet;
  betDisplayEl.textContent = 'Bet: $' + bet;
  dealBtn.disabled = bet <= 0 || bet > bankroll;
}

function handValue(hand){
  let total = 0, aces = 0;
  for(const c of hand){
    total += c.rank.value;
    if(c.rank.label === 'A') aces++;
  }
  while(total > 21 && aces > 0){
    total -= 10;
    aces--;
  }
  return total;
}
function isBlackjack(hand){
  return hand.length === 2 && handValue(hand) === 21;
}

function renderCard(container, card, faceDown){
  const div = document.createElement('div');
  div.className = 'card ' + (faceDown ? 'back' : card.suit.color);
  div.textContent = faceDown ? BACK_CHAR : card.char;
  container.appendChild(div);
}

function renderHands(revealDealer){
  dealerCardsEl.innerHTML = '';
  playerCardsEl.innerHTML = '';
  dealerHand.forEach((c, i) => {
    renderCard(dealerCardsEl, c, i === 1 && !revealDealer);
  });
  playerHand.forEach(c => renderCard(playerCardsEl, c, false));

  playerTotalEl.textContent = handValue(playerHand);
  if(revealDealer || state === 'betting'){
    dealerTotalEl.textContent = dealerHand.length ? handValue(dealerHand) : '';
  } else {
    dealerTotalEl.textContent = dealerHand.length ? (dealerHand[0].rank.value === 11 ? 11 : dealerHand[0].rank.value) + ' + ?' : '';
  }
}

function updateBankrollUI(){
  bankrollEl.textContent = bankroll;
}

function setPhase(newState){
  state = newState;
  betButtonsRow.style.display = newState === 'betting' ? 'flex' : 'none';
  chipRow.style.display = newState === 'betting' ? 'flex' : 'none';
  playButtons.style.display = newState === 'playing' ? 'flex' : 'none';
  nextButtons.style.display = newState === 'result' ? 'flex' : 'none';
}

function dealHand(){
  if(bet <= 0 || bet > bankroll) return;
  bankroll -= bet;
  updateBankrollUI();
  doubled = false;

  playerHand = [drawCard(), drawCard()];
  dealerHand = [drawCard(), drawCard()];

  setPhase('playing');
  renderHands(false);
  centerMsg.textContent = '';

  const playerBJ = isBlackjack(playerHand);
  const dealerBJ = isBlackjack(dealerHand);

  if(playerBJ || dealerBJ){
    finishRound();
    return;
  }

  doubleBtn.disabled = bankroll < bet;
}

function playerHit(){
  if(state !== 'playing') return;
  playerHand.push(drawCard());
  renderHands(false);
  if(handValue(playerHand) >= 21){
    playerStand();
  }
}

function playerDouble(){
  if(state !== 'playing' || bankroll < bet) return;
  bankroll -= bet;
  doubled = true;
  bet *= 2;
  updateBankrollUI();
  updateBetUI();
  playerHand.push(drawCard());
  renderHands(false);
  if(handValue(playerHand) > 21){
    finishRound();
  } else {
    playerStand();
  }
}

function playerStand(){
  if(state !== 'playing') return;
  setPhase('dealer');
  renderHands(true);
  dealerPlay();
}

function dealerPlay(){
  const playerTotal = handValue(playerHand);
  if(playerTotal > 21){
    finishRound();
    return;
  }
  const step = () => {
    const total = handValue(dealerHand);
    if(total < 17){
      dealerHand.push(drawCard());
      renderHands(true);
      setTimeout(step, 500);
    } else {
      finishRound();
    }
  };
  setTimeout(step, 500);
}

function finishRound(){
  setPhase('result');
  renderHands(true);

  const playerTotal = handValue(playerHand);
  const dealerTotal = handValue(dealerHand);
  const playerBJ = isBlackjack(playerHand);
  const dealerBJ = isBlackjack(dealerHand);

  let msg = '';
  let payout = 0;

  if(playerTotal > 21){
    msg = 'Bust! You lose $' + bet;
    payout = 0;
  } else if(playerBJ && dealerBJ){
    msg = 'Both Blackjack — Push';
    payout = bet;
  } else if(playerBJ){
    msg = 'Blackjack! You win $' + Math.floor(bet*1.5);
    payout = bet + Math.floor(bet*1.5);
  } else if(dealerBJ){
    msg = 'Dealer Blackjack — You lose $' + bet;
    payout = 0;
  } else if(dealerTotal > 21){
    msg = 'Dealer busts! You win $' + bet;
    payout = bet*2;
  } else if(playerTotal > dealerTotal){
    msg = 'You win $' + bet + '!';
    payout = bet*2;
  } else if(playerTotal < dealerTotal){
    msg = 'Dealer wins. You lose $' + bet;
    payout = 0;
  } else {
    msg = 'Push — bet returned';
    payout = bet;
  }

  bankroll += payout;
  updateBankrollUI();
  centerMsg.textContent = msg;

  if(bankroll <= 0){
    nextHandBtn.style.display = 'none';
    document.getElementById('bustOverlay').classList.add('show');
  }
}

document.getElementById('retryBtn').addEventListener('click', () => {
  bankroll = 1000;
  updateBankrollUI();
  nextHandBtn.style.display = '';
  document.getElementById('bustOverlay').classList.remove('show');
  startNewRound();
});

function startNewRound(){
  bet = 0;
  playerHand = [];
  dealerHand = [];
  updateBetUI();
  setPhase('betting');
  dealerCardsEl.innerHTML = '';
  playerCardsEl.innerHTML = '';
  dealerTotalEl.textContent = '';
  playerTotalEl.textContent = '';
  centerMsg.textContent = 'Place your bet to begin';
}

updateBankrollUI();
updateBetUI();
setPhase('betting');

  crabB:[
    "00011000","10111101","11111111","11011011",
    "11111111","00100100","01000010","00100100"
  ],
  octoA:[
    "00111100","01111110","11111111","11100111",
    "11111111","00011000","00100100","01000010"
  ],
  octoB:[
    "00111100","01111110","11111111","11100111",
    "11111111","00111100","01000010","10000001"
  ]
};

function drawSprite(pattern, x, y, size, color, glow){
  ctx.fillStyle = color;
  if(glow){ ctx.shadowColor = color; ctx.shadowBlur = 8; } else { ctx.shadowBlur = 0; }
  const px = size/8;
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      if(pattern[r][c]==='1'){
        ctx.fillRect(x + c*px, y + r*px, px+0.5, px+0.5);
      }
    }
  }
  ctx.shadowBlur = 0;
}

// ---------- Game state ----------
let state = 'start'; // start | playing | paused | levelcomplete | gameover | win
let score = 0, high = 0, level = 1, lives = 3;
let animTimer = 0, animFrame = 0;
let lastTime = 0;
let flashTimer = 0, flashText = '';
let shakeTime = 0, shakeMag = 0;

const player = {
  w:34, h:18, x: W/2-17, y: H-50, speed:320, cooldown:0, alive:true, blinkTimer:0
};

let bullets = []; // player bullets {x,y,w,h,vy}
let enemyBullets = []; // {x,y,w,h,vy,color}
let particles = []; // explosion particles
let enemies = [];
let shields = [];
let enemyDir = 1;
let enemyStepTimer = 0;
let enemyMoveInterval = 0.8;
let enemyShootTimer = 0;
let enemyShootInterval = 1.2;
let dropFlag = false;

const keys = {};

// ---------- Level configuration ----------
function levelConfig(lv){
  const rows = Math.min(3 + Math.floor((lv-1)/3), 6);
  const cols = Math.min(6 + Math.floor((lv-1)/2), 11);
  const baseInterval = Math.max(0.9 - lv*0.045, 0.14); // time between formation steps (lower = faster)
  const shootInterval = Math.max(1.3 - lv*0.07, 0.22);
  const bulletSpeed = 140 + lv*14;
  const toughRows = lv >= 11 ? 2 : (lv >= 6 ? 1 : 0); // number of top rows that are tougher
  const toughHP = lv >= 11 ? 3 : 2;
  const dropAmount = 14 + Math.min(lv, 10);
  return {rows, cols, baseInterval, shootInterval, bulletSpeed, toughRows, toughHP, dropAmount};
}

function makeShield(x, y){
  // small destructible block grid, 8x5
  const grid = [];
  const pattern = [
    "00111100",
    "01111110",
    "11111111",
    "11111111",
    "11000011"
  ];
  for(let r=0;r<5;r++){
    grid.push([]);
    for(let c=0;c<8;c++){
      grid[r].push(pattern[r][c]==='1' ? 3 : 0); // hp 3 or empty
    }
  }
  return {x,y,grid,blockSize:6};
}

function initShields(){
  shields = [];
  const count = 4;
  const gap = W/(count+1);
  for(let i=1;i<=count;i++){
    shields.push(makeShield(gap*i - 24, H-140));
  }
}

function initLevel(lv){
  const cfg = levelConfig(lv);
  enemies = [];
  const startX = (W - (cfg.cols-1)*48 - 32)/2;
  const startY = 70;
  for(let r=0;r<cfg.rows;r++){
    for(let c=0;c<cfg.cols;c++){
      let hp = 1, type;
      if(r < cfg.toughRows){ hp = cfg.toughHP; type='octo'; }
      else if(r < cfg.toughRows+2){ type='crab'; }
      else { type='squid'; }
      enemies.push({
        x:startX + c*48, y:startY + r*38,
        w:28,h:22, alive:true, type, hp, maxHp:hp,
        points: type==='octo'?30:(type==='crab'?20:10)
      });
    }
  }
  enemyDir = 1;
  enemyMoveInterval = cfg.baseInterval;
  enemyShootInterval = cfg.shootInterval;
  enemyStepTimer = 0;
  enemyShootTimer = 0;
  bullets = [];
  enemyBullets = [];
  particles = [];
  dropFlag = false;
  initShields();
  player.x = W/2-17;
  player.alive = true;
  player.cooldown = 0;
  hudLevel.textContent = lv;
}

function resetGame(){
  score = 0; level = 1; lives = 3;
  updateHud();
  initLevel(level);
}

function updateHud(){
  hudScore.textContent = String(score).padStart(4,'0');
  hudHigh.textContent = String(Math.max(high,score)).padStart(4,'0');
  hudLevel.textContent = level;
  livesEl.innerHTML = '';
  for(let i=0;i<lives;i++){
    const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 14 10');
    s.setAttribute('class','life-icon');
    s.innerHTML = `<polygon points="7,0 10,6 14,6 8,6 8,10 6,10 6,6 0,6 4,6" fill="${COLORS.cyan}"/>`;
    livesEl.appendChild(s);
  }
}

// ---------- Input ----------
window.addEventListener('keydown', e=>{
  keys[e.code]=true;
  if(e.code==='Space') e.preventDefault();
  if(e.code==='Enter'){
    if(state==='start'||state==='gameover'||state==='win') beginGame();
  }
  if(e.code==='KeyP'){
    togglePause();
  }
});
window.addEventListener('keyup', e=>{ keys[e.code]=false; });

startBtn.addEventListener('click', beginGame);

function togglePause(){
  if(state==='playing'){ state='paused'; showOverlay('PAUSED','', 'Press P or tap to resume', 'RESUME'); }
  else if(state==='paused'){ state='playing'; overlay.classList.add('hidden'); }
}

function beginGame(){
  overlay.classList.add('hidden');
  resetGame();
  state='playing';
}

// touch controls
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
const fireBtn = document.getElementById('fireBtn');
function bindTouch(el, code){
  el.addEventListener('touchstart', e=>{e.preventDefault(); keys[code]=true;}, {passive:false});
  el.addEventListener('touchend', e=>{e.preventDefault(); keys[code]=false;}, {passive:false});
  el.addEventListener('mousedown', ()=>keys[code]=true);
  el.addEventListener('mouseup', ()=>keys[code]=false);
  el.addEventListener('mouseleave', ()=>keys[code]=false);
}
bindTouch(btnLeft,'ArrowLeft');
bindTouch(btnRight,'ArrowRight');
bindTouch(fireBtn,'Space');

// ---------- Overlay helper ----------
function showOverlay(title, subtitle, desc, btnText){
  overlay.innerHTML = `
    <h1>${title}</h1>
    ${subtitle?`<h2>${subtitle}</h2>`:''}
    <p>${desc}</p>
    <button class="btn" id="dynBtn">${btnText}</button>
  `;
  overlay.classList.remove('hidden');
  document.getElementById('dynBtn').addEventListener('click', ()=>{
    if(state==='paused'){ state='playing'; overlay.classList.add('hidden'); }
    else if(state==='levelcomplete'){ nextLevel(); }
    else if(state==='gameover' || state==='win'){ beginGame(); }
  });
}

// ---------- Core mechanics ----------
function spawnParticles(x,y,color,count){
  for(let i=0;i<count;i++){
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*160,
      vy:(Math.random()-0.5)*160,
      life:0.5+Math.random()*0.3,
      color
    });
  }
}

function playerShoot(){
  if(player.cooldown<=0 && player.alive){
    bullets.push({x:player.x+player.w/2-2, y:player.y-10, w:4, h:12, vy:-480});
    player.cooldown = 0.35;
  }
}

function aliveEnemies(){ return enemies.filter(e=>e.alive); }

function enemyBoundsCheck(){
  const alive = aliveEnemies();
  if(alive.length===0) return {min:0,max:0};
  let minX=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const e of alive){
    minX = Math.min(minX,e.x);
    maxX = Math.max(maxX,e.x+e.w);
    maxY = Math.max(maxY, e.y+e.h);
  }
  return {minX,maxX,maxY};
}

function update(dt){
  if(state!=='playing') return;

  animTimer += dt;
  if(animTimer > 0.4){ animTimer=0; animFrame = 1-animFrame; }

  if(shakeTime>0) shakeTime -= dt;

  // player movement
  if(player.alive){
    if(keys['ArrowLeft']||keys['KeyA']) player.x -= player.speed*dt;
    if(keys['ArrowRight']||keys['KeyD']) player.x += player.speed*dt;
    player.x = Math.max(6, Math.min(W-player.w-6, player.x));
    if(keys['Space']) playerShoot();
    if(player.cooldown>0) player.cooldown -= dt;
  } else {
    player.blinkTimer += dt;
  }

  // bullets
  bullets.forEach(b=> b.y += b.vy*dt);
  bullets = bullets.filter(b=> b.y > -20);

  enemyBullets.forEach(b=> b.y += b.vy*dt);
  enemyBullets = enemyBullets.filter(b=> b.y < H+20);

  // particles
  particles.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.life -= dt; });
  particles = particles.filter(p=>p.life>0);

  // enemy formation movement
  const alive = aliveEnemies();
  if(alive.length>0){
    // speed up as fewer remain
    const speedFactor = Math.max(0.35, alive.length / enemies.length);
    enemyStepTimer += dt;
    const interval = enemyMoveInterval * speedFactor + 0.03;
    if(enemyStepTimer >= interval){
      enemyStepTimer = 0;
      const b = enemyBoundsCheck();
      let willDrop = false;
      if(enemyDir>0 && b.maxX >= W-14) willDrop = true;
      if(enemyDir<0 && b.minX <= 14) willDrop = true;

      if(willDrop){
        const cfg = levelConfig(level);
        for(const e of alive) e.y += cfg.dropAmount;
        enemyDir *= -1;
      } else {
        for(const e of alive) e.x += enemyDir * 10;
      }
    }

    // enemy shooting
    enemyShootTimer += dt;
    if(enemyShootTimer >= enemyShootInterval){
      enemyShootTimer = 0;
      // pick random column shooter (frontmost per some columns)
      const shooters = [];
      const byCol = {};
      for(const e of alive){
        const key = Math.round(e.x/10);
        if(!byCol[key] || e.y > byCol[key].y) byCol[key]=e;
      }
      for(const k in byCol) shooters.push(byCol[k]);
      if(shooters.length){
        const cfg = levelConfig(level);
        const numShots = level>=10?2:1;
        for(let i=0;i<numShots;i++){
          const s = shooters[Math.floor(Math.random()*shooters.length)];
          enemyBullets.push({x:s.x+s.w/2-3, y:s.y+s.h, w:6, h:14, vy:cfg.bulletSpeed, color: level>=11?COLORS.red:COLORS.magenta});
        }
      }
    }

    // check if any enemy reached player line
    for(const e of alive){
      if(e.y + e.h >= player.y - 4){
        loseLife(true);
        break;
      }
    }
  } else {
    // level cleared
    state='levelcomplete';
    if(level>=15){
      state='win';
      showOverlay('VICTORY','ALL 15 WAVES REPELLED', `Final score: <span class="accent">${score}</span>. The swarm has been broken. You are the last line of orbital defense — and you held it.`, 'PLAY AGAIN');
    } else {
      showOverlay(`WAVE ${level} CLEAR`, '', `Incoming wave ${level+1} will be faster and more aggressive. Prepare yourself.`, 'NEXT WAVE ▶');
    }
    return;
  }

  // collisions: player bullets vs enemies
  for(const bullet of bullets){
    if(bullet._dead) continue;
    for(const e of alive){
      if(!e.alive) continue;
      if(bullet.x < e.x+e.w && bullet.x+bullet.w > e.x && bullet.y < e.y+e.h && bullet.y+bullet.h > e.y){
        bullet._dead = true;
        e.hp -= 1;
        if(e.hp<=0){
          e.alive = false;
          score += e.points * (1 + Math.floor(level/5));
          spawnParticles(e.x+e.w/2, e.y+e.h/2, e.type==='octo'?COLORS.red:(e.type==='crab'?COLORS.amber:COLORS.cyan), 14);
          shakeTime = 0.06; shakeMag=2;
        } else {
          spawnParticles(e.x+e.w/2, e.y+e.h/2, COLORS.phosphor, 4);
        }
        break;
      }
    }
  }
  bullets = bullets.filter(b=>!b._dead);

  // collisions: player bullets vs shields
  for(const bullet of bullets){
    if(bullet._dead) continue;
    for(const sh of shields){
      if(damageShield(sh, bullet.x, bullet.y, bullet.w, bullet.h)){
        bullet._dead = true;
        break;
      }
    }
  }
  bullets = bullets.filter(b=>!b._dead);

  // collisions: enemy bullets vs shields
  for(const bullet of enemyBullets){
    if(bullet._dead) continue;
    for(const sh of shields){
      if(damageShield(sh, bullet.x, bullet.y, bullet.w, bullet.h)){
        bullet._dead = true;
        break;
      }
    }
  }
  enemyBullets = enemyBullets.filter(b=>!b._dead);

  // collisions: enemy bullets vs player
  if(player.alive){
    for(const bullet of enemyBullets){
      if(bullet.x < player.x+player.w && bullet.x+bullet.w > player.x && bullet.y < player.y+player.h && bullet.y+bullet.h > player.y){
        bullet._dead = true;
        loseLife(false);
        break;
      }
    }
    enemyBullets = enemyBullets.filter(b=>!b._dead);
  }
}

function damageShield(sh, bx, by, bw, bh){
  const bs = sh.blockSize;
  let hit = false;
  for(let r=0;r<sh.grid.length;r++){
    for(let c=0;c<sh.grid[r].length;c++){
      if(sh.grid[r][c]<=0) continue;
      const gx = sh.x + c*bs, gy = sh.y + r*bs;
      if(bx < gx+bs && bx+bw > gx && by < gy+bs && by+bh > gy){
        sh.grid[r][c] -= 1;
        hit = true;
      }
    }
  }
  return hit;
}

function loseLife(fromInvasion){
  if(!player.alive) return;
  player.alive = false;
  spawnParticles(player.x+player.w/2, player.y+player.h/2, COLORS.cyan, 24);
  shakeTime = 0.25; shakeMag = 6;
  lives -= 1;
  updateHud();
  setTimeout(()=>{
    if(lives<=0){
      state='gameover';
      if(score>high) high = score;
      updateHud();
      showOverlay('GAME OVER', `Reached Wave ${level}`, `Your final score was <span class="accent">${score}</span>. The swarm broke through. Try again, commander.`, 'RETRY');
    } else if(fromInvasion){
      initLevel(level); // formation too close, restart wave
      state='playing';
    } else {
      player.alive = true;
      player.x = W/2-17;
      state='playing';
    }
  }, 900);
}

function nextLevel(){
  level += 1;
  overlay.classList.add('hidden');
  initLevel(level);
  state='playing';
}

// ---------- Rendering ----------
function drawStarfield(t){
  ctx.fillStyle = '#04050600';
  for(let i=0;i<60;i++){
    const x = (i*97 + 31) % W;
    const y = (i*53 + t*20*(1+(i%3))) % H;
    const s = (i%3===0)?1.6:1;
    ctx.fillStyle = i%5===0 ? 'rgba(46,231,255,0.5)' : 'rgba(200,255,220,0.35)';
    ctx.fillRect(x, y, s, s);
  }
}

function drawPlayer(){
  if(!player.alive){
    if(Math.floor(player.blinkTimer*10)%2===0) return;
  }
  const x=player.x, y=player.y;
  ctx.fillStyle = COLORS.cyan;
  ctx.shadowColor = COLORS.cyan;
  ctx.shadowBlur = 10;
  // simple cannon shape
  ctx.fillRect(x+14,y,6,8);
  ctx.fillRect(x+4,y+8,26,6);
  ctx.fillRect(x,y+14,34,6);
  ctx.shadowBlur = 0;
}

function drawShield(sh){
  const bs = sh.blockSize;
  for(let r=0;r<sh.grid.length;r++){
    for(let c=0;c<sh.grid[r].length;c++){
      const hp = sh.grid[r][c];
      if(hp<=0) continue;
      ctx.fillStyle = hp===3?'rgba(57,255,106,0.85)': hp===2?'rgba(57,255,106,0.55)':'rgba(57,255,106,0.28)';
      ctx.fillRect(sh.x+c*bs, sh.y+r*bs, bs-1, bs-1);
    }
  }
}

function draw(){
  ctx.save();
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#05070a';
  ctx.fillRect(0,0,W,H);

  drawStarfield(performance.now()/1000);

  if(shakeTime>0){
    ctx.translate((Math.random()-0.5)*shakeMag, (Math.random()-0.5)*shakeMag);
  }

  // shields
  shields.forEach(drawShield);

  // enemies
  for(const e of enemies){
    if(!e.alive) continue;
    let sprite;
    const frame = animFrame===0?'A':'B';
    if(e.type==='squid') sprite = SPR['squid'+frame];
    else if(e.type==='crab') sprite = SPR['crab'+frame];
    else sprite = SPR['octo'+frame];
    let color = e.type==='octo'?COLORS.red:(e.type==='crab'?COLORS.amber:COLORS.phosphor);
    if(e.hp < e.maxHp){ color = COLORS.dim; }
    drawSprite(sprite, e.x, e.y, 28, color, true);
  }

  // bullets
  ctx.shadowBlur=6;
  bullets.forEach(b=>{
    ctx.fillStyle = COLORS.phosphor; ctx.shadowColor=COLORS.phosphor;
    ctx.fillRect(b.x,b.y,b.w,b.h);
  });
  enemyBullets.forEach(b=>{
    ctx.fillStyle = b.color; ctx.shadowColor=b.color;
    ctx.fillRect(b.x,b.y,b.w,b.h);
  });
  ctx.shadowBlur=0;

  // particles
  particles.forEach(p=>{
    ctx.globalAlpha = Math.max(0,p.life/0.6);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x,p.y,3,3);
    ctx.globalAlpha=1;
  });

  drawPlayer();

  // ground line
  ctx.strokeStyle = 'rgba(57,255,106,0.25)';
  ctx.beginPath();
  ctx.moveTo(0,H-24); ctx.lineTo(W,H-24);
  ctx.stroke();

  ctx.restore();
}

// ---------- Main loop ----------
function loop(ts){
  if(!lastTime) lastTime = ts;
  let dt = (ts - lastTime)/1000;
  lastTime = ts;
  dt = Math.min(dt, 0.05);

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

updateHud();
requestAnimationFrame(loop);

})();

<body>

  </div>
