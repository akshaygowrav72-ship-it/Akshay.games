<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Maplewood Middle: Day 1</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>

</style></head><body>
<canvas id="c" width="640" height="480"></canvas>
<input id="ni" maxlength="12" autocomplete="off" aria-label="Your name" style="position:fixed;bottom:0;left:0;width:1px;height:1px;opacity:0">
<p>Mouse/touch: click, drag the lock dial, hold to steer your ♥ · Keys: arrows/WASD to dodge · SPACE to strike</p>
<script>
const W=640,H=480,cv=document.getElementById('c'),g=cv.getContext('2d');
let mx=0,my=0,keys={},hits=[],sel=0,moved=false,down=false,cur='',K=0;
const S={mode:'title',bg:'hall'};let D,L,Q,F,idx=0,grade=0,pac=true,combo=[];
const P={hp:20,max:20,items:['Pizza Bagel','Pizza Bagel','Capri Sun']};
const FONT=s=>g.font='bold '+s+'px "Courier New",monospace';
function pos(e){const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)*W/r.width;my=(e.clientY-r.top)*H/r.height;moved=true;S.aim=true;S.lm=performance.now()}
cv.addEventListener('pointerdown',e=>{pos(e);down=true;S.pd=performance.now();for(let i=0;i<hits.length;i++){const h=hits[i];if(mx>=h.x&&mx<=h.x+h.w&&my>=h.y&&my<=h.y+h.h){sel=i;h.fn();return}}ctx()});
addEventListener('pointermove',pos);
addEventListener('pointerup',()=>{down=false;if(S.mode=='locker')lockUp();else if(S.mode=='db'&&performance.now()-(S.pd||0)<250)dbThrow()});
addEventListener('keydown',e=>{if(document.activeElement===ni){if(e.key=='Enter')ni.blur();return}const k=e.key.toLowerCase();keys[k]=1;if(k.startsWith('arrow')||k==' ')e.preventDefault();
 if(k=='z'||k=='enter'||k==' '){if(hits.length)hits[sel]&&hits[sel].fn();else ctx()}
 else if(k=='x'&&S.mode=='fight'&&F.ph=='sub'){F.ph='menu';sel=0}
 else if(hits.length&&['arrowleft','arrowup','a','w'].includes(k))sel=(sel+hits.length-1)%hits.length;
 else if(hits.length&&['arrowright','arrowdown','d','s'].includes(k))sel=(sel+1)%hits.length});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function ctx(){if(S.mode=='dlg'||(S.mode=='fight'&&F.ph=='text'))adv();else if(S.mode=='fight'&&F.ph=='bar')stopBar();else if(S.mode=='locker')lockDown();else if(S.mode=='db'&&!down)dbThrow();else if(S.mode=='talent')tStop();else if(S.mode=='react')rStop();else if(S.mode=='explore')exAct();else if(S.mode=='status'||S.mode=='map')closeStatus()}
function setText(t){cur=t;K=0}
function adv(){if(K<cur.length){K=cur.length;return}if(S.mode=='dlg'){D.i++;if(D.i>=D.l.length)D.nx();else setText(D.l[D.i])}else F.cb()}
function next(){idx++;story[idx]()}
function wrap(t,w){const o=[];let l='';for(const x of t.split(' ')){const tt=l?l+' '+x:x;if(g.measureText(tt).width>w&&l){o.push(l);l=x}else l=tt}o.push(l);return o}
function tbox(x,y,w,h,t,k){g.fillStyle='#000';g.fillRect(x,y,w,h);g.strokeStyle='#fff';g.lineWidth=4;g.strokeRect(x,y,w,h);g.fillStyle='#fff';FONT(17);g.textAlign='left';let r=k;wrap(t,w-34).forEach((l,i)=>{g.fillText(l.slice(0,Math.max(0,r)),x+16,y+28+i*23);r-=l.length+1})}
function btn(l,x,y,w,h,fn){const i=hits.length;hits.push({x,y,w,h,fn});if(moved&&mx>=x&&mx<=x+w&&my>=y&&my<=y+h)sel=i;const s=sel==i;g.fillStyle='#000';g.fillRect(x,y,w,h);g.strokeStyle=s?'#ff0':'#f90';g.lineWidth=3;g.strokeRect(x,y,w,h);g.fillStyle=s?'#ff0':'#f90';FONT(16);g.textAlign='center';g.fillText((s?'♥ ':'')+l,x+w/2,y+h/2+6)}

const BRAD={name:'BRAD',hp:30,need:3,dmg:3,pats:['rain','side','aim'],intro:'* Brad blocks the hallway. He cracks his knuckles.',
 acts:[{n:'Check',t:'* BRAD - ATK 5 DEF 2. Big hands. Secretly failing math.',m:0},{n:'Compliment',t:'* You say his hoodie is sick. He blinks. Weird.',m:1},{n:'Offer Tutoring',t:'* "I can help with fractions." Brad turns red.',m:2}],

 lines:['DODGEBALL! GIVE ME TEN!','NO PAIN NO GAIN!','Walk it off, kid!','...You have decent form.'],flav:['* The gym smells like feet.','* A whistle pierces your soul.','* Coach doing lunges menacingly.'],

const story=[];
// ---------- LOCKER ----------
function startLocker(){L={rot:0,step:0,acc:0,drag:false,la:0,open:false,msg:'Drag the dial (or hold A/D keys). Release to stop on a number.',shake:0};S.mode='locker';hits=[]}
const HINT=['Step 1: turn RIGHT (clockwise) 2+ full turns, stop on number 1.','Step 2: turn LEFT (counter-clockwise), pass number 1 once, stop on number 2.','Step 3: turn RIGHT directly to number 3, then release.'];
function lockDown(){if(L.open){startHall();return}L.drag=true;L.la=Math.atan2(my-290,mx-320)}
function lockMove(){if(!L||!L.drag||S.mode!='locker'||L.open)return;const a=Math.atan2(my-290,mx-320);let d=a-L.la;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;L.la=a;const deg=d*57.2958;L.rot+=deg;L.acc+=deg*(L.step==1?-1:1);if(L.acc<-25)lfail('Wrong way! The lock resets. Start over.')}
addEventListener('pointermove',lockMove);
function lnum(){return((Math.round(L.rot/9)%40)+40)%40}
function lfail(m){L.step=0;L.acc=0;L.msg=m;L.shake=.5;L.drag=false}
function lockUp(){if(!L.drag)return;L.drag=false;const need=[720,360,30][L.step];if(L.acc<need){L.msg='Keep turning the right way... ('+HINT[L.step]+')';return}
 const d=Math.abs(lnum()-combo[L.step]),dd=Math.min(d,40-d);if(dd<=1){L.step++;L.acc=0;if(L.step==3){L.open=true;L.msg='CLICK! It opens! Click to continue.'}else L.msg='*click* Number '+L.step+' locked in. Now reverse direction!'}else lfail('Wrong number ('+lnum()+')! The lock resets. Start over.')}

// ---------- FIGHT ----------
function fight(e){F={e,hp:e.hp,mood:0,ph:'text',turn:0,t:0,bul:[],hx:320,hy:280,inv:0,hpShow:0,acc:0,box:{x:210,y:215,w:220,h:130},cb:null,tp:0,sp:'',dmgT:0};S.mode='fight';F.cb=()=>{F.ph='menu';sel=0;setText(e.intro)};setText('* '+e.name+' wants to fight!');sel=0}

 else if(F.ph=='hit'){F.t+=dt;if(F.t>1.2){if(F.hp<=0)win(false);else eturn()}}
 else if(F.ph=='speech'){F.t+=dt;if(F.t>1.4)startDodge()}
 else if(F.ph=='dodge'){F.t+=dt;const b=F.box,sp=170*dt;let dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),dy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
  if(!dx&&!dy&&down){const vx=mx-F.hx,vy=my-F.hy,m=Math.hypot(vx,vy);if(m>4){dx=vx/m;dy=vy/m}}const m=Math.hypot(dx,dy)||1;F.hx=Math.max(b.x+8,Math.min(b.x+b.w-8,F.hx+dx/m*sp));F.hy=Math.max(b.y+8,Math.min(b.y+b.h-8,F.hy+dy/m*sp));
  spawn(dt);F.inv-=dt;F.bul.forEach(u=>{u.x+=u.vx*dt;u.y+=u.vy*dt;if(F.inv<=0&&Math.hypot(u.x-F.hx,u.y-F.hy)<u.r+5){P.hp-=e.dmg;F.inv=1;u.dead=1}});
  F.bul=F.bul.filter(u=>!u.dead&&u.x>b.x-30&&u.x<b.x+b.w+30&&u.y>b.y-30&&u.y<b.y+b.h+30);
  if(P.hp<=0){P.hp=0;S.mode='over';sel=0}
  else if(F.t>5.5){F.ph='menu';sel=0;setText(e.flav[Math.floor(Math.random()*e.flav.length)])}}}
function drawFight(dt){upd(dt);const e=F.e;g.fillStyle='#000';g.fillRect(0,0,W,H);e.draw(320,40,performance.now()/1000,F.hit);
 FONT(16);g.textAlign='center';g.fillStyle=F.mood>=e.need?'#ff0':'#fff';g.fillText(e.name+(F.mood>=e.need?' (can be SPARED)':''),320,28);
 if(F.hpShow>0){g.fillStyle='#600';g.fillRect(250,8,140,0);g.fillStyle='#600';g.fillRect(245,200,150,10);g.fillStyle='#0f0';g.fillRect(245,200,150*Math.max(0,F.hp)/e.hp,10);if(F.dm!=null){g.fillStyle='#f33';FONT(24);g.fillText(F.dm?F.dm:'MISS',320,190)}}
 const ph=F.ph;
 if(ph=='text'||ph=='menu'||ph=='sub')tbox(30,322,580,86,cur,K);
 if(ph=='speech'){g.fillStyle='#fff';g.fillRect(400,50,210,70);g.fillStyle='#000';FONT(14);g.textAlign='left';wrap(F.sp,190).forEach((l,i)=>g.fillText(l,410,75+i*18))}
 if(ph=='bar'||ph=='hit'){g.fillStyle='#000';g.fillRect(100,300,440,70);g.strokeStyle='#fff';g.lineWidth=4;g.strokeRect(100,300,440,70);g.fillStyle='#333';g.fillRect(120,320,400,30);g.fillStyle='#0a0';g.fillRect(290,320,60,30);g.fillStyle='#ff0';g.fillRect(315,320,10,30);g.fillStyle='#fff';g.fillRect(120+Math.min(F.tp,400)-3,312,6,46);FONT(14);g.textAlign='center';g.fillStyle='#ff0';FONT(20);g.fillText('Press SPACE to strike!',320,395)}
 if(ph=='dodge'||ph=='speech'){const b=F.box;g.strokeStyle='#fff';g.lineWidth=4;g.strokeRect(b.x,b.y,b.w,b.h)}
 if(ph=='dodge'){const b=F.box;g.save();g.beginPath();g.rect(b.x,b.y,b.w,b.h);g.clip();g.shadowBlur=12;g.shadowColor=e.boss?'#f80':'#8cf';g.fillStyle=e.boss?'#fa3':'#fff';F.bul.forEach(u=>{g.beginPath();g.arc(u.x,u.y,u.r,0,7);g.fill();g.fillStyle=e.boss?'#c50':'#9bd';g.beginPath();g.arc(u.x-1,u.y-1,u.r*.5,0,7);g.fill();g.fillStyle=e.boss?'#fa3':'#fff'});g.shadowBlur=0;g.restore();
  if(F.inv<=0||Math.floor(F.inv*10)%2){g.fillStyle='#f00';FONT(24);g.textAlign='center';g.fillText('♥',F.hx,F.hy+8)}}
 // HP
 g.fillStyle='#fff';FONT(15);g.textAlign='left';g.fillText('YOU  LV1',30,420+0*1);g.fillStyle='#c00';g.fillRect(150,408,60,14);g.fillStyle='#ff0';g.fillRect(150,408,60*P.hp/P.max,14);g.fillStyle='#fff';g.fillText('HP '+P.hp+'/'+P.max,220,420);
 if(ph=='menu'){['FIGHT','ACT','ITEM','MERCY'].forEach((n,i)=>btn(n,30+i*147,436,135,34,()=>{
   if(i==0){F.ph='bar';F.tp=0;F.dm=null}
   else{F.ph='sub';F.m=i;sel=0;setText('')}}))}
 if(ph=='sub'){const m=F.m,o=[];
  if(m==1)e.acts.forEach(a=>o.push([a.n,()=>{F.mood+=a.m;etxt(a.t+(a.m&&F.mood>=e.need?' (It seems ready to calm down.)':''),eturn)}]));
  if(m==2)P.items.slice(0,3).forEach((it,i)=>o.push([it,()=>{const h=it=='Capri Sun'?6:10;P.items.splice(i,1);P.hp=Math.min(P.max,P.hp+h);etxt('* You use the '+it+'. +'+h+' HP!',eturn)}]));
  if(m==3){o.push(['Spare',()=>{if(F.mood>=e.need)win(true);else etxt('* '+e.name+' isn\'t ready to calm down yet. Try ACT.',eturn)}]);o.push(['Flee',()=>{if(e.boss)etxt('* No escaping gym class!',eturn);else{pac=false;S.bg='hall';say(['* You bolt down the hall. Coward... but alive.'],next,'🏃')}}])}
  if(!o.length)o.push(['(empty)',()=>{F.ph='menu'}]);
  o.forEach((x,i)=>btn(x[0],45+(i%2)*280,338+Math.floor(i/2)*38,260,30,x[1]));btn('Back',45+(o.length%2)*280,338+Math.floor(o.length/2)*38,260,30,()=>{F.ph='menu';sel=0})}}
// ---------- OTHER SCREENS ----------
function ending(){S.mode='end';S.bg='hall';S.em='';sel=0}
function drawTitle(){S.bg='hall';S.em='🏫';bg();g.fillStyle='#000a';g.fillRect(80,160,480,170);g.fillStyle='#fff';g.textAlign='center';FONT(32);g.fillText('MAPLEWOOD MIDDLE',W/2,215);FONT(18);g.fillText('Day 1 - Locker. Classes. Bullies. Survive.',W/2,250);btn('START',240,275,160,40,()=>{S.em='';cust()})}

  g.fillStyle='#fffbe8';g.fillRect(40,60,50,70);g.fillStyle='#e44';g.fillRect(48,68,34,8);g.fillStyle='#999';g.fillRect(48,84,34,3);g.fillRect(48,92,28,3);g.fillRect(48,100,34,3);
  g.fillStyle=lg(0,320,0,H,'#9a9688','#6c695e');g.fillRect(0,320,W,160);for(let r=0;r<6;r++)for(let c=-1;c<9;c++){g.fillStyle=(r+c)%2?'#ffffff12':'#00000012';g.fillRect(c*80+(r%2)*0,320+r*r*5,80,r*10+8)}

   if(shooting&&o.st=='idle'&&Math.abs(o.x-p.x)<130&&o.cd<=0){B.rx=(B.rx||(Math.random()<.45?9:.18+Math.random()*.3))-dt;if(B.rx<=0){o.st='block';o.jt=0;o.cd=.6;B.rx=0}}else if(!shooting)B.rx=0;
