<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spend Everyone's Money</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
    text-align: center;
  }

  header {
    padding: 30px 15px;
    background: #111;
    color: white;
  }

  h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 42px);
  }

  #money {
    margin-top: 12px;
    color: #00ff88;
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 700;
    overflow-wrap: anywhere;
  }

  .subtitle {
    margin: 12px 0 0;
    color: #ccc;
  }

  .container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
  }

  .item {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: white;
    border-radius: 12px;
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
  }

  .image-wrapper {
    position: relative;
    height: 180px;
    overflow: hidden;
    background: #e8edf2;
  }

  .item-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .image-fallback {
    display: none;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 20px;
    color: #596575;
    font-size: 15px;
    background: #e8edf2;
  }

  .item-content {
    display: flex;
    flex: 1;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  .item h2 {
    margin: 0 0 10px;
    font-size: 20px;
  }

  .price {
    margin-bottom: 8px;
    color: #137b3f;
    font-weight: 700;
  }

  .owned {
    margin: 5px 0 18px;
    color: #555;
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    width: 100%;
    margin-top: auto;
  }

  button {
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-family: inherit;
    font-size: 16px;
    cursor: pointer;
    transition: filter 0.15s, transform 0.15s;
  }

  .controls button {
    flex: 1;
  }

  button:hover:not(:disabled) {
    filter: brightness(0.92);
    transform: translateY(-1px);
  }

  button:focus-visible {
    outline: 3px solid #287bff;
    outline-offset: 3px;
  }

  .buy {
    background: #008c3a;
    color: white;
  }

  .sell {
    background: #d73535;
    color: white;
  }

  button:disabled {
    background: #ddd;
    color: #777;
    cursor: not-allowed;
  }

  footer {
    margin: 40px 15px;
    color: #555;
    font-size: 14px;
    line-height: 1.7;
  }

  @media (max-width: 360px) {
    .container {
      grid-template-columns: 1fr;
      padding: 0 12px;
    }
  }
</style>
</head>

<body>

<header>
  <h1>Spend Everyone's Money</h1>
  <div id="money" role="status" aria-live="polite"></div>
  <p class="subtitle">62 things to buy. How much can you spend?</p>
</header>

<main
  class="container"
  id="shop"
  aria-label="Items to buy"
></main>

<footer>
  Fictional spending game. Prices are illustrative, not market quotes.
  <br>
  The starting balance is fictional and does not represent anyone's net worth.
  <br>
  Photos are representative and may not show the exact item.
</footer>

      photo: "cruise-ship"
    },
    {
      name: "Football Stadium",
      price: 2_000_000_000,
      photo: "football-stadium"
    },
    {
      name: "Space Station",
      price: 150_000_000_000,
      photo: "space-station"
    },
    {
      name: "Futuristic City",
      price: 1_000_000_000_000,
      photo: "city-skyline"
    }
  ].map(item => ({
    ...item,
    count: 0
  }));

  const shop = document.getElementById("shop");
  const moneyDisplay = document.getElementById("money");

  const moneyFormatter = new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    maximumFractionDigits: 0
  });

  const countFormatter = new Intl.NumberFormat("en-US");
  const cardViews = [];

  function formatMoney(value) {
    return moneyFormatter.format(value);
  }

  function createItemImage(item, index) {
    return (
      "https://loremflickr.com/640/400/" +
      encodeURIComponent(item.photo) +
      "?lock=" +
      (index + 1)
    );
  }

  function updateDisplay() {
    moneyDisplay.textContent = formatMoney(balance);

    items.forEach((item, index) => {
      const view = cardViews[index];

      view.owned.textContent =
        `Owned: ${countFormatter.format(item.count)}`;

      view.buy.disabled = balance < item.price;
      view.sell.disabled = item.count === 0;
    });
  }

  function buyItem(index) {
    const item = items[index];

    if (balance < item.price) {
      return;
    }

    balance -= item.price;
    item.count += 1;

    updateDisplay();
  }

  function sellItem(index) {
    const item = items[index];

    if (item.count === 0) {
      return;
    }

    balance += item.price;
    item.count -= 1;

    updateDisplay();
  }

  function renderShop() {
    const fragment = document.createDocumentFragment();

    items.forEach((item, index) => {
      const card = document.createElement("article");
      card.className = "item";

      const imageWrapper = document.createElement("div");
      imageWrapper.className = "image-wrapper";

      const fallback = document.createElement("div");
      fallback.className = "image-fallback";
      fallback.textContent = `Photo unavailable: ${item.name}`;

      const image = document.createElement("img");
      image.className = "item-image";
      image.alt = `Photo representing ${item.name}`;
      image.width = 640;
      image.height = 400;
      image.loading = "lazy";
      image.decoding = "async";
      image.referrerPolicy = "no-referrer";

      image.addEventListener("error", () => {
        image.hidden = true;
        image.style.display = "none";
        fallback.style.display = "flex";
      }, { once: true });

      image.src = createItemImage(item, index);

      imageWrapper.append(image, fallback);

      const content = document.createElement("div");
      content.className = "item-content";

      const heading = document.createElement("h2");
      heading.textContent = item.name;

      const price = document.createElement("div");
      price.className = "price";
      price.textContent = formatMoney(item.price);

      const owned = document.createElement("p");
      owned.className = "owned";

      const controls = document.createElement("div");
      controls.className = "controls";

      const sell = document.createElement("button");
      sell.type = "button";
      sell.className = "sell";
      sell.textContent = "Sell";
      sell.setAttribute("aria-label", `Sell ${item.name}`);
      sell.addEventListener("click", () => sellItem(index));

      const buy = document.createElement("button");
      buy.type = "button";
      buy.className = "buy";
      buy.textContent = "Buy";
      buy.setAttribute("aria-label", `Buy ${item.name}`);
      buy.addEventListener("click", () => buyItem(index));

      controls.append(sell, buy);
      content.append(heading, price, owned, controls);
      card.append(imageWrapper, content);
      fragment.appendChild(card);

      cardViews.push({
        owned,
        buy,
        sell
      });
    });

    shop.appendChild(fragment);
    updateDisplay();
  }

  renderShop();
</script>

</html>
