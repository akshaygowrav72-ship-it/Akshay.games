<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spend Everyone's Money</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
    text-align: center;
  }

  header {
    padding: 30px 15px;
    background: #111;
    color: white;
  }

  h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 42px);
  }

  #money {
    margin-top: 12px;
    color: #00ff88;
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 700;
    overflow-wrap: anywhere;
  }

  .subtitle {
    margin: 12px 0 0;
    color: #ccc;
  }

  .container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
  }

  .item {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: white;
    border-radius: 12px;
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
  }

  .image-wrapper {
    height: 180px;
    overflow: hidden;
    background: #e8edf2;
  }

  .item-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .image-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 20px;
    color: #596575;
    font-size: 15px;
    background: #e8edf2;
  }

  [hidden] {
    display: none !important;
  }

  .item-content {
    display: flex;
    flex: 1;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  .item h2 {
    margin: 0 0 10px;
    font-size: 20px;
  }

  .price {
    margin-bottom: 8px;
    color: #137b3f;
    font-weight: 700;
  }

  .owned {
    margin: 5px 0 18px;
    color: #555;
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    width: 100%;
    margin-top: auto;
  }

  button {
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-family: inherit;
    font-size: 16px;
    cursor: pointer;
    transition: filter 0.15s, transform 0.15s;
  }

  .controls button {
    flex: 1;
  }

  button:hover:not(:disabled) {
    filter: brightness(0.92);
    transform: translateY(-1px);
  }

  button:focus-visible {
    outline: 3px solid #287bff;
    outline-offset: 3px;
  }

  .buy {
    background: #008c3a;
    color: white;
  }

  .sell {
    background: #d73535;
    color: white;
  }

  button:disabled {
    background: #ddd;
    color: #777;
    cursor: not-allowed;
  }

  footer {
    margin: 40px 15px;
    color: #555;
    font-size: 14px;
    line-height: 1.7;
  }

  @media (max-width: 360px) {
    .container {
      grid-template-columns: 1fr;
      padding: 0 12px;
    }
  }
</style>
</head>

<body>

<header>
  <h1>Spend Everyone's Money</h1>
  <div id="money" role="status" aria-live="polite"></div>
  <p class="subtitle">62 things to buy. How much can you spend?</p>
</header>

<main
  class="container"
  id="shop"
  aria-label="Items to buy"
></main>

<footer>
  Fictional spending game. Prices are illustrative, not market quotes.
  <br>
  The starting balance is fictional and does not represent anyone's net worth.
  <br>
  Photos are representative and may not show the exact item.
</footer>

<script>
  const startingBalance = 570_000_000_000_000;
  let balance = startingBalance;

  // Direct photo IDs instead of a keyword-search image service.
  const photoIds = {
    coffee: "1509042239860-f550ce710b93",
    burger: "1568901346375-23c9450c58cd",
    cinema: "1489599849927-2ee91cede3ba",
    pizza: "1513104890138-7c749659a591",
    groceries: "1542838132-92c53300491e",
    gas: "1545459720-aac8509eb02d",
    sneakers: "1542291026-7eec264c27ff",
    jeans: "1542272604-787c3835535d",
    headphones: "1505740420928-5e560c06d30e",
    watch: "1523275335684-37898b6baf30",
    smartphone: "1511707171634-5f897ff02aa9",
    laptop: "1496181133206-80ce9b88a853",
    gaming: "1486401899868-0e435ed85128",

    beach: "1507525428034-b723cf961d3e",
    house: "1600596542815-ffad4c1539a9",
    furniture: "1555041469-a586c61ea9bc",
    car: "1492144534655-ae79c964c9d7",
    wedding: "1519741497674-611481863552",
    university: "1523050854058-8df90110c9f1",
    tesla: "1560958089-b8a1929cea89",
    yacht: "1567899378494-47b22a2ae96a",
    airplane: "1436491865332-7a61a109cc05",
    skyscraper: "1486406146926-c627a92ad1ab",
    basketball: "1546519638-68e109498ffc",
    moon: "1446776811953-b23d57bd21aa",
    space: "1451187580459-43490279c0fa",
    icecream: "1563805042-7684c019e1cb",
    donut: "1551024601-bec78aea704b",
    sushi: "1579871494447-9811cf80d66c",
    cake: "1578985545062-69928b1d9587",
    books: "1507842217343-583bb7270b66",
    boardgame: "1610890716171-6b1bb98ffd09",
    teddy: "1556012018-50c5c0da73bf",
    skateboard: "1520045892732-304bc3ac5d8e",
    guitar: "1510915361894-db8b60106cb1",
    piano: "1520523839897-bd0b52f945a0",
    camera: "1516035069371-29a1b244cc32",
    drone: "1473968512647-3e447244af8f",
    vr: "1622979135225-d2ba269cf1ac",
    computer: "1587202372634-32705e3bf49c",
    pool: "1576013551627-0cc20b96c2a7",
    motorcycle: "1558981806-ec527fa84c39",
    ring: "1605100804763-247f67b3557e",
    island: "1500375592092-40eb2168fd21",
    castle: "1514539079130-25950c84af65",
    hotel: "1566073771259-6a8506099945",
    themepark: "1513889961551-628c1e5e2ee9",
    ship: "1548574505-5e239809ee19",
    stadium: "1522778119026-d647f0596c20",
    city: "1477959858617-67f85cf4f1df"
  };

  const items = [
    // Original common items: 25
    { name: "Cup of Coffee", price: 4, photo: "coffee" },
    { name: "Big Mac", price: 5, photo: "burger" },
    { name: "Movie Ticket", price: 15, photo: "cinema" },
    { name: "Pizza", price: 20, photo: "pizza" },
    { name: "Groceries (1 week)", price: 120, photo: "groceries" },
    { name: "Gas Tank Fill-Up", price: 60, photo: "gas" },
    { name: "Sneakers", price: 100, photo: "sneakers" },
    { name: "Jeans", price: 80, photo: "jeans" },
    { name: "Headphones", price: 150, photo: "headphones" },
    { name: "Smartwatch", price: 300, photo: "watch" },
    { name: "Smartphone", price: 1_000, photo: "smartphone" },
    { name: "Laptop", price: 2_000, photo: "laptop" },
    { name: "Gaming Console", price: 500, photo: "gaming" },
    { name: "4K TV", price: 1_200, photo: "television" },
    { name: "Bicycle", price: 800, photo: "bicycle" },
    { name: "Gym Membership (1 year)", price: 600, photo: "gym" },
    {
      name: "Netflix Subscription (1 year)",
      price: 180,
      photo: "cinema"
    },
    { name: "Vacation Trip", price: 3_500, photo: "beach" },
    { name: "Rent (1 month)", price: 1_800, photo: "house" },
    { name: "Furniture Set", price: 5_000, photo: "furniture" },
    { name: "Used Car", price: 15_000, photo: "car" },
    { name: "New Car", price: 35_000, photo: "car" },
    { name: "Wedding", price: 30_000, photo: "wedding" },
    {
      name: "College Tuition (1 year)",
      price: 25_000,
      photo: "university"
    },
    { name: "Home Down Payment", price: 60_000, photo: "house" },

    // Original big items: 7
    { name: "Tesla Model 3", price: 40_000, photo: "tesla" },
    { name: "Luxury Yacht", price: 150_000_000, photo: "yacht" },
    { name: "Private Jet", price: 75_000_000, photo: "airplane" },
    {
      name: "Skyscraper",
      price: 1_200_000_000,
      photo: "skyscraper"
    },
    { name: "NBA Team", price: 2_500_000_000, photo: "basketball" },
    { name: "Moon Base", price: 50_000_000_000, photo: "moon" },
    { name: "Mars Colony", price: 120_000_000_000, photo: "space" },

    // 30 additional items
    { name: "Ice Cream Cone", price: 3, photo: "icecream" },
    { name: "Donut", price: 2, photo: "donut" },
    { name: "Sushi Dinner", price: 50, photo: "sushi" },
    { name: "Birthday Cake", price: 40, photo: "cake" },
    { name: "Book", price: 18, photo: "books" },
    { name: "Board Game", price: 35, photo: "boardgame" },
    { name: "Teddy Bear", price: 25, photo: "teddy" },
    { name: "Skateboard", price: 120, photo: "skateboard" },
    { name: "Acoustic Guitar", price: 400, photo: "guitar" },
    { name: "Digital Piano", price: 1_500, photo: "piano" },
    { name: "Camera", price: 2_500, photo: "camera" },
    { name: "Drone", price: 1_000, photo: "drone" },
    { name: "VR Headset", price: 500, photo: "vr" },
    { name: "Gaming PC", price: 3_000, photo: "computer" },
    { name: "Hot Tub", price: 8_000, photo: "pool" },
    { name: "Motorcycle", price: 18_000, photo: "motorcycle" },
    { name: "Grand Piano", price: 80_000, photo: "piano" },
    { name: "Diamond Ring", price: 25_000, photo: "ring" },
    { name: "Sports Car", price: 250_000, photo: "car" },
    { name: "Luxury RV", price: 300_000, photo: "car" },
    { name: "Beach House", price: 2_000_000, photo: "house" },
    { name: "Mansion", price: 20_000_000, photo: "house" },
    { name: "Private Island", price: 80_000_000, photo: "island" },
    { name: "Castle", price: 100_000_000, photo: "castle" },
    { name: "Luxury Hotel", price: 500_000_000, photo: "hotel" },
    {
      name: "Theme Park",
      price: 1_000_000_000,
      photo: "themepark"
    },
    { name: "Cruise Ship", price: 1_500_000_000, photo: "ship" },
    {
      name: "Football Stadium",
      price: 2_000_000_000,
      photo: "stadium"
    },
    {
      name: "Space Station",
      price: 150_000_000_000,
      photo: "space"
    },
    {
      name: "Futuristic City",
      price: 1_000_000_000_000,
      photo: "city"
    }
  ].map(item => ({
    ...item,
    count: 0
  }));

  const shop = document.getElementById("shop");
  const moneyDisplay = document.getElementById("money");
  const cardViews = [];

  const moneyFormatter = new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    maximumFractionDigits: 0
  });

  const countFormatter = new Intl.NumberFormat("en-US");

  function formatMoney(value) {
    return moneyFormatter.format(value);
  }

  function createItemImage(item) {
    const photoId = photoIds[item.photo];

    return (
      `https://images.unsplash.com/photo-${photoId}` +
      "?auto=format&fit=crop&w=640&q=80"
    );
  }

  function updateDisplay() {
    moneyDisplay.textContent = formatMoney(balance);

    items.forEach((item, index) => {
      const view = cardViews[index];

      view.owned.textContent =
        `Owned: ${countFormatter.format(item.count)}`;

      view.buy.disabled = balance < item.price;
      view.sell.disabled = item.count === 0;
    });
  }

  function buyItem(index) {
    const item = items[index];

    if (balance < item.price) return;

    balance -= item.price;
    item.count += 1;

    updateDisplay();
  }

  function sellItem(index) {
    const item = items[index];

    if (item.count === 0) return;

    balance += item.price;
    item.count -= 1;

    updateDisplay();
  }

  function renderShop() {
    const fragment = document.createDocumentFragment();

    items.forEach((item, index) => {
      const card = document.createElement("article");
      card.className = "item";

      const imageWrapper = document.createElement("div");
      imageWrapper.className = "image-wrapper";

      const fallback = document.createElement("div");
      fallback.className = "image-fallback";
      fallback.textContent = `Photo unavailable: ${item.name}`;
      fallback.hidden = true;

      const image = document.createElement("img");
      image.className = "item-image";
      image.alt = `Representative photo for ${item.name}`;
      image.width = 640;
      image.height = 400;
      image.loading = "lazy";
      image.decoding = "async";
      image.referrerPolicy = "no-referrer";

      image.addEventListener("error", () => {
        image.hidden = true;
        fallback.hidden = false;
      }, { once: true });

      image.src = createItemImage(item);

      imageWrapper.append(image, fallback);

      const content = document.createElement("div");
      content.className = "item-content";

      const heading = document.createElement("h2");
      heading.textContent = item.name;

      const price = document.createElement("div");
      price.className = "price";
      price.textContent = formatMoney(item.price);

      const owned = document.createElement("p");
      owned.className = "owned";

      const controls = document.createElement("div");
      controls.className = "controls";

      const sell = document.createElement("button");
      sell.type = "button";
      sell.className = "sell";
      sell.textContent = "Sell";
      sell.setAttribute("aria-label", `Sell ${item.name}`);
      sell.addEventListener("click", () => sellItem(index));

      const buy = document.createElement("button");
      buy.type = "button";
      buy.className = "buy";
      buy.textContent = "Buy";
      buy.setAttribute("aria-label", `Buy ${item.name}`);
      buy.addEventListener("click", () => buyItem(index));

      controls.append(sell, buy);
      content.append(heading, price, owned, controls);
      card.append(imageWrapper, content);
      fragment.appendChild(card);

      cardViews.push({ owned, buy, sell });
    });

    shop.appendChild(fragment);
    updateDisplay();
  }

  renderShop();
</script>

</body>
</html>
