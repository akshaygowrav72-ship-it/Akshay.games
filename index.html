<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet"> 
<style> 
    body { 
        margin: 0; 
        min-height: 100vh; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        background: #f6f6f6; 
        font-family: 'Roboto', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; 
    } 
    a { 
        text-decoration: none; 
    } 
    h1 { 
        margin-top: 40px; 
        margin-bottom: 40px; 
        font-size: 60px; 
        font-weight: 700; 
        font-family: 'Playfair Display', serif; 
        color: #222; 
        text-align: center; 
    } 
 
    /* Main grid: 3 columns, 5 rows */ 
    .grid { 
        display: grid; 
        grid-template-columns: repeat(3, 400px); 
        gap: 24px; 
        justify-content: center; 
        margin-bottom: 24px; 
    } 
 
    /* Bottom row: two buttons, each exactly half the width of the grid above */ 
    .bottom-row { 
        display: flex; 
        gap: 24px; 
        width: 1248px; 
        margin: 0 auto 40px; 
    } 
 
    .btn { 
        height: 175px; 
        font-size: 40px; 
        font-weight: 700; 
        font-family: 'Roboto', sans-serif; 
        border-radius: 12px; 
        border: 2px solid rgba(0,0,0,0.2); 
        cursor: pointer; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        text-align: center; 
        transition: transform 0.1s ease, box-shadow 0.1s ease; 
        line-height: 1.2; 
        color: #fff; 
        width: 100%; 
    } 
 
    .bottom-row a { 
        flex: 1; 
        display: block; 
    } 
 
    .btn:hover { 
        transform: translateY(-3px); 
        box-shadow: 0 10px 22px rgba(0,0,0,0.18); 
    } 
 
    .btn:active { 
        transform: translateY(0); 
        box-shadow: 0 5px 12px rgba(0,0,0,0.22); 
    } 
 
    #a-l { background: #B06500; color: #000; } 
    #bm { background: #66FF00; color: #000; } 
    #dl { background: #FF0000; color: #000; } 
    #pf { background: #40E0D0; color: #000; } 
    #dap-cir { background: #ACE1AF; color: #000; } 
    #ml { background: #7fdddd; color: #000; } 
    #nd { background: #FFA500; color: #000; } 
    #nl { background: #FFFF00; color: #000; } 
    .or-tr { background: #000; color: #90ee90; } 
    #rs { background: #FF00FF; color: #fff; } 
    #sem { background: #90ee90; color: #000; } 
    #st { background: #93bb65; color: #000; } 
    #the-size-of-everything { background: #000080; color: #fff; } 
    #wl { background: #C49900; color: #000; } 
  #godling {
    background: #8B0000;
    color: #FFD700;
    position: relative;
    overflow: hidden;
    text-shadow: 0 2px 3px rgba(0,0,0,0.5);
    border: 3px solid #D4AF37;
    box-shadow: inset 0 0 0 3px #8B0000, 0 0 10px rgba(212,175,55,0.5);
}
    #mr { background: #04D9FF; color: #fff; } 
    #arcade { background: #1F51FF; color: #fff; box-shadow: 0 0 12px #1F51FF, 0 0 24px #1F51FF; } 
    #arcade:hover { box-shadow: 0 0 18px #1F51FF, 0 0 36px #1F51FF, 0 10px 22px rgba(0,0,0,0.18); } 
</style>
