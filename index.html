
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akshay.games</title>

  <link
    rel="icon"
    type="image/png"
    href="https://i.postimg.cc/26cXVWW9/Screenshot_2025_12_28_2_47_17_PM.png"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #ffffff;
      color: #222;
      font-family: 'Roboto', system-ui, -apple-system,
        BlinkMacSystemFont, sans-serif;
    }

    h1 {
      margin: 40px 16px;
      font-size: clamp(36px, 7vw, 60px);
      font-weight: 700;
      font-family: 'Playfair Display', serif;
      color: #222;
      text-align: center;
    }

    main {
      width: min(1248px, calc(100% - 32px));
      margin-bottom: 40px;
    }

    .grid,
    .bottom-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      margin-bottom: 24px;
    }

    .btn {
      min-width: 0;
      min-height: 175px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-decoration: none;
      font-size: clamp(26px, 3vw, 40px);
      font-weight: 700;
      line-height: 1.2;
      border-radius: 12px;
      border: 2px solid rgba(0, 0, 0, 0.2);
      cursor: pointer;
      color: #fff;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.22);
    }

    .btn:focus-visible {
      outline: 3px solid #222;
      outline-offset: 4px;
    }

    #bm {
      background: #66FF00;
      color: #000;
    }

    #dl {
      background: #FF0000;
      color: #000;
    }

    #chemical-craft,
    #book-battle {
      background: #40E0D0;
      color: #000;
    }

    #ml {
      background: #7FDDDD;
      color: #000;
    }

    #nd {
      background: #FFA500;
      color: #000;
    }

    #nl {
      background: #FFFF00;
      color: #000;
    }

    #sem {
      background: #90EE90;
      color: #000;
    }

    #st {
      background: #93BB65;
      color: #000;
    }

    #arcade {
      background: #1F51FF;
      color: #fff;
      box-shadow:
        0 0 12px #1F51FF,
        0 0 24px #1F51FF;
    }

    #arcade:hover {
      box-shadow:
        0 0 18px #1F51FF,
        0 0 36px #1F51FF,
        0 10px 22px rgba(0, 0, 0, 0.18);
    }

    #godling {
      background: #8B0000;
      color: #FFD700;
      position: relative;
      overflow: hidden;
      text-shadow: 0 2px 3px rgba(0, 0, 0, 0.5);
      border: 3px solid #D4AF37;
      box-shadow:
        inset 0 0 0 3px #8B0000,
        0 0 10px rgba(212, 175, 55, 0.5);
    }

    #ms {
      width: 100%;
      background: #FFBF00;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.45);
    }

    footer {
      margin-top: auto;
      padding: 0 16px 24px;
      color: #222;
      text-align: center;
    }

    @media (max-width: 850px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .bottom-row {
        gap: 12px;
      }

      .bottom-row .btn {
        padding: 10px;
        font-size: clamp(18px, 4vw, 30px);
      }
    }

    @media (max-width: 520px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .btn {
        min-height: 140px;
      }

      .bottom-row .btn {
        min-height: 120px;
      }
    }
  </style>
</head>

<body>
  <h1>AKSHAY.GAMES</h1>

  <main>
    <div class="grid">
      <a href="b-m.html" class="btn" id="bm">
        Progress
      </a>

      <a href="d-l.html" class="btn" id="dl">
        Logos
      </a>

      <a href="ip.html" class="btn" id="chemical-craft">
        Chemical Craft
      </a>

      <a href="m-l.html" class="btn" id="ml">
        Million
      </a>

      <a href="n-d.html" class="btn" id="nd">
        Vacation
      </a>

      <a href="n-l.html" class="btn" id="nl">
        Radiation
      </a>

      <a href="p-f.html" class="btn" id="book-battle">
        Book Battle
      </a>

      <a href="s-e-m.html" class="btn" id="sem">
        Spend Elon Musk's Money
      </a>
    </div>

    <div class="bottom-row">
      <a href="s-t.html" class="btn" id="st">
        Money
      </a>

      <a href="arcade.html" class="btn" id="arcade">
        Arcade
      </a>

      <a href="godling.html" class="btn" id="godling">
        Godling
      </a>
    </div>

    <a href="m-s.html" class="btn" id="ms">
      Middle School Simulator
    </a>
  </main>

  <footer>© Akshay Gowrav, 2026</footer>
</body>
</html>


  <footer>© Akshay Gowrav, 2026</footer>
</body>
</html>
